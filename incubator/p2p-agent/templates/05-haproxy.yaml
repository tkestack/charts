{{- if .Values.haproxy.enabled }}
{{- if eq .Values.global.deployMode "leecher" }}
  {{- fail "haproxy.enabled=true is not supported with global.deployMode=leecher: HAProxy fronts the seeders that serve cross-cluster image traffic, and a leecher-only cluster has none. Use deployMode seeder or mixed, or set haproxy.enabled=false" }}
{{- end }}
# HAProxy is a L4 TCP ingress for cross-cluster image traffic and uses hostNetwork.
# One pod per node selected by affinity.haproxy; ClusterFirstWithHostNet is required
# to resolve in-cluster headless services.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: p2p-haproxy
  namespace: {{ .Values.global.namespace }}
  labels:
    app: p2p-haproxy
spec:
  selector:
    matchLabels:
      app: p2p-haproxy
  template:
    metadata:
      labels:
        app: p2p-haproxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
{{ toYaml .Values.tolerations.server | indent 8 }}
      affinity:
{{ toYaml .Values.affinity.haproxy | indent 8 }}
      containers:
        - name: haproxy
          image: "{{ .Values.images.haproxy.image }}:{{ .Values.images.haproxy.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - name: registry-in
              containerPort: {{ .Values.haproxy.registryPort }}
              hostPort: {{ .Values.haproxy.registryPort }}
              protocol: TCP
            {{/* stats 只监听 127.0.0.1，不声明 hostPort：运维面不对节点网络开放 */}}
            - name: stats
              containerPort: {{ .Values.haproxy.statsPort }}
              protocol: TCP
{{- with .Values.resources.haproxy }}
          resources:
            {{- toYaml . | nindent 12 }}
{{- end }}
          {{/*
          探针走 127.0.0.1：hostNetwork 下 Pod 与宿主机共享网络命名空间，
          httpGet 的 host 默认是 podIP(=节点IP)，而 stats 只 bind 在回环地址上，
          必须显式指定 host 否则探测会连不上。
          */}}
          livenessProbe:
            tcpSocket:
              host: 127.0.0.1
              port: {{ .Values.haproxy.statsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /stats
              port: {{ .Values.haproxy.statsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: p2p-haproxy-config
---
# HAProxy 配置：把集群A的镜像拉取流量四层(TCP)均衡到集群B的 seeder 节点，
# 并通过 send-proxy-v2 透传集群A的真实源IP。
#
# 服务发现：复用本 chart 中 agent 的 seeder headless service（clusterIP: None）。
# 由于 agent 是 hostNetwork，该 service 的 DNS A 记录就是各 seeder 的"节点IP"，
# server-template 会动态解析。mixed 模式下 leecher 不在该 service 中。
apiVersion: v1
kind: ConfigMap
metadata:
  name: p2p-haproxy-config
  namespace: {{ .Values.global.namespace }}
data:
  haproxy.cfg: |
    global
        log stdout format raw local0 info
        maxconn 20000
        stats socket /tmp/haproxy.sock mode 600 level admin
        stats timeout 30s

    defaults
        log     global
        mode    tcp
        option  tcplog
        option  dontlognull
        timeout connect 5s
        timeout client  300s
        timeout server  300s
        retries 3

    # 通过 Pod 的 /etc/resolv.conf 读取 CoreDNS 地址进行动态解析。
    # 依赖 dnsPolicy: ClusterFirstWithHostNet（hostNetwork 下必须显式设置，
    # 否则 Pod 用宿主机 resolv.conf，无法解析 *.svc.cluster.local）。
    # parse-resolv-conf 需要 HAProxy >= 2.1。
    resolvers kube
        parse-resolv-conf
        resolve_retries 3
        timeout resolve 1s
        timeout retry  1s
        hold valid    10s
        hold obsolete  5s
        hold nx        5s
        hold timeout   5s
        hold refused   5s

    # 运维观测：HAProxy stats 页面。仅监听回环地址，不对节点网络开放
    # 查看方式：kubectl exec 进 Pod 后 curl http://127.0.0.1:<statsPort>/stats，
    frontend stats
        bind 127.0.0.1:{{ .Values.haproxy.statsPort }}
        mode http
        stats enable
        stats uri /stats
        stats refresh 10s
        # HAProxy >= 3.0 only reports server addresses (CSV addr column) with show-legends.
        stats show-legends

    # 集群A的 registry_mirror 指向 <haproxy节点IP>:<registryPort>
    frontend registry_in
        bind *:{{ .Values.haproxy.registryPort }}
        mode tcp
        option tcplog
        default_backend p2p_agents

    backend p2p_agents
        mode tcp
        balance source
        hash-type consistent    # 一致性哈希，节点变动时只影响 1/N 的映射
        # 说明：
        #  - send-proxy-v2  ：数据连接前发送 PROXY v2 头，携带集群A真实源IP
        #  - check-send-proxy：健康检查连接也带 PROXY 头，满足 agent 端 REQUIRE 策略
        #                      （否则健康检查会被 agent 拒绝、后端全部被判 down）
        #  - hash-key addr  ：按 seeder IP 落哈希环而非 DNS 填槽顺序，多副本对同一客户端选出同一 seeder，
        #                      集群A可配置多个 HAProxy 地址做故障切换，切换后仍命中同一 seeder 的缓存
        #  - check inter/fall/rise：TCP 健康检查，自动摘除/恢复故障 agent 节点
        default-server check check-send-proxy send-proxy-v2 hash-key addr inter 3s fall 3 rise 2
        # 动态发现：解析 seeder headless service 的 A 记录（= seeder 节点IP）。
        # 只选 seeder：leecher 用 tmpfs 且不做种，作为跨集群入口没有缓存收益。
        # 节点数超过 maxBackendServers 时调大该值。init-addr none 保证 DNS 未就绪时也能启动。
        server-template agent {{ .Values.haproxy.maxBackendServers }} p2p-agent-seeder-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.agent.portHTTP }} resolvers kube init-addr none
{{- end }}
