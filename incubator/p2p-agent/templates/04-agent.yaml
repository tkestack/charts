{{- if eq .Values.global.deployMode "mixed" -}}
  {{- $roles := list
        (dict "name" "seeder" "leecherMode" false)
        (dict "name" "leecher" "leecherMode" true)
  -}}
  {{- range $roles }}
    {{- include "p2pagent.agent-resources" (dict "root" $ "role" .) | nindent 0 -}}
  {{- end }}
{{- else -}}
  {{- $role := dict "name" "" "leecherMode" (eq .Values.global.deployMode "leecher") -}}
  {{- include "p2pagent.agent-resources" (dict "root" . "role" $role) | nindent 0 -}}
{{- end }}

{{/*
Three headless services over the same pods, so a caller can pick the role it needs
regardless of deployMode (the pods carry a `role` label in every mode):
  - p2p-agent-service         : every agent
  - p2p-agent-seeder-service  : seeders only (leechers hold no
                                cache and must not serve cross-cluster traffic)
  - p2p-agent-leecher-service : leechers only
A service whose selector matches no pod is harmless: its DNS name simply resolves
to nothing, so all three are rendered in every mode.
*/}}
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-agent-service
  namespace: {{ .Values.global.namespace }}
spec:
  clusterIP: None
  selector:
    app: p2p-agent
  ports:
    - protocol: TCP
      port: 80 # 实际没有转发作用
      targetPort: {{ .Values.agent.portHTTP}}
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-agent-seeder-service
  namespace: {{ .Values.global.namespace }}
spec:
  clusterIP: None
  selector:
    app: p2p-agent
    role: seeder
  ports:
    - protocol: TCP
      port: 80 # 实际没有转发作用
      targetPort: {{ .Values.agent.portHTTP}}
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-agent-leecher-service
  namespace: {{ .Values.global.namespace }}
spec:
  clusterIP: None
  selector:
    app: p2p-agent
    role: leecher
  ports:
    - protocol: TCP
      port: 80 # 实际没有转发作用
      targetPort: {{ .Values.agent.portHTTP}}
---
{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: p2p-agent-monitor
  namespace: {{ .Values.global.namespace }}
  labels:
    app: p2p-agent
    release: prometheus
spec:
  selector:
    matchLabels:
      app: p2p-agent
  podMetricsEndpoints:
  - port: admin-http
    path: /metrics
    interval: {{ .Values.podMonitor.interval | default "30s" }}
    scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout | default "10s" }}
    scheme: http
  namespaceSelector:
    matchNames:
    - {{ .Values.global.namespace }}
{{- end }}
