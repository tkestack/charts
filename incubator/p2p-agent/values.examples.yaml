# === P2P Agent Helm Chart - Mixed + NTracker 最小化部署示例 ===
#
# mixed 模式：同一集群同时部署 Seeder 和 Leecher
# 默认架构是 Agent + NTracker，不需要 SeedServer / MinIO / COS
# 该示例仅用于测试环境，生产环境请参考 values.yaml 和 VALUES.md
global:
  deployMode: "mixed"
agent:
  trackerType: "ntracker"
  LRUSizeGB: 50
  maxMemoryUsageMB: 2048
  registryHttps: "ccr.ccs.tencentyun.com"
  registryHttp: "ccr.ccs.tencentyun.com"
  defaultRegistry: "ccr.ccs.tencentyun.com"
  # 自动给上述仓库写入 containerd certs.d registry mirror
  containerdProxyAutoConfig: true
ntracker:
  enabled: true
minio:
  enabled: false
