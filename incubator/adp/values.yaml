# ADP Platform - 对外配置
# global 下的配置会自动传递给所有子 Chart

# ============================
# 全局配置 (自动传递给子 Chart)
# ============================
global:
  # 集群类型：包含 [minimal]、[standard] 和 [recommended] 三个配置段
  clusterSize: minimal
  # CLB 域名（必填）https://console.cloud.tencent.com/clb/instance
  clb: "xx.adp-private.com"
  # 是否校验 K8s 集群剩余资源是否充足（当部署超级节点时需要关闭）
  checkK8sResources: true
  # CLB ID（必填）
  clbId: lb-example
  # 平台访问协议: http 或 https （必填）
  scheme: https
  # CLB 监听协议: http 或 https （必填，默认与 scheme 保持一致）
  # 适用场景：当 CLB 与后端应用集群之间存在协议卸载（SSL Offload）时配置此项
  # 例如：客户端通过 https 访问 CLB，CLB 以 http 协议转发至后端集群，此时 scheme=https，clbScheme=http
  clbScheme: https
  # CLB HTTPS 证书 ID（clbScheme 为 https 时必填）https://console.cloud.tencent.com/ssl
  clbCertId: "<YOUR_CLB_CERT_ID>"
  # 内网 CLB 配置。内网 域名/TLS 全部与公网配置保持一致
  internalClb:
    # 默认保持关闭即可。适用于 内网用户和公网用户使用同一域名访问 ADP 平台的情况
    enabled: false
    # 内网 CLB ID（开启必填）
    clbId: lb-internal-example
  # 是否开启secapi，建议保持默认false
  secapi_enable: false
  # 镜像仓库地址（勿动）
  imageRegistry: "ccr.ccs.tencentyun.com"

  # RSA 密钥配置（必填）用于前后端加解密登录密码
  # 生成方法:
  #   1. 生成私钥: openssl genrsa -out private.pem 2048
  #   2. 生成公钥: openssl rsa -in private.pem -pubout -out public.pem
  #   3. Base64编码: cat private.pem | base64 -w 0 > privateKey.txt
  #                  cat public.pem | base64 -w 0 > publicKey.txt
  rsa:
    privateKey: "<YOUR_RSA_PRIVATE_KEY_BASE64>"
    publicKey: "<YOUR_RSA_PUBLIC_KEY_BASE64>"

  # ============================
  # 基础组件配置 (components)
  # ============================
  # vendor: 云厂商标识 (tencent/aws/alibaba/azure/gcp/huawei/self)
  # providerType: 具体产品类型，结合 vendor 唯一标识组件实现
  components:
    # 数据库配置 (必填) https://cloud.tencent.com/product/tdsql
    db:
      vendor: tencent
      providerType: tdsql  # tencent: tdsql/cynosdb | aws: aurora/rds | alibaba: polardb | self: mysql/mariadb
      host: "192.168.0.1"
      port: 3306
      user: "<YOUR_DB_USER>"
      password: "<YOUR_DB_PASSWORD>"

    # Redis 缓存配置 (必填) https://cloud.tencent.com/product/crs
    redis:
      vendor: tencent
      providerType: crs  # tencent: crs | aws: elasticache | alibaba: kvstore | self: redis
      cluster: master
      hosts:
        - 192.168.0.1
      port: 6379
      password: "<YOUR_REDIS_PASSWORD>"

    # Elasticsearch 配置 (必填) https://cloud.tencent.com/product/es
    es:
      vendor: tencent
      providerType: es  # tencent: es | aws: opensearch | alibaba: elasticsearch | self: elasticsearch
      hosts:
        - 192.168.0.1
      port: 9200
      user: elastic
      password: "<YOUR_ES_PASSWORD>"

    # 对象存储配置 (必填) https://cloud.tencent.com/product/cos
    s3:
      vendor: tencent
      providerType: cos  # tencent: cos | aws: s3 | alibaba: oss | azure: blob | gcp: gcs | self: minio
      # 是否启用s3代理 (非必填，true: 默认开启代理，s3默认私有读，s3资源访问转发到adp服务代理，false：关闭代理，会针对s3部分路径自动设置公有读，需要额外的cos跨域配置；)
      enableProxy: true
      # COS 专用配置 (providerType=cos 时生效)
      cos:
        secretId: "<YOUR_SECRET_ID>"
        secretKey: "<YOUR_SECRET_KEY>"
        appId: "<YOUR_COS_APP_ID>"
        bucket: "<YOUR_COS_BUCKET>"
        region: "<YOUR_COS_REGION>"
        domain: myqcloud.com
        subPath: "public"
        expireTime: 3600s
        credentialTime: 3600s
        # 是否启用 COS STS 临时凭证模式（非必填，默认 false）
        # 为 true 时，仅通过 STS 模式访问 COS 资源，禁止使用永久 secretId/secretKey；此时 stsRoleArn 必填
        enableSts: false
        # COS STS 模式的角色标识（enableSts=true 时必填，enableSts=false时无需配置）
        # 需在腾讯云控制台创建 CAM 角色，并授予以下权限策略：
        #   QcloudTsearchFullAccess: 检索分析服务（Tsearch）全读写访问权限
        #   QcloudHunYuanFullAccess: 腾讯混元大模型（Hunyuan）全读写访问权限
        #   QcloudOCRFullAccess: 文字识别全读写访问权限
        #   QcloudLKEAPFullAccess: ADP原子能力权限
        #   QcloudCOSFullAccess: 对象存储（COS）全读写访问权限
        #   QcloudWSAFullAccess: 联网搜索API（WSA）全读写访问权限
        #   QcloudAGSFullAccess: Agent 沙箱服务（AGS）全读写访问权限（启用agentRuntime需要授权该权限，用于调用ags api创建沙箱）
        #   QcloudAccessForCAM_QCSLinkedRoleInsirui: 用于cam访问其他云服务资源（启用agentRuntime需要授权该权限，用于将角色传递给沙箱实例）
        stsRoleArn: ""

    # 消息队列CKafka版 https://console.cloud.tencent.com/ckafka/instance
    kafka:
      vendor: tencent
      providerType: kafka
      hosts:
        - 192.168.0.1
      port: 9092

    # clickhouse
    clickhouse:
      # 是否禁用 ClickHouse 初始化（用于客户暂未部署 CH 的场景）
      # 默认 false（启用）；老客户 values.yaml 未填写时按启用处理，向后兼容
      disabled: false
      vendor: tencent
      providerType: clickhouse  # tencent: clickhouse |
      hosts:
        - 192.168.0.1
      port: 9000
      user: "<YOUR_CLICKHOUSE_USER>"
      password: "<YOUR_CLICKHOUSE_PASSWORD>"

  # ============================
  # Agent Runtime 配置 (必填)
  # ============================
  # Agent Runtime 是 ADP【智能工作台】和【Claw 模式】的沙箱运行环境，必须提前完成配置。
  #
  # 前置依赖（均为必填）：
  #   1. CFS 文件系统：用于沙箱之间共享用户工作目录 /users
  #      https://console.cloud.tencent.com/cfs/fs
  #      需要先在 CFS 中创建 /users 目录（在同 VPC 的 CVM 上挂载后 mkdir）
  #   2. COS 对象存储：用于存放系统与用户的 Skills 资源，复用上面 components.s3.cos 配置的 COS 桶即可
  #      需要在 COS 桶中创建 /skills/system 和 /skills/users 两个目录
  #   3. Agent Runtime 沙箱工具：需要在腾讯云控制台创建 3 个沙箱工具
  #      https://console.cloud.tencent.com/ags/sandbox/sandbox
  #
  # 详细配置流程（含控制台截图）请参见：docs/agent-runtime/README.md
  agentRuntime:
    # 是否禁用 Agent Runtime（默认 false，保持启用；禁用后【智能工作台】与【Claw 模式】将不可用）
    disabled: false
    vendor: tencent
    # 申请沙箱时配置的 CAM 角色 RoleArn（必填）
    # 沙箱工具通过该角色访问 COS、镜像仓库等云资源
    stsRoleArn: "<YOUR_AGENT_RUNTIME_STS_ROLE_ARN>"
    # 沙箱实例配置：需在腾讯云控制台预先创建 3 个沙箱工具，然后将对应 ID 填入下方
    instances:
      # Claw 模式沙箱：Claw 模式功能下沙箱运行的环境（建议规格 2C 4Gi）
      clawAgs:
        # 工具 ID，通过腾讯云沙箱列表页获取
        toolID: "<YOUR_CLAW_SANDBOX_TOOL_ID>"
      # 智能工作台沙箱：智能工作台功能下沙箱运行的环境（建议规格 4C 8Gi）
      smartDeskAgs:
        # 工具 ID，通过腾讯云沙箱列表页获取
        toolID: "<YOUR_SMART_DESK_SANDBOX_TOOL_ID>"
      # 公共沙箱：用于初始化智能工作台使用的工作目录（建议规格 2C 4Gi，常驻实例）
      commonAgs:
        # 工具 ID，通过腾讯云沙箱列表页获取
        toolID: "<YOUR_COMMON_SANDBOX_TOOL_ID>"
        # 实例 ID：进入公共沙箱工具详情，在实例列表页获取
        instanceID: "<YOUR_COMMON_SANDBOX_INSTANCE_ID>"
        # 实例 Token：进入公共沙箱工具详情，在实例列表页获取
        token: "<YOUR_COMMON_SANDBOX_INSTANCE_TOKEN>"
    # 沙箱挂载的 CFS 配置
    cfs:
      # CFS 文件系统 IP（可在 CFS 控制台 → 文件系统详情 → 挂载点信息 查看）
      ip: "<YOUR_CFS_IP>"
      # CFS 挂载路径
      path: "/users"

  # ============================
  # 可观测性配置 (observability)
  # ============================
  observability:
    # CLS 日志收集配置 (可选) https://console.cloud.tencent.com/cls/topic
    cls:
      enabled: true # 建议开启
      logsetId: "<YOUR_CLS_LOGSET_ID>"
      topicId: "<YOUR_CLS_TOPIC_ID>"

    # Prometheus 监控配置 (可选) https://console.cloud.tencent.com/tke2/prometheus2
    prometheus:
      enabled: false

    # APM 链路追踪配置 (可选) https://console.cloud.tencent.com/monitor/apm/system/list
    apm:
      vendor: tencent
      providerType: tps  # tencent: tps | aws: xray | self: jaeger
      otlp: "pl.ap-beijing.apm.tencentcs.com:4319"
      registry: ""
      attributes:
        token: "<YOUR_APM_TOKEN>"

  # ====================================================================================
  # 以下配置皆为可选配置，如需使用，请联系技术支持人员。
  # ====================================================================================

  # ============================
  # 内容安全配置 (content-security)
  # ===========================
  contentSecurity:
    # 类型: sdk（必填）
    type: sdk
    # 是否禁用内容检查（可选，填写 true 或 false）
    disableContentCheck: true
    # 审核开关（可选，填写 true 或 false）
    auditSwitch: false
    # 是否禁用图片检查（可选，填写 true 或 false）
    disableImageCheck: true
    # `bizType` （启用审核时 必选）
    bizType: "<YOUR_BIZ_TYPE>"
    # 文本内容安全配置 (可选) https://cloud.tencent.com/document/product/1124/51860
    region: ap-guangzhou
    appId: "<YOUR_APP_ID>"
    uin: "<YOUR_UIN>"
    subUin: "<YOUR_SUB_UIN>"
    secretId: "<YOUR_SECRET_ID>"
    secretKey: "<YOUR_SECRET_KEY>"
    callbackUrl: "<YOUR_CALLBACK_URL>"

  # ============================================================
  # 微信第三方平台信息
  # ============================================================
  # 申请微信开放平台账号后，第三方平台信息详情中可获取以下配置
  wechat:
    componentAppId: "<YOUR_WECHAT_THIRD_PLATFORM_APPID>"
    componentAppSecret: "<YOUR_WECHAT_THIRD_PLATFORM_SECRET>"
    componentToken: "<YOUR_WECHAT_THIRD_PLATFORM_TOKEN>"
    componentAesKey: "<YOUR_WECHAT_THIRD_PLATFORM_AES_KEY>"

  # ============================
  # 业务配置 (从 tad.global 迁移)
  # ============================
  finance:
    disabled: true
    search_disabled: true
    report_disabled: false

  deploy_mode: "standard"
  free_preview: false
  productType: "adp"
  weakPasswordList: []

  admin:
    qpm: 100
    tpm: 100000

  delete_data:
    chat_server_retention_days: 30
    retrieval_server_retention_days: 30
    plugin_config_server_retention_minutes: 1440

  retrieval_config:
    vector_recall_enable: true

  ChatServer:
    max_concurrence: 10
    role_intent_model_name: ""
    tipwords_opt_hunyuan_version: ""
    widget_optimize_model_name: ""
    workflow_config_model_name: ""
    workflow_intent_model_name: ""
    workflow_role_model_name: ""
    multi_modal:
      disabled: false

  # 自定义 annotations，部署时会注入到所有服务的 Deployment/StatefulSet/Job 中
  # 不需要时留空或注释掉具体条目即可
  # 示例:
  #   Icp-notify.cloud.infra/sync-to-cmdb: "true"
  #   Icp-notify.cloud.infra/app-name-key: nonstandardAppName
  customAnnotations: {}

  # 自定义 labels，部署时会注入到所有服务的 Deployment/StatefulSet/Job 中
  # 不需要时留空或注释掉具体条目即可
  # 示例:
  #   nonstandardAppName: "txadp"
  #   envType: "PROD"
  customLabels:
    control-by: "helm"
