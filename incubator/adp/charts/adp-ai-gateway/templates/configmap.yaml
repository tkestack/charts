kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-ai-gateway
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    default:
      builtin_providers: ["Hunyuan", "Deepseek", "Youtu", "TCADP", "ADP"]
      zhiyan:
        app_name: ai-gateway
        api_endpoint:
        api_key:
    security:
      sec_api:
        enable: true
        unsafe_domains:
        - v2.open.venus.oa.com
        - testapi.lkeap.cloud.tencent.com
        - hunyuanapi.woa.com
    plugins:
      - name: react
        properties:
          remove_tools: true
    zhiyan_plugin_config:
      app_name: ai-gateway
      api_endpoint: "otel-collect-proxy.zhiyan.tencent-cloud.net:4317"
      api_key:
    sec_api:
      enable: {{ default "" .Values.global.secapi_enable }}
      unsafe_domains: ["v2.open.venus.oa.com", "testapi.lkeap.cloud.tencent.com", "hunyuanapi.woa.com"]
    builtin_providers: ["Hunyuan", "Deepseek", "Youtu", "TCADP", "ADP"]
    # /cmds/* 管理端点鉴权
    # 切到 true 后强制 HMAC 校验
    admin_auth:
      enable: true
      token: ${ADMIN_AUTH_KEY}
    llm:
      stream_interval_timeout: 600
      cache_token_model_whitelist: ${CACHE_TOKEN_MODEL_WHITELIST}
      max_completion_tokens_model_whitelist: ${MAX_COMPLETION_TOKENS_MODEL_WHITELIST}
      rate_limit_error_codes:
      - RateLimit
      - rate_limit_exceeded
      - quota_exceeded
      - rate_limit_error
    socks_proxy: ${SOCKES_PROXY}


  client.yaml: |
    client: #客户端调用的后端配置
      namespace: {{ .Release.Namespace }}                          #针对所有后端的环境
      timeout: 2700000                                    #针对所有后端的请求最长处理时间
      filter:
        - opentelemetry
      service: #针对单个后端的配置，默认都有默认值，可以完全不用配置
        - name: trpc.adp.ai-gateway.db
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_ai_gateway_adp?timeout=3s&parseTime=true
        - name: trpc.adp.ai-gateway.redis
          target: ip://${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379
          password: '${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}'
          timeout: 800                                 #当前这个请求最长处理时间


  placeholder.yaml: |
    TRPC_GO_CLIENT_NAMESPACE: Production
    TRPC_GO_GLOBAL_NAMESPACE: Production
    TRPC_GO_PLUGINS_LOG_DEFAULT_0_LEVEL: info
    TRPC_GO_PLUGINS_LOG_DEFAULT_1_LEVEL: info
    TRPC_GO_PLUGINS_CONFIG_RAINBOW_PROVIDERS_RAINBOW_ADDRESS:
    TRPC_GO_PLUGINS_CONFIG_RAINBOW_PROVIDERS_RAINBOW_GROUP: ai-gateway
    TRPC_GO_PLUGINS_CONFIG_RAINBOW_PROVIDERS_RAINBOW_APPID: 3f090873-420d-4575-b9d2-cf6a72980a33
    TRPC_GO_PLUGINS_CONFIG_RAINBOW_PROVIDERS_RAINBOW_ENV_NAME: formal
    TRPC_GO_PLUGINS_CONFIG_RAINBOW_PROVIDERS_RAINBOW_USER_ID: 3f090873-420d-4575-b9d2-cf6a72980a33
    TRPC_GO_PLUGINS_CONFIG_RAINBOW_PROVIDERS_RAINBOW_USER_KEY: 893a409623c36b2cdcd4e0c317af6467a1fa
    AIGETAWAY_DB_TARGET: dsn://ai-gateway:yxw-1234@tcp(11.145.62.170:3306)/db_ai_gateway_adp?timeout=3s&parseTime=true
    AIGETWAY_REDIS_TARGET: ip://11.135.8.138:6379
    AIGETWAY_REDIS_PASSWD: ${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}
    ZHIYAN_PLUGIN_CONFIG_APIKEY: 11195#apm-log-fc1gc2ae6bed9cgf#10790_162090___apm
    # /cmds/* 管理端点共享密钥（HMAC-SHA256），与 model-gateway-admin 同步
    ADMIN_AUTH_KEY: a5bc6d7e5cbfa6882c105830bff4982e
    # 自定义模型 SOCKS5 代理（仅作用于 IsCustom=true 的模型；DB 凭证 proxy_url 优先于本配置）
    SOCKES_PROXY:
      enable: false
      address: "21.148.87.147:1080"
      username: "proxyuser"
      password: ""
      scheme: socks5
      bypass_hosts:
        - "https://gateway.theturbo.ai"
    MAX_COMPLETION_TOKENS_MODEL_WHITELIST:
      - "gpt-5"
      - "gpt-5.1"
      - "gpt-5-mini"
      - "gpt-5-nano"
      - "gpt-4.1"
      - "gpt-4.1-mini"
      - "gpt-4o"
      - "gpt-4o-mini"
      - "gpt-5.5"
      - "gpt-5.5-pro"
      - "gpt-5.4"
      - "gpt-5.5-pro"
      - "gpt-5.4-mini"
      - "gpt-5.4-nano"
      - "gpt-image-2"
      - "gpt-image-1.5"
      - "chatgpt-image-latest"
      - "gpt-image-1-mini"
      - "gpt-audio-mini"
      - "gpt-5.2"
    CACHE_TOKEN_MODEL_WHITELIST:
      - "glm-5.2"
      - "TCADP/glm-5.2"
      - "glm-5"
      - "TCADP/glm-5"
      - "glm-5.1"
      - "TCADP/glm-5.1"
      - "glm-5-turbo"
      - "TCADP/glm-5.0-turbo"
      - "kimi-k2.5"
      - "TCADP/kimi-k2.5"
      - "kimi-k2.6"
      - "TCADP/kimi-k2.6"
      - "minimax-m2.5"
      - "TCADP/minimax-m2.5"
      - "minimax-m2.7"
      - "TCADP/minimax-m2.7"
      - "deepseek-v4-flash"
      - "Deepseek/deepseek-v4-flash"
      - "deepseek-v4-pro"
      - "Deepseek/deepseek-v4-pro"
      - "hy3-preview"
      - "Hunyuan/hy3-preview"
      - "TCADP/claude-opus-4.7-1m"
      - "TCADP/claude-sonnet-4.6"
      - "TCADP/claude-opus-4.6"
      - "TCADP/claude-opus-4.7"
      - "TCADP/claude-opus-4.8"
      - "TCADP/claude-opus-4.8-1m"
      - "TCADP/gpt-5.4"
      - "TCADP/gpt-5.5"
      - "TCADP/gemini-3.1-pro"
      - "TCADP/glm-5v-turbo"
      - "TCADP/qwen3.5-plus"
      - "Deepseek/deepseek-v4-pro-202606"
      - "Deepseek/deepseek-v4-flash-202605"
  trpc_go.yaml: |
    global:
      # RESOLVE: keep-public
      namespace: ${TRPC_GO_GLOBAL_NAMESPACE}
      admin_port: 18888
      enable_set: N
      full_set_name: ..
      env_name: ${TRPC_GO_GLOBAL_ENV_NAME}
    server:
      app: adp
      server: ai-gateway
      bin_path: /app/bin/
      conf_path: /app/conf/
      data_path: /app/data/
      filter:
        - recovery
        - opentelemetry
        - cle-route-propagator
      stream_filter:
        - opentelemetry
      admin:
        ip: ${POD_IP}
        port: 18888
        read_timeout: 3000
        write_timeout: 60000
      service:
        - name: trpc.adp.ai-gateway.api
          port: 9090
          ip: ${POD_IP}
          network: tcp
          protocol: http_no_protocol
          timeout: 2700000
          method:
            /v1/chat/completions:
              timeout: 2700000
        - name: trpc.adp.ai-gateway.admin
          port: 9092
          ip: ${POD_IP}
          network: tcp
          protocol: trpc
    plugins:
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      log:
        default:
          - writer: console
            level: info
            caller_skip: 4
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            caller_skip: 4
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 500
              max_backups: 10
              compress: false
        llm-log:
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/llm.log
              write_mode: 2
              roll_type: size
              max_size: 500
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
    client:
      namespace: ${TRPC_GO_CLIENT_NAMESPACE}
      filter:
      - cle-route-propagator
      service:
        - name: trpc.adp.ai-gateway.db
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_ai_gateway_adp?timeout=3s&parseTime=true
        - name: trpc.adp.ai-gateway.redis
          target: ip://${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379
          password: '${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}'
          timeout: 800                                 #当前这个请求最长处理时间
