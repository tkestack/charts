  client.yaml: |
    client:
      filter:
        - debuglog
        - cle-route-propagator
        - opentelemetry
      service:
        - name: redis.plugin-config-server
          # RESOLVE: keep-private
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${AGENT_REDIS_PORT}/${PLUGIN_CONFIG_REDIS_DB}"
        - name: mysql.db_llm_plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_prod_plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: trpc.redis.agent_config
          # RESOLVE: keep-private
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${AGENT_REDIS_PORT}/${AGENT_CONFIG_REDIS_DB}"
        - name: trpc.mysql.agent_config
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: trpc.mysql.agent_config_prod
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.qbot.admin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: trpc.tcadp.agent.tdsql
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - callee: trpc.KEP.plugin_config_server.PluginConfigApi
          name: trpc.KEP.plugin-config-server.PluginConfigApi
          target: ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          namespace: Production
          timeout: 30000
        - callee: trpc.adp.plugin_config.PluginConfigApi
          name: trpc.adp.plugin_config.PluginConfigApi
          target: ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          namespace: ${NAMESPACE}
          timeout: 60000
        - name: trpc.KEP.bot_task_config_server.TaskConfig
          namespace: Production
          target: ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8000
          timeout: 3000
        - callee: trpc.adp.workflow_config.WorkflowConfig
          namespace: Production
          target: ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8000
          timeout: 60000
        - callee: trpc.KEP.bot_admin_config_server.Login
          namespace: Production
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Login
          namespace: ${NAMESPACE}
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.bot_admin_config_server.Api
          namespace: Production
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Api
          namespace: ${NAMESPACE}
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.bot_knowledge_config_server.Api
          name: trpc.KEP.bot-knowledge-config-server.Api
          target: ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092
          namespace: Production
          protocol: trpc
          env_name: formal
          timeout: 30000
        - callee: trpc.adp.kb_config.Api
          target: ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.resource_gallery.Admin
          namespace: ${NAMESPACE}
          target: ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.widget_config.WidgetConfigInner
          namespace: ${NAMESPACE}
          target: ip://adp-widget-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.platform_manager.Login
          namespace: ${NAMESPACE}
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.platform_manager.Admin
          namespace: Production
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9090
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.app_config.Admin
          target: ip://adp-app-config.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 10000
        - name: trpc.http.cos.Access
          network: tcp
          protocol: http
          target: "dns://cos-internal.${INFRA_MIDDLEWARES_S3_COS_REGION}.tencentcos.cn"
          timeout: 5000
        - name: trpc.mysql.cloud_agent
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_agent?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: trpc.mysql.cloud_agent_prod
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_agent_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - callee: trpc.adp.workflow_config.WorkflowConfigApi
          target: "ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: ${NAMESPACE}
          timeout: 60000
        - callee: trpc.adp.platform_manager.v2.Internal
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9099"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.skill_config.SkillConfigInner
          namespace: ${NAMESPACE}
          target: ${SKILL_CONFIG_INNER}
          protocol: trpc
          timeout: 600000
        - callee: trpc.adp.agent_exec_env.AgentExecEnv
          namespace: ${NAMESPACE}
          target: "ip://adp-agent-exec-env.{{ .Release.Namespace }}.svc.cluster.local:9000"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.platform_manager.Api
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9093"
          protocol: trpc
          timeout: 30000
        - callee: trpc.adp.app_config.Api
          target: "ip://adp-app-config.{{ .Release.Namespace }}.svc.cluster.local:9091"
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 10000
      namespace: ${NAMESPACE}

