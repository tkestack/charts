          # RESOLVE: keep-private
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${AGENT_REDIS_PORT}/${PLUGIN_CONFIG_REDIS_DB}"
