  trpc_go.yaml: |
    global:                             #全局配置
      namespace: ${NAMESPACE}            #环境类型，分正式production和非正式development两种类型
      env_name: ${RAINBOW_ENV_NAME}                    #环境名称，非正式环境下多环境的名称
    server:                                            #服务端配置
      app: adp                                        #业务的应用名
      server: agent-config                                    #进程服务名
      bin_path: /app/bin/                              #二进制可执行文件和框架配置文件所在路径
      conf_path: /app/conf/                            #业务配置文件所在路径
      log_path: /app/logs/
      admin:
        ip: ${POD_IP}  # admin 的 ip，配置网卡 nic 也可以
        port: 8081     # admin 的 port，必须同时配置这里的 ip port 才会启动 admin
        read_timeout: 3000
        write_timeout: 60000
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - recovery
        - debuglog
        - i18n-adp
        - cle-route-propagator
        - opentelemetry
        - cos_rewrite
      service:                                         #业务服务提供的service，可以有多个
        - name: trpc.KEP.agent-config-server.AgentConfig
          ip: ${POD_IP}
          port: 8000
          network: tcp
          protocol: trpc
          server_async: true
          idletime: 600000
          filter:
            - session
        - name: trpc.KEP.agent-config-server.AgentConfigApi
          ip: ${POD_IP}
          port: 8001
          network: tcp
          protocol: trpc
          server_async: true
          idletime: 600000
        - name: trpc.KEP.agent-config-server.TimerCheckAgentSchedulerTasks
          ip: ${POD_IP}
          port: 8002
          network: "0 */2 * * * * ?startAtOnce=0&scheduler=redis&holdTime=60"
          protocol: timer
          timeout: 120000
        - name: trpc.KEP.agent-config-server.TimerMarkedInvalidAgentRecords
          ip: ${POD_IP}
          port: 8003
          network: "0 0 2 * * *"
          protocol: timer
          timeout: 600000
        - name: trpc.KEP.agent-config-server.TimerCleanDeletedAgentsMonthly
          ip: ${POD_IP}
          port: 8004
          network: "0 0 3 1 * *"
          protocol: timer
          timeout: 600000
        - name: trpc.adp.agent_config.v2.External
          ip: ${POD_IP}
          port: 9000
          network: tcp
          protocol: trpc
          timeout: 0
          server_async: true
          idletime: 600000
          filter:
            - session
        - name: trpc.adp.agent_config.v2.Api
          ip: ${POD_IP}
          port: 9001
          network: tcp
          protocol: trpc
          timeout: 0
          server_async: true
          idletime: 600000
        - name: trpc.adp.agent_config.v2.Mcp
          ip: ${POD_IP}
          port: 9002
          network: tcp
          protocol: trpc
          timeout: 0
          server_async: true
          idletime: 600000
          filter:
            - session
            - permission
        - name: trpc.adp.agent_config.v3.External
          ip: ${POD_IP}
          port: 9010
          network: tcp
          protocol: adp-capi
          timeout: 30000
          filter:
            - session
        - name: trpc.adp.agent_config.v3.Internal
          ip: ${POD_IP}
          port: 9011
          network: tcp
          protocol: trpc
          timeout: 0
          server_async: true
          idletime: 600000
    plugins:                                          #插件配置
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: rainbow-comm
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: agent-config
            error_prefix: error
            char_scaling_factor:
              zh-CN: 1
              en-US: 3
      registry:
      selector: #针对用户自定义的selector的配置
        polaris: #针对polaris整体api的内部配置
          enable_servicerouter: true


