    AGENT_EXEC_ENV_TARGET: "ip://adp-agent-exec-env.{{ .Release.Namespace }}.svc.cluster.local:9000"
    WORKFLOW_CONFIG_API_TARGET: "ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
