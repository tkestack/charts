apiVersion: v1
kind: Service
metadata:
  labels:
    app: adp-unified-gateway
  name: adp-unified-gateway
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: tcp-8000
      port: 8000
      protocol: TCP
      targetPort: 8000
    - name: tcp-9028
      port: 9028
      protocol: TCP
      targetPort: 9028
  selector:
    app: adp-unified-gateway
  sessionAffinity: None
  type: ClusterIP
