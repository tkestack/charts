kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-platform-permission-config
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    is_private: ${IS_PRIVATE}
    role_conf:
      # RESOLVE: keep-public
      business_role_name: 管理员
      business_role_description: 主账号管理员角色
      role_id_salt: ${ROLE_ID_SALT}
    get_user_nickname_conc_limit: ${GET_USER_NICKNAME_CONC_LIMIT}
    space_member_limit: ${SPACE_MEMBER_LIMIT}
    sub_uin_default_base_permission_ids: ${SUB_UIN_DEFAULT_BASE_PERMISSION_IDS}
    resource_view_permission_ids: ${RESOURCE_VIEW_PERMISSION_IDS}
    resource_edit_permission_ids: ${RESOURCE_EDIT_PERMISSION_IDS}
    resource_no_permission_id_map: ${RESOURCE_NO_PERMISSION_ID_MAP}
    disable_permission_ids: ${DISABLE_PERMISSION_IDS}
    adp_all_permission_ids: ${ADP_ALL_PERMISSION_IDS}
    filter_user_product_permission_list:
      - adpSpace
      - lkeSystem
      - lkeOP
    # 申万定开
    single_role_mode: ${SINGLE_ROLE_MODE}
    export_presigned_expire: 48h
    ti_auth_account_conf:
      account_host: /DescribeSelfInfo
      describe_users: /DescribeUsers
      describe_main_user_names: /DescribeMainUserNames
      create_user: /CreateUser
      delete_users: /DeleteUsers
      modify_user_info: /ModifyUser
      describe_sub_accounts_by_main_user: /DescribeSubAccountsByMainUser
      disable_user: /DisableUser
      enable_user: /EnableUser
      describe_user: /DescribeUser
      describe_user_depts: /DescribeUserDepts
      describe_depts: /DescribeDepts
      describe_dept_details: /DescribeDeptDetails
      describe_parent_dept_chain_ids: /DescribeParentDeptChainIDs
      add_user_to_dept: /AddUserToDept
      remove_user_from_dept: /RemoveUserFromDept
      create_dept: /CreateDept
      delete_dept: /DeleteDept
      delete_space_data: /DeleteSpaceData
      describe_child_dept_ids: /DescribeChildDeptIDs
      get_dept_user_list: /DescribeDeptUsers
      count_users: /CountUsers
    resource_name_map:
      app: 应用开发
      knowledge: 知识库
      plugin: 插件广场
      prompt_template: 提示词模板
      widget: Widget
      skill: 技能中心
    super_admin_conf:
      necessary_permissions:
        lke:
          - lkeApp.basic
      special_platform_permissions_ids: ${SPECIAL_PLATFORM_PERMISSIONS_IDS}
      necessary_resource_permissions:
        - lke
      permission_resource_type_map: ${PERMISSION_RESOURCE_TYPE_MAP}
    default_granted_permission_ids: ${DEFAULT_GRANTED_PERMISSION_IDS}
    oneid_default_permission_ids: ${OneIDDefaultPermissionIDs}
    ioa_default_accounts: ${IOA_DEFAULT_ACCOUNTS}
    object_storage:
      {{ include "qbot.s3_storage" . }}
    task_prefix: ${TASK_PREFIX}
    task_fetch_num: ${TASK_FETCH_NUM}
    task_fetch_timeout: ${TASK_FETCH_TIMEOUT}
    task_fetch_period: ${TASK_FETCH_PERIOD}
    task_clean_enable: ${TASK_CLEAN_ENABLE}
    task_keep_rows: ${TASK_KEEP_ROWS}
    task_clean_start_hour: ${TASK_CLEAN_START_HOUR}
    task_clean_end_hour: ${TASK_CLEAN_END_HOUR}
    task_clean_slow_threshold: ${TASK_CLEAN_SLOW_THRESHOLD}
    task_delete_batch_interval: ${TASK_DELETE_BATCH_INTERVAL}
    tasks: ${TASKS}
    handle_tasks: ${HANDLE_TASKS}
    batch_set_permission_limit: ${BATCH_SET_PERMISSION_LIMIT}

  client.yaml: |
    client:
      # RESOLVE: keep-private
      filter:
        - cle-route-propagator
        - opentelemetry
      namespace: ${NAMESPACE}
      timeout: 10000
      service:
        - name: mysql.adp.permission
          # RESOLVE: keep-private
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/openplatform_permission_data?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.adp.conf
          # RESOLVE: keep-private
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/openplatform_conf_data?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - callee: trpc.adp.app_admin_proxy.Api
          namespace: ${NAMESPACE}
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Login
          namespace: ${NAMESPACE}
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.platform_charger.Finance
          namespace: ${NAMESPACE}
          target: ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090
          protocol: trpc
          timeout: 20000
        - name: trpc.adp.platform_manager.Login
          namespace: ${NAMESPACE}
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091
          timeout: 30000
        - callee: tencent-account-http
          target: dns://account.tencentyun.com:50001
          network: tcp
          protocol: http
          timeout: 10000
        - callee: tencent-sts-http
          target: dns://sts.tencentyun.com:50020
          network: tcp
          protocol: http
          timeout: 10000
        - name: trpc.adp.platform_authenticator.Authenticator
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-authenticator.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          # RESOLVE: keep-private
          timeout: 10000
        - callee: ti-auth-account-http
          target: dns://ti-perm-auth.{{ .Release.Namespace }}.svc.cluster.local:8081
          network: tcp
          protocol: http
          timeout: 10000
        - callee: trpc.adp.platform_account.Internal
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-account.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 10000
        - name: trpc.http.cos.Access
          namespace: ${CLIENT_CLIENT_SERVICE_TRPC_HTTP_COS_ACCESS_NAMESPACE}
          network: tcp
          protocol: http
          target: "dns://cos-internal.${INFRA_MIDDLEWARES_S3_COS_REGION}.tencentcos.cn"
          timeout: 10000
        - name: redis.permission.config
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${INFRA_MIDDLEWARES_REDIS_0_PORT}"
          timeout: 800
        - callee: trpc.adp.resource_gallery.Admin
          namespace: ${NAMESPACE}
          target: ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090
          protocol: trpc
          timeout: 20000
        - name: trpc.adp.platform_manager.Admin
          namespace: ${NAMESPACE}
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9090
          timeout: 30000
