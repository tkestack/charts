  trpc_go.yaml: |
    global:
      namespace: ${NAMESPACE}
      env_name: ${GLOBAL_ENV_NAME}
      enable_set: ${ENABLE_SET}
      full_set_name: ${FULL_SET_NAME}
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
    server:
      app: adp
      server: platform-permission-config
      # RESOLVE: keep-private
      filter:
        - recovery
        - i18n-adp
        - accesslog
        - cle-route-propagator
        - opentelemetry
      # RESOLVE: keep-private
      stream_filter:
        - opentelemetry
      admin:
        ip: ${POD_IP}
        port: 8081
      service:
        - name: trpc.adp.platform_permission_config.Admin
          ip: ${POD_IP}
          port: 9090
          network: tcp
          protocol: trpc
          timeout: 120000
          filter:
            - permission
        - name: trpc.adp.platform_permission_config.SuperAdmin
          ip: ${POD_IP}
          port: 9091
          network: tcp
          protocol: trpc
          timeout: 120000
        - name: trpc.adp.platform_permission_config.Api
          ip: ${POD_IP}
          port: 9092
          network: tcp
          protocol: trpc
          timeout: 25000
    plugins:
      log:
        # RESOLVE: keep-private
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/log/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      registry:
      selector:
        polaris:
          enable_servicerouter: true
          protocol: grpc
          enable_trans_meta: true
      i18n:
        i18n:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: permission
            error_prefix: error
            char_scaling_factor:
              zh: 1
              en: 3
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
          - zh-CN
          - en-US
          data_provider:
            type: rainbow
            prefix: permission
            error_prefix: error
            char_scaling_factor:
              zh: 1
              en: 3

    client:
      # RESOLVE: keep-private
      filter:
        - cle-route-propagator
        - opentelemetry
      namespace: ${NAMESPACE}
      timeout: 10000
