kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-app-channel-msg
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    sync_time_out: 1800
    sync_stream_time_out: 5
    msg_menu_text_limit: 45
    msg_menu_item_num_limit: 10
    create_session_words:
      新建对话: true
      /new: true
      /NEW: true
    reset_session_words:
      清除上下文关联: true
      /clear: true
      /CLEAR: true
    system_msg_err: 【系统消息】内部服务错误，请稍候重试。
    system_msg_creation_session_success: 【系统消息】以下是新对话。
    system_msg_creation_session_failed: 【系统消息】新建对话失败，请稍候再试。
    system_msg_reset_session_success: 【系统消息】已清空上下文关联
    system_msg_reset_session_failed: 【系统消息】清空上下文关联失败，请稍候再试。
    channel_type_map:
      wechat: 10000
      wecom: 10002
      wxkf: 10004
      wecomrobot: 10009
      line: 10011
      telegram: 10012
    component_app_id: ${COMPONENT_APP_ID}
    wx_authorize_callback_host: {{ .Values.global.scheme }}://{{ .Values.global.clb }}  #需要填写用户自己申请的域名  需要能反代回到msg服务
    wx_authorize_callback: /online/channel/callback/wx/authorize
    sse_chat_path: /v1/qbot/chat/sse
    redirect_url: {{ .Values.global.scheme }}://{{ .Values.global.clb }}/adp/#/app/knowledge/release/channel?appid=%d&appType=knowledge_qa&spaceId=default_space
    redirect_url_with_space_id: {{ .Values.global.scheme }}://{{ .Values.global.clb }}/adp/#/app/knowledge/release/channel?appid=%d&appType=knowledge_qa&spaceId=%s
    get_wx_auth_code_max_limit: 3
    streaming_throttle: 250
    not_support_msg: 暂不支持的消息类型
    env: lke
    yuanqi_api_key: xxxx
    publish_yuanqi_url: /admin_api/v2/agent/publish/yuanqi
    publish_yingyongbao_url: /admin_api/v2/agent/publish/yinyongbao
    wx_nginx_l5: ${WX_NGINX_L5}
    wx_nginx_namespace: Test
    forward_proxy_ip: adp-app-channel-proxy.{{ .Release.Namespace }}.svc.cluster.local:8000
    cos_secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
    cos_secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
    cos_bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
    cos_region: "${INFRA_MIDDLEWARES_S3_COS_REGION}"
    get_ip_max_limit: 2000
    is_open_ip_max_limit_switch: false
    message_interval_time: 800ms
    wechat_msg_time_out: 20m
    deployment_mode:
      mode: adp
    default_greeting_content: 可以这样问我：
    uncertified_wx_reply_config:
      uncertified_reply_in_5s_wx_app_ids:
      continue_keywords:
        - 继续
        - 继续。
        - 【继续】
        - 请继续
        - 继续发
      no_reply_notice: 正在思考中……可回复【继续】获取回答内容
      reply_not_complete_notice: 回答未完成，可回复【继续】获取更多回答内容
      discard_continue_notice: 模型正在思考中，请稍后回复【继续】获取更多回答内容
    storage: ${STORAGE}
    sse_chat_path_v2: /adp/v2/chat
    line_config:
      max_msg_per_push: 5
      text_buffer_max_rune: 1000
      loading_seconds: 60
    telegram_config:
      text_buffer_max_rune: 1000
    menu_select_text: "Please select an option:"
    dingtalk_stream_config:
      dingtalk_api_host: api.dingtalk.com
      dedup_ttl: 300
    etcd_config: ${ETCD_CONFIG}
    doc_parse_path: /v1/qbot/chat/docParse
    wecom_robot_stream_config:
      ws_url: "wss://openws.work.weixin.qq.com"
      ping_interval_sec: 30
      read_timeout_sec: 45
      write_timeout_sec: 10
      auth_timeout_sec: 10
      long_text_threshold: 3900
      long_merge_timeout_ms: 2000
      short_merge_timeout_ms: 600
      dedup_ttl_sec: 300
      media_presigned_url_hours: 168
      media_large_size_mb: 5
      partial_flush_interval_ms: 200
      logic_timeout_sec: 5400
      stream_max_duration_sec: 570
      stream_truncate_notice: "⏳ 任务仍在处理中，完整结果稍后会以新消息发送给你"
      push_segment_limit: 3900
    corp_assistant_push_config:
      msg_redis_ttl_hours: 24
      max_retries: 3

  channel-msg_zh-CN.json: |
    {
      "KeyWidgetNotDisplayProperly": "Widget无法正常展示\n",
      "KeyReferenceSource": "参考来源",
      "KeyReplyWithIndexOrKeyword": "你可以回复“以下序号或者关键词”进行提问 \n ",
      "KeyAnswerIncompleteContinue": " \n\n 回答未完成，可回复【继续】获取更多回答内容。",
      "KeyThinkingPleaseWait": "正在思考中...请稍候"
    }

  client.yaml: |
    client:
      filter:
        - cle-route-propagator
        - opentelemetry
      service:
        - name: mysql.qbot.admin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: tdsql.tcadp.channel
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: redis.qbot.admin
          network: tcp
          target: "ip://${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/2"
          password: ${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}
          timeout: 800
        - name: wx.nginx
          target: ip://adp-app-channel-proxy.{{ .Release.Namespace }}.svc.cluster.local:8000
          network: tcp
          protocol: http
          timeout: 20000
          namespace: ${NAMESPACE}
        - name: wx.resource.nginx
          target: ip://adp-app-channel-proxy.{{ .Release.Namespace }}.svc.cluster.local:8001
          network: tcp
          protocol: http
          timeout: 20000
          namespace: ${NAMESPACE}
        - name: trpc.KEP.channel_token_svr.ChannelTokenService
          network: tcp
          protocol: trpc
          target: ip://adp-app-channel-token.{{ .Release.Namespace }}.svc.cluster.local:8000
          timeout: 10000
          namespace: ${NAMESPACE}
        - name: trpc.KEP.bot_admin_config_server.Admin
          network: tcp
          protocol: trpc
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9090
          timeout: 5000
        - callee: trpc.ai.client
          name: trpc.ai.client
          network: tcp
          protocol: http
          target: dns://{{ .Values.global.clb }}:{{ ternary 443 80 (eq .Values.global.scheme "https") }}
          timeout: 600000
        - callee: trpc.KEP.bot_admin_config_server.Login
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 20000
        - name: trpc.KEP.bot_task_config_server.TaskConfig
          target: ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8000
          timeout: 5000
        - callee: trpc.KEP.bot_knowledge_config_server.Api
          name: trpc.KEP.bot-knowledge-config-server.Api
          target: ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 5000
        - callee: trpc.KEP.bot_admin_config_server.Api
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.kb_config.Api
          name: trpc.KEP.bot-knowledge-config-server.Api
          target: ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.workflow_config.WorkflowConfig
          target: ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8000
          timeout: 5000
        - callee: trpc.adp.app_admin_proxy.Api
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Login
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.chat_manage.Chat
          name: trpc.adp.chat_manage.Chat
          target: ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.platform_manager.Login
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091
          protocol: trpc
          timeout: 20000
        - name: trpc.http.cos.Access
          network: tcp
          protocol: http
          target: "dns://cos-internal.${INFRA_MIDDLEWARES_S3_COS_REGION}.tencentcos.cn"
          timeout: 5000
        - callee: trpc.adp.chat_manage.Chat
          namespace: ${NAMESPACE}
          target: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9093"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_config.Admin
          namespace: ${NAMESPACE}
          target: "ip://adp-app-config.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.agent_config.AgentConfig
          namespace: ${NAMESPACE}
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8000"
          protocol: trpc
          timeout: 20000
        - name: qbot.qbot.chat.ChatHttp
          callee: qbot.qbot.chat.ChatHttp
          namespace: ${NAMESPACE}
          network: tcp
          protocol: http
          target: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9099"
          timeout: 5400000
        - name: trpc.internal.ai.client
          callee: trpc.internal.ai.client
          namespace: ${NAMESPACE}
          network: tcp
          protocol: http
          target: "dns://api.adp.internal.cloud.tencent.com"
          timeout: 600000
        - callee: trpc.adp.platform_manager.Admin
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.resource_gallery.Admin
          namespace: ${NAMESPACE}
          target: "ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          timeout: 20000


  env.yaml: |
    version: 2.0.0 # 固定值，不需要修改
    kind: env # 固定值，不需要修改
    metadata:
        name: formal # 环境名称 [选填]

