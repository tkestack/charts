  placeholder.yaml: |
    NAMESPACE: Production
    ENV_NAME: formal
    RAINBOW_ENV_NAME: formal
    RAINBOW_GROUP: channel-msg-svr
    TRPC_KEP_CHANNEL_MSG_SVR_HTTP_TOKEN:
    TRPC_KEP_CHANNEL_MSG_SVR_TRPC_TOKEN:
    TRPC_KEP_TRPC_KEP_CHANNEL_MSG_SVR_API_TOKEN:

    TRPC_AI_CLIENT_TARGET: ""
    COMPONENT_APP_ID: "{{ dig "wechat" "componentAppId" "" .Values.global }}"
    WX_AUTHORIZE_CALLBACK_HOST: "https://tde.xiaowei.cloud.tencent.com"
    WX_AUTHORIZE_CALLBACK: /channel/callback/wx/test/authorize
    IS_PRIVATE: true
    NGINX_FORWARD_PROXY_TARGET: "ip://adp-app-channel-proxy.{{ .Release.Namespace }}.svc.cluster.local:8000"
    TRPC_INTERNAL_AI_CLIENT_TARGET: "dns://api.adp.internal.cloud.tencent.com"

    COS_ACCESS_TARGET:
      {{- if eq .Values.global.components.s3.providerType "minio" }}
      {{ printf "ip://minio.%s.svc.cluster.local:80" .Release.Namespace }}
      {{- else if eq .Values.global.components.s3.providerType "obs" }}
      ip://{{ .Values.global.components.s3.obs.host }}:{{ .Values.global.components.s3.obs.port }}
      {{- else }}
      dns://cos-internal.{{ .Values.global.components.s3.cos.region }}.tencentcos.cn
      {{- end }}
    COS_NAMESPACE: Production
    STORAGE:
      type: cos
      subPath: {{ .Values.global.components.s3.cos.subPath | quote }}
      cos_map:
        realtime:
          secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
          secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
          app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
          region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
          bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
          domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
          expire_time: ${INFRA_MIDDLEWARES_S3_COS_EXPIRETIME}
          credential_time: ${INFRA_MIDDLEWARES_S3_COS_CREDENTIALTIME}
          assume_role:
            role_arn: {{ .Values.global.components.s3.cos.stsRoleArn | quote }}
            duration_seconds: 43200
            refresh_ahead_seconds: 300
    ETCD_CONFIG: # etcd 部署在集群内，通过 ClusterIP Service 访问，namespace 与本服务保持一致
      endpoints:                        # etcd 集群地址列表
        - "etcd.{{ .Release.Namespace }}.svc.cluster.local:2379"
      dial_timeout: 5                   # etcd 连接超时（秒），默认 5
      lease_ttl: 3                      # etcd 租约 TTL（秒），默认 3
      takeover_timeout: 45              # PreStop 等待接管超时（秒），默认 45
      drain_timeout: 30                 # 排水超时（秒），默认 30
      rebalance_timeout: 10             # Rebalance 移除等待超时（秒），默认 10
      health_check_interval: 5          # 健康检查间隔（秒），默认 5
      max_local_retries: 3              # 本地重连最大次数，默认 3
      retry_base_delay: 1000            # 重连指数退避基础延迟（毫秒），默认 1000
      retry_max_delay: 8000             # 重连指数退避最大延迟（毫秒），默认 8000
    WX_NGINX_L5: adp_channel_https_forward_proxy


  trpc_go.yaml: |
    global:
      namespace: ${POD_NAMESPACE}
      env_name: dev
      enable_set: false
      full_set_name: adp
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
    server:
      app: adp
      server: app-channel
      bin_path: /usr/local/trpc/bin/
      conf_path: /usr/local/trpc/conf/
      data_path: /usr/local/trpc/data/
      filter:
        - recovery
        - i18n-adp
        - debuglog
        - cle-route-propagator
        - opentelemetry
        - cos_rewrite
      admin:
        ip: ${POD_IP}
        port: 8081
      service:
        - name: trpc.KEP.channel-msg-svr.HTTP
          ip: ${POD_IP}
          port: 8000
          network: tcp
          protocol: http_no_protocol
          timeout: 50000
          server_async: true
          idletime: 600000
        - name: trpc.KEP.channel-msg-svr.trpc
          ip: ${POD_IP}
          port: 8001
          network: tcp
          protocol: trpc
          timeout: 50000
          server_async: true
          idletime: 600000
          filter:
            - session
            - permission
        - name: trpc.KEP.trpc.KEP.channel-msg-svr.Api
          ip: ${POD_IP}
          port: 8002
          network: tcp
          protocol: trpc
          timeout: 50000
          server_async: true
          idletime: 600000
    plugins:
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: rainbow-comm
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/log/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      registry:
      selector:
        polaris:
          protocol: grpc
          enable_servicerouter: true
          enable_trans_meta: true
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
