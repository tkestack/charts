  trpc_go.yaml: |
    global:
      # RESOLVE: keep-public
      namespace: ${NAMESPACE}
      env_name: ${RAINBOW_ENV_NAME}
      enable_set: false
      full_set_name: adp
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
    server:
      app: adp
      server: plugin-config
      bin_path: /app/bin/
      conf_path: /app/conf/
      data_path: /app/data/
      filter:
        - recovery
        - i18n-adp
        - opentelemetry
        - cos_rewrite
      stream_filter:
        - recovery
      admin:
        ip: ${POD_IP}
        port: 8081
      service:
        - name: trpc.KEP.plugin-config-server.PluginConfig
          ip: ${POD_IP}
          port: 8000
          network: tcp
          protocol: trpc
          timeout: 0
          server_async: true
          idletime: 600000
          filter:
            - session
            - permission
        - name: trpc.KEP.plugin-config-server.PluginConfigApi
          ip: ${POD_IP}
          port: 8001
          network: tcp
          protocol: trpc
          timeout: 0
          server_async: true
          idletime: 600000
        - name: trpc.KEP.plugin-config-server.PluginConfigHttp
          ip: ${POD_IP}
          port: 8002
          network: tcp
          protocol: http
          timeout: 0
          server_async: true
          idletime: 600000
        - name: trpc.KEP.plugin-config-server.RefreshTokenCron
          ip: ${POD_IP}
          port: 9001
          network: "0 */2 * * * *?startAtOnce=1&scheduler=refreshTokenCronService&holdTime=120"
          protocol: timer
        - name: trpc.adp.plugin_config.Mcp
          ip: ${POD_IP}
          port: 8003
          network: tcp
          protocol: trpc
          timeout: 0
          server_async: true
          idletime: 600000
          filter:
            - session
            - permission
        - name: trpc.adp.plugin_config.v2.External
          ip: ${POD_IP}
          port: 8004
          network: tcp
          protocol: adp-capi
          timeout: 0
          server_async: true
          idletime: 600000
          filter:
            - session
            - permission
        - name: trpc.KEP.plugin-config-server.SyncCallCountCron
          ip: ${POD_IP}
          port: 9002
          network: "0 30 0/4 * * *?startAtOnce=1&scheduler=syncCallCountCronService&holdTime=500"
          protocol: timer
    plugins:
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: rainbow-comm
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: plugin
            error_prefix: error
            char_scaling_factor:
              zh-CN: 1
              en-US: 3
      registry:

    client:
      timeout: 60000000
      namespace: ${NAMESPACE}
      filter:
        - opentelemetry
      service:
        - name: redis.plugin-config-server
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/23"
        - name: redis-cluster.plugin-config-server
          target: "redis://${PLUGIN_REDIS_CLUSTER_USER}:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/23"
        - name: redis-cluster-readonly.plugin-config-server
          target: "redis://${PLUGIN_REDIS_CLUSTER_READONLY_USER}:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/23"
        - name: mysql.db_llm_plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_prod_plugin
