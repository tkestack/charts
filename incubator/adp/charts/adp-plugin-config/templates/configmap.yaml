  llmsgw.yaml: |
    create_open: false
    invoke_open: false
    client:
      secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
      secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
      endpoint: apis.${INFRA_MIDDLEWARES_S3_COS_REGION}.tencentcloudapi.woa.com
      region: ap-nanjing
    instance:
      instance_id: ins-fbdfd9be
      app_id: aga-a54ccc08
      app_sse_url_format: ''
      app_streamable_url_format: ''
    scf_default:
      url_suffixes:
        - .in.ap-guangzhou.tencentscf.com
      scf_proxy: scf.ap-guangzhou-1.regioninvoke.oldhttpobj.production.polaris
      http_host_type: customHost
    create_default:
      Mode: proxy
      TargetSelect: random
      TargetHostRank: 10
      HttpHostType: targetHost
      InvokeLimitConfigStatus: false
      InvokeLimitConfig:
        Type: tokenBucket
        TokenBucketMaxNum: 20000
        TokenBucketRate: 1
        FunnelMaxNum: 20000
        FunnelRate: 1
