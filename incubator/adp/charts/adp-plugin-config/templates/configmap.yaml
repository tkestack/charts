kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-plugin-config
  namespace: {{ .Release.Namespace }}
data:
  client.yaml: |
    client:
      timeout: 60000000
      namespace: ${NAMESPACE}
      filter:
        - opentelemetry
      service:
        - name: redis.plugin-config-server
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/23"
        - name: redis-cluster.plugin-config-server
          target: "redis://${PLUGIN_REDIS_CLUSTER_USER}:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/23"
        - name: redis-cluster-readonly.plugin-config-server
          target: "redis://${PLUGIN_REDIS_CLUSTER_READONLY_USER}:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/23"
        - name: mysql.db_llm_plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_prod_plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - callee: trpc.KEP.bot_admin_config_server.Api
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.bot_admin_config_server.Login
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Api
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Login
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.bot_task_config_server.TaskConfig
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8000"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.workflow_config.WorkflowConfig
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8000"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.workflow_config.WorkflowConfigApi
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-workflow-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          protocol: trpc
          timeout: 20000
        - name: trpc.http.cos.Access
          namespace: Production
          network: tcp
          protocol: http
          target: {{ if eq .Values.global.components.s3.providerType "minio" }}{{ printf "ip://minio.%s.svc.cluster.local:80" .Release.Namespace }}{{- else if eq .Values.global.components.s3.providerType "obs" }}ip://{{ .Values.global.components.s3.obs.host }}:{{ .Values.global.components.s3.obs.port }}{{- else }}dns://cos-internal.{{ .Values.global.components.s3.cos.region }}.tencentcos.cn{{- end }}
        - callee: trpc.KEP.code_interpreter_dispatcher.CodeExec
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-plugin-code-interpret.{{ .Release.Namespace }}.svc.cluster.local:8001"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.plugin_code_interpret.CodeExec
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-plugin-code-interpret.{{ .Release.Namespace }}.svc.cluster.local:8001"
          protocol: trpc
          timeout: 20000
        - callee: trpc.smartservice.accessmanager.AccessManager
          name: trpc.SmartService.AccessManagerServer.AccessManager
          target: "ip://adp-access-manager.{{ .Release.Namespace }}.svc.cluster.local:10001"
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          # RESOLVE: keep-public
          env_name: ${ACCESS_MANAGER_ENV_NAME}
          set_name: commonset.sz.common1
          timeout: 3000
        - callee: trpc.KEP.agent_config_server.AgentConfigApi
          name: trpc.KEP.agent-config-server.AgentConfigApi
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.agent_config.AgentConfigApi
          name: trpc.KEP.agent-config-server.AgentConfigApi
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 60000
        - name: qbot.finance.finance.Finance
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          network: tcp
          timeout: 30000
        - callee: trpc.SmartService.AIConfManagerServer.AIConfManager
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          name: trpc.SmartService.AIConfManagerServer.AIConfManager
          target: "ip://adp-aiconf-manager.{{ .Release.Namespace }}.svc.cluster.local:10002"
          timeout: 3000
          # RESOLVE: keep-public
          env_name: ${AI_CONF_MANAGER_ENV_NAME}
        - callee: trpc.KEP.bot_data_statistics_server.Api
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-metrology.{{ .Release.Namespace }}.svc.cluster.local:8000"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.platform_metrology.Api
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-metrology.{{ .Release.Namespace }}.svc.cluster.local:8000"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.platform_manager.Admin
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_config.Api
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-app-config.{{ .Release.Namespace }}.svc.cluster.local:9091"
          timeout: 30000
        - callee: trpc.adp.app_config.Admin
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-app-config.{{ .Release.Namespace }}.svc.cluster.local:9090"
          timeout: 30000
        - callee: trpc.adp.platform_manager.Login
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 6000
        - callee: trpc.smartassistant.vectordbmanager.VectorObj
          target: "ip://adp-kb-vdb-proxy.{{ .Release.Namespace }}.svc.cluster.local:10001"
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          env_name: pre
          set_name: commonset.sz.common1
          timeout: 20000
        - callee: trpc.adp.kb_vdb_proxy.VectorObj
          target: "ip://adp-kb-vdb-proxy.{{ .Release.Namespace }}.svc.cluster.local:10001"
          # RESOLVE: keep-public
          namespace: ${NAMESPACE}
          env_name: pre
          set_name: commonset.sz.common1
          timeout: 20000
        - name: trpc.adp.kb_retrieval.Retrieval
          namespace: Test
          target: "ip://adp-kb-retrieval.{{ .Release.Namespace }}.svc.cluster.local:9090"
          timeout: 30000
        - name: trpc.adp.kb_retrieval.DirectIndex
          namespace: Test
          target: "ip://adp-kb-retrieval.{{ .Release.Namespace }}.svc.cluster.local:9091"
          timeout: 30000
        - name: trpc.adp.ai_gateway.Admin
          network: tcp
          protocol: trpc
          target: "ip://adp-ai-gateway.{{ .Release.Namespace }}.svc.cluster.local:9092"
        - name: trpc.adp.platform_charger.Finance
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          network: tcp
          timeout: 30000
        - callee: trpc.adp.kb_retrieval.DirectIndex
          namespace: ${NAMESPACE}
          target: "ip://adp-kb-retrieval.{{ .Release.Namespace }}.svc.cluster.local:9091"
          timeout: 30000
        - callee: trpc.adp.resource_gallery.Admin
          target: "ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 30000
        - name: trpc.adp.platform-account.Api
          callee: trpc.adp.platform_account.Internal
          target: "ip://adp-platform-account.{{ .Release.Namespace }}.svc.cluster.local:9092"
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
        - name: trpc.adp.platform_manager.Api
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9093"
          protocol: trpc
          timeout: 5000
        - name: trpc.adp.platform_manager.v2.Internal
          callee: trpc.adp.platform_manager.v2.Internal
          namespace: ${NAMESPACE}
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9099"
          network: tcp
          protocol: trpc
          timeout: 30000

