  main.yaml: |
    crypto: true
    official_config:
      user_name: 智能体开发平台
      avatar_url: ''
      uin: '10000000'
      sub_uin: '10000000'
      permission_ids: ["adpPluginCenterView"]
    api_config:
      timeout: 30
      # RESOLVE: keep-public
      white_urls: ${API_CONFIG_WHITE_URLS}
      # RESOLVE: keep-public
      ports: ${API_CONFIG_PORTS}
    tool_ref_limit: 1000
    plugin_check:
      plugin_name_min_len: 1
      plugin_name_max_len: 100
      plugin_desc_min_len: 1
      plugin_desc_max_len: 500
      tool_name_min_len: 1
      tool_name_max_len: 100
      tool_desc_min_len: 1
      tool_desc_max_len: 200
      max_page_size: 200
      tool_code_min_len: 1
