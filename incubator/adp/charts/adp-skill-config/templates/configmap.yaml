  trpc_go.yaml: |
    global:                             #全局配置
      namespace: ${NAMESPACE}            #环境类型，分正式production和非正式development两种类型
      env_name: ${ENV_NAME}                    #环境名称，非正式环境下多环境的名称
      enable_set: ${ENABLE_SET}         #是否启用set
      full_set_name: ${FULL_SET_NAME}   #set名
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}

    server:                                            #服务端配置
      app: adp                                        #业务的应用名
      server: skill-config-server                             #进程服务名
      bin_path: /usr/local/trpc/bin/                   #二进制可执行文件和框架配置文件所在路径
      conf_path: /usr/local/trpc/conf/                 #业务配置文件所在路径
      data_path: /usr/local/trpc/data/                 #业务数据文件所在路径
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - recovery                                     #拦截框架创建的业务处理协程panic
        - i18n-adp                                          # 用来翻译错误信息
        - validation
        - debuglog
        - cle-route-propagator
        - cos_rewrite
        - opentelemetry
      stream_filter:
      admin:
        ip: ${POD_IP}
        port: 8081
      service:                                         #业务服务提供的service，可以有多个
        - name: trpc.adp.skill_config.SkillConfig      #service的路由名称
          ip: ${POD_IP}                            #服务监听ip地址 可使用占位符 ${ip},ip和nic二选一，优先ip
          port: 8000                #服务监听端口 可使用占位符 ${port}
          network: tcp                             #网络监听类型  tcp udp
          protocol: trpc               #应用层协议 trpc http
          timeout: 0                            #请求最长处理时间 单位 毫秒
          server_async: true                           #开启异步处理
          idletime: 600000                             # idletime，设置tcp空闲等待时间，避免耗时过长的操作导致trpc-go将tcp关闭
          filter:
            - session
            - permission
            - accesslog
        - name: trpc.adp.skill_config.SkillConfigInner      #service的路由名称
          ip: ${POD_IP}                            #服务监听ip地址 可使用占位符 ${ip},ip和nic二选一，优先ip
          port: 8001                #服务监听端口 可使用占位符 ${port}
          network: tcp                             #网络监听类型  tcp udp
          protocol: trpc               #应用层协议 trpc http
          timeout: 0                            #请求最长处理时间 单位 毫秒
          server_async: true                           #开启异步处理
          idletime: 600000                             # idletime，设置tcp空闲等待时间，避免耗时过长的操作导致trpc-go将tcp关闭
        - name: trpc.adp.skill_config.Mcp          #service的路由名称
          ip: ${POD_IP}                            #服务监听ip地址 可使用占位符 ${ip},ip和nic二选一，优先ip
          port: 8003                               #服务监听端口 可使用占位符 ${port}
          network: tcp                             #网络监听类型  tcp udp
          protocol: trpc                           #应用层协议 trpc http
          timeout: 0                               #请求最长处理时间 单位 毫秒
          server_async: true                       #开启异步处理
          idletime: 600000                         #idletime，设置tcp空闲等待时间，避免耗时过长的操作导致trpc-go将tcp关闭
          filter:
            - session
            - permission
        - name: trpc.adp.skill_config.v2.External  # v2 External 服务（对外CAPI接口）
          ip: ${POD_IP}
          port: 9001
          network: tcp
          protocol: adp-capi
          timeout: 30000
          filter:
            - session
            - permission
        - name: trpc.adp.skill_config.TimerReconcileSkillAnalysisTasks
          ip: ${POD_IP}
          port: 8002
          network: "0 */2 * * * * ?startAtOnce=0&scheduler=redis&holdTime=60"
          protocol: timer
          timeout: 120000
        - name: trpc.adp.skill_config.TimerSkillAutoUpgrade
          ip: ${POD_IP}
          port: 8004
          network: "0 0 21 * * * ?startAtOnce=0&scheduler=redis&holdTime=180"
          protocol: timer
          timeout: 300000

    plugins:                                          #插件配置
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: rainbow-comm
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      selector: #针对用户自定义的selector的配置
        polaris: #针对polaris整体api的内部配置
          protocol: grpc                              #名字服务远程交互协议类型
          enable_servicerouter: true
          enable_trans_meta: true
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: skill
            error_prefix: error
            char_scaling_factor:
              zh-CN: 1
              en-US: 3

    client:
      namespace: ${NAMESPACE}
      filter:
        - tpstelemetry
        - cle-route-propagator
      service:
        - name: trpc.mysql.skill_config
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_skill?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local
        - name: trpc.redis.skill_config
          target: redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${INFRA_MIDDLEWARES_REDIS_0_PORT}/40

        # cos调用
        - name: trpc.http.cos.Access
          target: dns://cos-internal.${INFRA_MIDDLEWARES_S3_COS_REGION}.tencentcos.cn
          namespace: Production
          network: tcp
          protocol: http
          timeout: 5000
        # 平台管理服务 - 管理接口
        - callee: trpc.adp.platform_manager.Admin
          name: trpc.adp.platform-manager.Admin
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.resource_gallery.Admin
          namespace: ${NAMESPACE}
          target: ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.app_admin_proxy.Api
          namespace: ${NAMESPACE}
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 20000
        - name: trpc.adp.platform_manager.Login
          namespace: ${NAMESPACE}
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091
          timeout: 30000
        - callee: trpc.adp.platform_content_moderation.Infosec
          target: ip://adp-platform-content-moderation.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          network: tcp
          protocol: trpc
          timeout: 3000
        - name: trpc.adp.platform_manager.Api
          namespace: ${NAMESPACE}
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9093
          timeout: 30000
        - callee: trpc.adp.platform_account.Internal
          target: polaris://trpc.adp.platform_account.Api
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.agent_config.v3.Internal
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:9011"
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.agent_config.AgentConfigApi
          target: ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
