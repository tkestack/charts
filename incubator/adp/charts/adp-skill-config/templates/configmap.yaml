kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-skill-config
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    # Skill 功能相关限制配置
    skill_config:
      skill_name_max_len: 64   # 技能名称最大长度
      skill_url_max_len: 1024   # 技能 URL 最大长度
      query_max_len: 128        # 搜索关键词最大长度
      max_page_size: 100        # 最大分页大小
      default_page_size: 20     # 默认分页大小
      max_filter_values: 20     # 单个过滤条件最大值数量
      max_skill_ids: 100        # 最大技能 ID 列表长度
      max_package_file_count: 300

    # 技能分类标识列表
    category_keys:
      - "adp_knowledge_engine"
      - "office_doc"
      - "design_and_development"
      - "image_processing"
      - "audio_video"
      - "search_retrieval"
      - "ocr"
      - "medical_health"
      - "business_management"
      - "finance_tax_legal"
      - "human_resources"
      - "financial_services"

    # 默认技能版本号（_meta.json 不存在时的兜底版本）
    default_skill_version: "1.0.0"
    # 默认icon
    default_icon_url: ${DEFAULT_ICON_URL}
    #【变更需评估！】sandbox 挂载路径前缀（容器内路径）
    skill_sandbox_mount_prefix: "/adp/custom/.skills"
    #【变更需评估！】COS 路径前缀<cosPathPrefix>/<uin>/<spaceID>/<filePath>
    skill_sandbox_cos_path_prefix: "skills/users"

    skill_uin_whitelist:
      - "100020322809"

    # COS 对象存储配置
    storage:
      type: cos
      cos_map:
        offline:
          secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
          secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
          app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
          region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
          bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
          domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
          expire_time: 30m
          credential_time: 10m
          assume_role:
            role_arn: "{{ dig "components" "s3" "cos" "stsRoleArn" "" .Values.global }}"
            duration_seconds: 43200
            refresh_ahead_seconds: 300
          retry_times: 3          # 请求失败重试次数
          retry_interval: 500ms   # 重试间隔
        sandbox:
          secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
          secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
          app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
          region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
          bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
          domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
          expire_time: 30m
          credential_time: 10m
          assume_role:
            role_arn: "{{ dig "components" "s3" "cos" "stsRoleArn" "" .Values.global }}"
            duration_seconds: 43200
            refresh_ahead_seconds: 300
          retry_times: 3          # 请求失败重试次数；common/x/clientx/s3x 读的是 cfg.RetryTimes，未配置时 CopyObject 等操作的 for 循环跑 0 次，会静默返回 ("", nil) 伪成功
          retry_interval: 500ms   # 重试间隔
        inner:
          secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
          secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
          app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
          region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
          bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
          domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
          expire_time: 30m
          credential_time: 10m
          assume_role:
            role_arn: "{{ dig "components" "s3" "cos" "stsRoleArn" "" .Values.global }}"
            duration_seconds: 43200
            refresh_ahead_seconds: 300
          retry_times: 3
          retry_interval: 500ms

    skill_analysis:
      endpoint: "https://xti.qq.com/api/v3/ti"
      app_key: "jztuhfsvulf02l38quofhz229i4nblbz"
      timeout: 5s
      query_key_type: "md5"         # md5 / sha256
      retry_task: ${RETRY_TASK}

    notice_text:
      audit_subject: "Skills安全审核提示"
      audit_content: "内置Skills均已通过平台安全检测，自定义Skills会在导入时进行平台安全检测"
      update_subject: "Skills更新结果"
      update_succ_tmpl: "Skill“%s”更新成功"
      update_fail_tmpl: "Skill“%s”更新失败，请稍后重试"
      result_subject: "Skills安全审核结果"
      result_succ_tmpl: "Skills“%s”已通过安全检测，未发现已知风险"
      result_fail_tmpl: "Skills“%s”审核失败，可能存在安全隐患"
      result_risk_tmpl: "Skills“%s”安全审核结果为“疑似风险”，需谨慎使用"
      result_high_tmpl: "Skills“%s”安全审核结果为“高危风险”，为保障安全性，不支持上架"
      share_approved_subject: "提交到企业共享Skill已通过"
      share_approved_tmpl: "Skill【%s】提交到企业共享Skill被通过"
      share_rejected_subject: "提交到企业共享Skill被驳回"
      share_rejected_tmpl: "Skill【%s】提交到企业共享Skill被驳回"

    inner_notice:
      webhook_enabled: true
      webhook_urls: ${INNER_NOTICE_WEBHOOK_URLS}

    skillhub:
      base_url: https://lightmake.site
      api_key: ${SKILLHUB_API_KEY}
      client_user_id: adp-skill
      timeout: 30s

    skill_auto_upgrade:
      enable: false
      batch_size: 20
      max_per_round: 100
      dry_run: false
      log_same_version: false
      hold_time: 10m
      sources:
        - skillhub

    task_config:
      task_prefix: "skill-config"       # Redis key 前缀，用于隔离不同服务的任务
      task_fetch_num: 10                 # 单次拉取任务数量
      task_fetch_timeout: 5s             # 拉取超时时间
      task_fetch_period: 1s              # 拉取间隔
      tasks:
        export_skill_component:          # 导出技能组件任务
          runners: 3                     # 执行协程数
          max_retry: 3                   # 最大重试次数
          timeout: 300s                  # 任务超时时间
          fail_timeout: 30s              # 失败回调超时时间
          retry_wait_time: 5s            # 重试等待时间
          stopped_resume_time: 24h       # 任务停止后可恢复的时效
        import_skill_component:          # 导入技能组件任务
          runners: 3                     # 执行协程数
          max_retry: 3                   # 最大重试次数
          timeout: 300s                  # 任务超时时间
          fail_timeout: 30s              # 失败回调超时时间
          retry_wait_time: 5s            # 重试等待时间
          stopped_resume_time: 24h       # 任务停止后可恢复的时效

    skill_address_map: ${SKILL_ADDRESS_MAP}
  client.yaml: |
    client:
      namespace: ${NAMESPACE}
      filter:
        - tpstelemetry
        - cle-route-propagator
      service:
        - name: trpc.mysql.skill_config
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_skill?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local
        - name: trpc.redis.skill_config
          target: redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${INFRA_MIDDLEWARES_REDIS_0_PORT}/40

        # cos调用
        - name: trpc.http.cos.Access
          target: dns://cos-internal.${INFRA_MIDDLEWARES_S3_COS_REGION}.tencentcos.cn
          namespace: Production
          network: tcp
          protocol: http
          timeout: 5000
        # 平台管理服务 - 管理接口
        - callee: trpc.adp.platform_manager.Admin
          name: trpc.adp.platform-manager.Admin
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.resource_gallery.Admin
          namespace: ${NAMESPACE}
          target: ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.app_admin_proxy.Api
          namespace: ${NAMESPACE}
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          timeout: 20000
        - name: trpc.adp.platform_manager.Login
          namespace: ${NAMESPACE}
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091
          timeout: 30000
        - callee: trpc.adp.platform_content_moderation.Infosec
          target: ip://adp-platform-content-moderation.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          network: tcp
          protocol: trpc
          timeout: 3000
        - name: trpc.adp.platform_manager.Api
          namespace: ${NAMESPACE}
          target: ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9093
          timeout: 30000
        - callee: trpc.adp.platform_account.Internal
          target: polaris://trpc.adp.platform_account.Api
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.agent_config.v3.Internal
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:9011"
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
        - callee: trpc.adp.agent_config.AgentConfigApi
          target: ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          namespace: ${NAMESPACE}
          protocol: trpc
          timeout: 5000
  env.yaml: |
    version: 2.0.0 # 固定值，不需要修改
    kind: env # 固定值，不需要修改
    metadata:
        name: formal # 环境名称 [选填]

