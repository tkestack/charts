apiVersion: v1
kind: Service
metadata:
  labels:
    app: adp-skill-config
  name: adp-skill-config
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: tcp-8000
      port: 8000
      protocol: TCP
      targetPort: 8000
    - name: tcp-8001
      port: 8001
      protocol: TCP
      targetPort: 8001
    - name: tcp-8003
      port: 8003
      protocol: TCP
      targetPort: 8003
    - name: tcp-9001
      port: 9001
      protocol: TCP
      targetPort: 9001
  selector:
    app: adp-skill-config
  sessionAffinity: None
  type: ClusterIP
