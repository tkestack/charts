  trpc_go.yaml: |
    global:                             #全局配置
      namespace: Production              #环境类型，分正式production和非正式development两种类型
      serverConnector:
        joinPoint: ${TRPC_GLOBAL_JOIN_POINT}

    server:                                            #服务端配置
      app: adp                                        #业务的应用名
      server: app-config                             #进程服务名
      bin_path: /app/bin/                              #二进制可执行文件和框架配置文件所在路径
      conf_path: /app/conf/                            #业务配置文件所在路径
      log_path: /app/logs/
      admin:
        ip: ${POD_IP}  # admin 的 ip，配置网卡 nic 也可以
        port: 8081  # admin 的 port，必须同时配置这里的 ip port 才会启动 admin
        read_timeout: 3000
        write_timeout: 60000
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - recovery
        - i18n-adp
        - accesslog
        - cle-route-propagator
        - opentelemetry
        - cos_rewrite
      service:
        - name: trpc.adp.app_config.Admin
          ip: ${POD_IP}
          port: 9090
          network: tcp
          protocol: trpc
          timeout: 30000
        - name: trpc.adp.app_config.Api
          ip: ${POD_IP}
          port: 9091
          network: tcp
          protocol: trpc
          timeout: 10000
        - name: trpc.adp.app_config.AppConfigExternal
          ip: ${POD_IP}
          port: 9000
          network: tcp
          protocol: trpc
          timeout: 30000
          filter:
            - session
            - permission
        - name: trpc.adp.app_config.UpdateCharSizeTask
          ip: ${POD_IP}
          port: 9095
          network: "0 15 6 * * *?scheduler=UpdateCharSizeTask&holdTime=5"
          protocol: timer
          timeout: 600000
        - name: trpc.adp.app_config.ClearAppRescourceTask
          ip: ${POD_IP}
          port: 9098
          network: "*/10 * * * * *?startAtOnce=0&scheduler=ClearAppRescourceTask&holdTime=5"
          protocol: timer
          timeout: 3600000
        - name: trpc.adp.app_config.ClearRealtimeAppResourceTask
          ip: ${POD_IP}
          port: 9100
          network: "0 10 0 * * *?startAtOnce=0&scheduler=ClearRealtimeAppResourceTask&holdTime=5"
          protocol: timer
          timeout: 18000000
        - name: trpc.adp.app_config.v2.External
          ip: ${POD_IP}
          port: 9001
          network: tcp
          protocol: adp-capi
          timeout: 30000
          filter:
            - session
            - permission
        - name: trpc.adp.app_config.v2.Internal
          ip: ${POD_IP}
          port: 9002
          network: tcp
          protocol: trpc
          timeout: 30000
        - name: trpc.adp.app_config.v2.Mcp
          ip: ${POD_IP}
          port: 9003
          network: tcp
          protocol: trpc
          timeout: 30000
          filter:
            - session
            - permission
    plugins:
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 500
              max_backups: 10
              compress: false
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      i18n:
        i18n-adp:
          default_lang: ${DEFAULT_LANG}
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: app-config
            error_prefix: errors
            char_scaling_factor:
              zh: 1
              en: 3
      registry:
      selector:
        polaris:
          enable_servicerouter: true # 注意这里一定要使用 true
          join_point: ${TRPC_SELECTOR_JOIN_POINT}


    client:
      filter:
        - cle-route-propagator
        - opentelemetry
      service:
        - name: mysql.qbot.admin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
