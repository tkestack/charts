  application.yaml: |
    storage:
      type: ${INFRA_MIDDLEWARES_S3_TYPE}
      cos_map:
        offline:
          secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
          secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
          app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
          region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
          bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
          domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
          expire_time: 30m
          credential_time: 10m
          assume_role:
            role_arn: "{{ dig "components" "s3" "cos" "stsRoleArn" "" .Values.global }}"
            duration_seconds: 43200
            refresh_ahead_seconds: 300
        realtime:
          secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
          secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
          app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
          region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
          bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
          domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
          expire_time: 30m
          credential_time: 10m
          assume_role:
            role_arn: "{{ dig "components" "s3" "cos" "stsRoleArn" "" .Values.global }}"
            duration_seconds: 43200
            refresh_ahead_seconds: 300
      file_limit:
        offline:
          - type_name: document_200
            types:
            - pdf
            - doc
            - docx
            - ppt
            - mhtml
            - pptx
            - wps
            - ppsx
            size: 200
          - type_name: document_50
            types:
            - key
            - pages
            size: 50
          - type_name: document_20
            types:
            - xlsx
            - xls
            - md
            - txt
            - csv
            - html
            - json
            - log
            - xml
            - xmind
            - numbers
            - pcap
            size: 20
          - type_name: image
            types:
            - jpg
            - png
            - jpeg
            - tiff
            - bmp
            - gif
            size: 50
          - type_name: zip
            types:
            - zip
            size: 2048
          - type_name: video
            types:
            - wmv
            - 3gp
            - avi
            - f4v
            - m4v
            - mp4
            - mpg
            - ogv
            - vob
            - mov
            - flv
            - mkv
            - rm
            - rmvb
            - mpeg
            - webm
            size: 2048
          - type_name: meida_50
            types:
            - mp3
            - wav
            - aac
            - flac
            size: 50
        realtime:
          - type_name: document
            types:
            - doc
            - docx
            - ppt
            - pptx
            - pdf
            - txt
            - xls
            - xlsx
            - md
            - pcap
            size: 20
          - type_name: document_md
            types:
            - md
            - csv
            - json
            size: 20
          - type_name: image
            types:
            - jpg
            - png
            - jpeg
            - bmp
            - webp
            size: 20
            security_white_list:
              100015822485: 2160h
              100022640643: 2160h
              100042322665: 2160h
              100016666250: 2160h
              100042793712: 720h
          - type: video
            types:
            - mp4
            - mkv
            - avi
            - mov
            - wmv
            size: 100
          - type: media
            types:
            - mp3
            - wav
            - pcm
            - m4a
            - arm
            - aac
            - flac
            size: 100
          - type_name: zip
            types:
            - zip
            size: 100
    doc_qa:
      cate_node_limit: 2001
      import_max_length: 5000
      question:
        min_length: 1
        max_length: 2000
      answer:
        min_length: 1
        max_length: 2000
      custom_param:
        min_length: 0
        max_length: 500
      qa_cate:
        min_length: 1
        max_length: 10
    cron_task:
      export_synonyms_task:
        page_size: 200
        max_synonyms_count: 10000
    user_avatar:
