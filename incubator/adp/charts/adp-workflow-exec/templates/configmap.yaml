      "1.检查该节点的输入配置，确保所有必需的参数都已正确设置。\n2.检查上游节点的输出，确认是否有提供该变量。": "1.检查该节点的输入配置，确保所有必需的参数都已正确设置。\n2.检查上游节点的输出，确认是否有提供该变量。",
      "1.检查参数的格式。当输入为object类型的变量时，请检查并确保json语法的正确性。\n2.检查字段类型与节点要求是否一致。\n3.可考虑在上游节点进行参数的清洗或转义。": "1.检查参数的格式。当输入为object类型的变量时，请检查并确保json语法的正确性。\n2.检查字段类型与节点要求是否一致。\n3.可考虑在上游节点进行参数的清洗或转义。",
      "检查上游节点传递参数的正确性，可在调试面板中查看传入的参数。": "检查上游节点传递参数的正确性，可在调试面板中查看传入的参数。",
      "1.检查参数的具体值，查看是否超出参数的合法范围。\n2.检查参数类型是否与节点接受类型一致。\n3.检查是否存在非法字符": "1.检查参数的具体值，查看是否超出参数的合法范围。\n2.检查参数类型是否与节点接受类型一致。\n3.检查是否存在非法字符",
      "1.检查输入数据的大小，尝试减小数据量。\n2.对于文本数据请考虑对文本进行摘要或分块处理。": "1.检查输入数据的大小，尝试减小数据量。\n2.对于文本数据请考虑对文本进行摘要或分块处理。",
      "1.检查网络连接是否正常 \n2.确认当前配置无问题，当前用户有权限访问该模型": "1.检查网络连接是否正常 \n2.确认当前配置无问题，当前用户有权限访问该模型",
      "当前账户余额或配额不足以支持本次大模型调用，请充值或使用限时免费模型": "当前账户余额或配额不足以支持本次大模型调用，请充值或使用限时免费模型",
      "同一时间发起的并发请求数量超过了系统或模型供应商的限制，建议降低当前节点的并发数。若业务需要高并发情况，请申请技术支持以提高并发限制": "同一时间发起的并发请求数量超过了系统或模型供应商的限制，建议降低当前节点的并发数。若业务需要高并发情况，请申请技术支持以提高并发限制",
      "1.检查网络连接到服务商的延迟。\n2.尝试简化Prompt，减少模型的处理时间 \n3.使用“异常处理”功能，开启重试功能。": "1.检查网络连接到服务商的延迟。\n2.尝试简化Prompt，减少模型的处理时间 \n3.使用“异常处理”功能，开启重试功能。",
      "大模型返回的结果格式不符合输出预期，多发于输出格式为JSON的情况，建议在Prompt中明确、清晰地制定输出格式，提供JSON示例。": "大模型返回的结果格式不符合输出预期，多发于输出格式为JSON的情况，建议在Prompt中明确、清晰地制定输出格式，提供JSON示例。",
      "检查用于意图识别的Prompt是否足够清晰、无歧义、覆盖了足够广的情况。建议丰富和优化判断的示例，让模型更好地学习多种意图。": "检查用于意图识别的Prompt是否足够清晰、无歧义、覆盖了足够广的情况。建议丰富和优化判断的示例，让模型更好地学习多种意图。",
      "发送给大模型的Prompt总长度超过了模型处理的上限，建议1.移除不必要的上下文或输入 2.对过长的上下文进行摘要处理再输入给模型。3.分块处理后再进行汇总 4.切换支持更长上下文的模型": "发送给大模型的Prompt总长度超过了模型处理的上限，建议1.移除不必要的上下文或输入 2.对过长的上下文进行摘要处理再输入给模型。3.分块处理后再进行汇总 4.切换支持更长上下文的模型",
      "建议修改提示词，或使用更清晰的语言描述问题，以便于模型在追问次数的限制内完成任务": "建议修改提示词，或使用更清晰的语言描述问题，以便于模型在追问次数的限制内完成任务",
      "1.检查子工作流调用节点的参数映射配置，确保父工作流的输出变量与子工作流的输入变量正确对应。\n2.检查参数的数据类型是否匹配。": "1.检查子工作流调用节点的参数映射配置，确保父工作流的输出变量与子工作流的输入变量正确对应。\n2.检查参数的数据类型是否匹配。",
      "错误发生在子工作流内部，建议检查子工作流具体报错信息，以定位错误发生的位置与原因": "错误发生在子工作流内部，建议检查子工作流具体报错信息，以定位错误发生的位置与原因",
      "1.检查子工作流是否已发布且版本正确。\n2.检查子工作流的触发配置和基本参数是否有效。": "1.检查子工作流是否已发布且版本正确。\n2.检查子工作流的触发配置和基本参数是否有效。",
