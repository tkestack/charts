  trpc_go.yaml: |
    global:
      namespace: ${NAMESPACE}
      serverConnector:
        joinPoint: ${JOINPOINT}
      env_name: ${ENV_NAME}
    server:
      app: adp
      server: platform-manager
      bin_path: /app/bin/
      conf_path: /app/conf/
      log_path: /app/logs/
      admin:
        ip: ${POD_IP}
        port: 8081
        read_timeout: 3000
        write_timeout: 60000
      filter:
        - recovery
        - validation
        - debuglog
        - cle-route-propagator
        - opentelemetry
        - cos_rewrite
        - i18n-adp
      service:
        - name: trpc.adp.platform_manager.Admin
          ip: ${POD_IP}
          port: 9090
          network: tcp
          protocol: trpc
          timeout: 120000
        - name: trpc.adp.platform_manager.Api
          ip: ${POD_IP}
          port: 9093
          network: tcp
          protocol: trpc
          timeout: 120000
        - name: trpc.adp.platform_manager.Login
          ip: ${POD_IP}
          port: 9091
          network: tcp
          protocol: trpc
          timeout: 3000
        - name: trpc.adp.platform_manager.PlatformManagerExternal
          ip: ${POD_IP}
          port: 9000
          network: tcp
          protocol: trpc
          timeout: 30000
          filter:
            - session
            - permission
        - name: trpc.adp.platform_manager.audit_log_consumer
