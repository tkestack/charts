          {
            "type": "object",
            "properties": {
              "query": {
                "type": "string",
                "description": "用户问题（自然语言），必填。应保留原问题的核心信息，不要过度精简。"
              }
            },
            "required": ["query"]
          }

        broad_search: |-
          {
            "type": "object",
            "properties": {
              "query": {
                "type": "string",
                "description": "用户问题（自然语言），必填。应保留原问题的核心信息，不要过度精简。"
              }
            },
            "required": ["query"]
          }

        grep_segments: |-
