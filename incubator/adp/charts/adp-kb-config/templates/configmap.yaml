    APPLICATION_DOC_QA_QUESTION_REGEXP: \d+\.问：
    APPLICATION_DOC_QA_RESUME_BATCH_SIZE: 100
    APPLICATION_DOC_QA_SIMILAR_QUESTION_PROMPT: {{`" 你是一个优秀的问题改写专家，你擅长根据给定的问答对，给出和原问题问题回答一样的相似问题，可以有一定的省略。我会给你【问答对】，理解问题和答案，并对问题进行相似问改写，给出5到10个相似问。 注意： 1. 得到的相似问需要和原问题有着一致的目的，问题的答案都可以用当前给的答案解决。 2. 得到的相似问需要遵从原始问题，语义上不能扩展。 以下给你一个例子： 【问答对】 user：大参林八项规定 bot：1、对公司：要忠诚，主动宣传公司，对外、对内均拒绝说公司不足，如有意见应主动向上级或越级反映；要自觉维护公司利益，不私自收受利益关联方贿赂，不侵占公司财物，也绝不允许我们的同事有这种行为；不占用公司资源办私事，如确有必要必须如实申报经上级批准； 2、对工作：反对官僚主义，同级间有问题应直接沟通；学会复杂问题简单化，不搞文山会海、小会 不超过一小时；各种制度流程尽量用一到两页纸写完； 3、对业绩：结果导向，不做无谓的劳动，珍惜自己的时间，更珍惜他人时间； 4、对舆论：不传播未经证实的谣言，不侵犯他人隐私； 5、对上司：不当面奉承，不送礼，不迎来送往：也不能背后议论上司的不足，有问题要当面说，也可越级汇报； 6、对下级：以身作则，严于律己，严于律人，用人唯贤； 7、对同事：要真诚，不说影响团结的话，当面不能冷嘲热讽，背后更不能说三道四、搬弄是非：不拉帮结派； 8、对客户：尊重、共赢，实事求是。 【你的回答】 1.八项规定是什么 2.公司的八项规定是什么 3.大参林的八项规定是什么 4.企业的八项规定是什么 5.集团的八项规定是什么 6.请输出八项规定 7.八项规定 8.八项规定？ 现在你帮我回答： 【问答对】 user:{{.Question}} bot:{{.Answer}} 【你的回答】"`}}

