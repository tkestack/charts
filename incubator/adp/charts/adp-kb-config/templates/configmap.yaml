kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-kb-config
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    gorm_debug: ${APPLICATION_GORM_DEBUG}

    storage: ${APPLICATION_STORAGE}

    sec_api:
      enable: {{ default "" .Values.global.secapi_enable }}
    robot_default:
      name: 企点智能客服
      app_names:
        knowledge_qa: 知识库问答应用
        summary: 知识摘要应用
        classify: 标签提取应用
      avatar: /qbot/public/avatar.png
      expire_time: 7
      transfer_keywords:
        - 转人工
        - 人工
        - 人工客服
      app_model:
        knowledge_qa_model:
          intent_recognize:
            prompt: |-
              {{`理解问题的内容并判断问题的相关意图，请在以下几个选项中选择一个最可能相关意图：聊天，模型关系，模型原理，模型信息，转人工，翻译，写作，摘要，古诗词，现代诗词，成语，地理，天文，垃圾分类，号码归属，汽车知识，金融知识，税务知识，知识问答，音乐，赛事，股票，黄历，节日和时间，新闻，天气，星座，代码，数学计算，表格问题，逻辑推理，角色扮演，阅读回答，文件查找，筛选推荐。如果输入的问题和以上意图都不相关，也就是说上面的选项里没有合适的，则输出其他。
              询问bot与其他大模型的关系，例如“你和GPT4的差距是什么”，属于“模型关系”。询问bot的底层训练原理，包括模型结构，训练数据，发明团队，例如“你用了什么预训练数据“，属于”模型原理“。询问bot的身份、能力，发明时间等，例如“你能够为用户做什么”，属于“模型信息”。需要人工解决问题或者对bot回答表示不满意等，属于“转人工”。询问歌曲的“演唱、作曲、作词、演奏、合唱”问题，询问“歌手、乐队、乐团、男团、女团”的问题，询问“片头曲、片尾曲、插曲、宣传曲、主题曲、金曲奖、歌手奖、音乐奖”的问题，例如“2021年金曲奖最佳男歌手是谁”，属于“音乐”。询问某天公司的具体股价、股价走势、上涨情况、交易量、汇率，例如“2019年1月1日谷歌股票的最低和最高价格”，属于“股票”。询问一些知识问答，需要额外的信息来辅助回答，例如“兵马俑有几个区域”，“你们的电话是多少”，需要其他信息补充回答，属于“知识问答”。\给定一段文字，要求根据文字内容对问题进行回答，例如“根据下文内容回答问题”，属于“阅读回答”。给出一定条件，要求根据条件筛选输出相关内容并回答，例如“帮我推荐一些闵行区的房子”，属于“筛选推荐”。例如：判断“根据下文内容回答问题”需要阅读给定文字并给出答案，所以相关意图是阅读回答，输出“阅读回答”。判断“歌手蔡依林有过什么代表作”相关意图是音乐，输出“音乐”。判断”我要找真人“的相关意图是转人工，输出：“转人工”。判断“写一个冒泡排序”相关意图是代码，输出：“代码”。判断“上海在中国的哪个方位”相关意图是地理，输出：“地理”。判断“兵马俑有几个区域”需要具备一些知识，所以相关意图是知识问答，输出：“知识问答”。判断”阿苏妲己哦额请叫我日“与以上所有的意图都不相关，直接输出其他。
              问题：{{.Question}}`}}
            prompt_words_limit: 3800
            history_limit: 0
            history_words_limit: 0
            is_enabled: true
            model_name: cs-intention
          transfer:
            prompt: |-
              {{`判断下面文本的意图，是否转人工。如果转人工，输出转人工；否则输出非人工。
                {{.Question}}`}}
            prompt_words_limit: 3800
            history_limit: 0
            history_words_limit: 0
            is_enabled: true
            model_name: cs-normal
          normal_message:
            prompt: |-
              {{`{{- if gt (len .Docs) 0 -}}
              基于以下已知信息，简洁和专业的来回答用户的问题。如果无法从中得到答案，忽略文段内容并用中文回答用户问题。
              已知内容:<$!truN#cAte+>
                {{range $i, $el := .Docs -}}
                  {{- if or (eq .DocType 1) (eq .DocType 4) -}}
                    {{.Question}} {{.Answer}}
                  {{- else -}}
                    {{.OrgData}}
                  {{- end}}
                {{end}}<-truN#cAte!$>
              问题:
              {{end -}}
              {{.Question}}`}}
            prompt_words_limit: 5000
            history_limit: 5
            history_words_limit: 2000
            is_enabled: true
            model_name: cs-normal
          normal_message_non_general_knowledge:
            prompt: |-
              {{`{{- if gt (len .Docs) 0 -}}
              基于以下已知信息，简洁和专业的来回答用户的问题。如果无法从中得到答案，则直接回复对不起已知信息和问题无关，并说明原因。
              已知内容:<$!truN#cAte+>
                {{range $i, $el := .Docs -}}
                  {{- if or (eq .DocType 1) (eq .DocType 4) -}}
                    {{.Question}} {{.Answer}}
                  {{- else -}}
                    {{.OrgData}}
                  {{- end}}
                {{end}}<-truN#cAte!$>
              问题:
              {{end -}}
              {{.Question}}
              如果无法从中得到答案，则直接回复对不起已知信息和问题无关，并说明原因。`}}
            prompt_words_limit: 5000
            history_limit: 5
            history_words_limit: 2000
            is_enabled: true
            model_name: cs-normal
          normal_evaluation:
            prompt: |-
              {{`基于以下已知信息，简洁和专业的来回答用户的问题。如果无法从中得到答案，忽略文段内容并用中文回答用户问题。
              已知内容:
              {{range $i, $el := .Docs}}{{if eq .DocType 1 -}}{{.Question}} {{.Answer}}{{else if eq .DocType 4 -}}{{.Question}} {{.Answer}}{{- else -}}{{.OrgData}}{{- end}}
              {{end}}
              问题:
              {{.Question}}`}}
            prompt_words_limit: 3800
            history_limit: 0
            history_words_limit: 0
            is_enabled: true
            model_name: cs-normal-evaluation
          abstract:
            prompt: |-
              {{`这是一段访客和客服之间的对话记录：
              {{- range $i, $el := .Histories}}
                {{if eq .Role 1}}客服{{else}}访客{{end}}：{{.Content}}
              {{- end}}

              请用简洁的语言总结以上对话。`}}
            prompt_words_limit: 3800
            history_limit: 200
            history_words_limit: 2000
            is_enabled: true
            model_name: cs-normal
          summary:
            prompt: |-
              {{`这是一段访客和客服之间的对话记录：
              {{- range $i, $el := .Histories}}
                {{if eq .Role 1}}客服{{else}}访客{{end}}：{{.Content}}
              {{- end}}

              请用简洁的语言总结以上对话。`}}
            prompt_words_limit: 3800
            history_limit: 200
            history_words_limit: 2000
            is_enabled: true
            model_name: cs-normal
          qa_extract:
            prompt: |-
              {{`根据下文生成多个问答对：
              {{.Content}}`}}
            prompt_words_limit: 7800
            history_limit: 0
            history_words_limit: 0
            is_enabled: true
            model_name: cs-normal
          query_rewrite:
            prompt: |-
              {{`{{- $c := 0 -}}
              {{- range $i, $el := .MultiRoundHistories -}}
              问题{{add $c 1}}：{{index $el 0}}
              答案{{add $c 1}}：{{index $el 1}}
                {{$c = add $c 1 -}}
              {{end -}}
              根据以上问答内容理解以下问题意图，并将问题以完整的形式输出。
              问题{{add $c 1}}：{{.Question}}`}}
            prompt_words_limit: 3800
            history_limit: 5
            history_words_limit: 0
            is_enabled: true
            model_name: cs-rewrite
          rerank:
            prompt: |-
              {{`{{.Question}}`}}
            prompt_words_limit: 3800
            is_enabled: true
            model_name: sn-reranker-large-v0.4
        summary_model:
          summary_recognize:
            prompt: |-
              {{`根据下面对话，进行摘要
              {{.SummaryRequireCommand}}
              {{.Question}}`}}
            prompt_words_limit: 4000
            history_limit: 0
            history_words_limit: 0
            is_enabled: true
            model_name: cs-normal
        classify_model:
          classify_extract:
            prompt: |-
              {{`你是一个人工智能专家，尤其擅长进行多轮对话分析。分析"对话内容"，提取对话中的标签信息。
              # 待抽取标签及标签说明：
              {{range $i1, $e1 := .Tags -}}
              {{add1 $i1}}. {{$e1.Name}}
                {{add1 $i1}}.1 标签描述: {{$e1.Description}}
                {{add1 $i1}}.2 标签取值范围: {{join "," $e1.Values}}
              {{end}}

              分析结果以json格式返回，结果格式示例:{
              {{- range $i, $e := .Tags -}}
                "{{.Name}}":["{{join "\",\"" .Values}}"]
                {{- if ne (add1 $i) (len $.Tags)}},{{end -}}
              {{- end -}}
              }, 未提及的标签无需返回

              # 对话内容
              {{.Question}}
              # 答案:`}}


            prompt_words_limit: 4000
            history_limit: 0
            history_words_limit: 0
            is_enabled: true
            model_name: cs-normal
      app_default_model:
        knowledge_qa:
          - alias_name: 精调知识大模型标准版
            name: cs-normal
            desc:
          - alias_name: 精调知识大模型高级版
            name: cs-normal-70b
            desc:
            is_default: true
          - alias_name: 混元大模型标准版
            name: hunyuan-13B
            desc:
          - alias_name: 混元大模型高级版
            name: hunyuan
            desc:
          - alias_name: 金融行业大模型标准版
            name: finance-13b
            desc:
          - alias_name: 医学行业大模型标准版
            name: medical-6b
            desc:
        summary:
          - alias_name: 精调知识大模型标准版
            name: cs-normal
            desc:
            is_default: true
            prompt: |-
              {{`根据下面对话，进行摘要
              {{.SummaryRequireCommand}}
              {{.Question}}`}}
            prompt_words_limit: 4000
            history_limit: 0
            history_words_limit: 0
          - alias_name: 金融行业大模型标准版
            name: finance-13b
            desc:
            prompt: |-
              {{`根据下面对话，进行摘要
              {{.SummaryRequireCommand}}
              {{.Question}}`}}
            prompt_words_limit: 4000
            history_limit: 0
            history_words_limit: 0
        classify:
          - alias_name: 精调知识大模型标准版
            name: cs-normal
            desc:
            prompt: |-
              {{`你是一个人工智能专家，尤其擅长进行多轮对话分析。分析"对话内容"，提取对话中的标签信息。
              # 待抽取标签及标签说明：
              {{range $i1, $e1 := .Tags -}}
              {{add1 $i1}}. {{$e1.Name}}
                {{add1 $i1}}.1 标签描述: {{$e1.Description}}
                {{add1 $i1}}.2 标签取值范围: {{join "," $e1.Values}}
              {{end}}

              分析结果以json格式返回，结果格式示例:{
              {{- range $i, $e := .Tags -}}
                "{{.Name}}":["{{join "\",\"" .Values}}"]
                {{- if ne (add1 $i) (len $.Tags)}},{{end -}}
              {{- end -}}
              }, 未提及的标签无需返回

              # 对话内容
              {{.Question}}

              # 答案:`}}


            prompt_words_limit: 4000
            history_limit: 0
            history_words_limit: 0
          - alias_name: 精调知识大模型高级版
            name: cs-normal-70b
            desc:
            is_default: true
            prompt: |-
              {{`你是一个人工智能专家，尤其擅长进行多轮对话分析。分析"对话内容"，提取对话中的标签信息。
              # 待抽取标签及标签说明：
              {{range $i1, $e1 := .Tags -}}
              {{add1 $i1}}. {{$e1.Name}}
                {{add1 $i1}}.1 标签描述: {{$e1.Description}}
                {{add1 $i1}}.2 标签取值范围: {{join "," $e1.Values}}
              {{end}}

              分析结果以json格式返回，结果格式示例:{
              {{- range $i, $e := .Tags -}}
                "{{.Name}}":["{{join "\",\"" .Values}}"]
                {{- if ne (add1 $i) (len $.Tags)}},{{end -}}
              {{- end -}}
              }, 未提及的标签无需返回

              # 对话内容
              {{.Question}}

              # 答案:`}}


            prompt_words_limit: 4000
            history_limit: 0
            history_words_limit: 0
          - alias_name: 金融行业大模型标准版
            name: finance-13b
            desc:
            prompt: |-
              {{`你是一个人工智能专家，尤其擅长进行多轮对话分析。分析"对话内容"，提取对话中的标签信息。
              # 待抽取标签及标签说明：
              {{range $i1, $e1 := .Tags -}}
              {{add1 $i1}}. {{$e1.Name}}
                {{add1 $i1}}.1 标签描述: {{$e1.Description}}
                {{add1 $i1}}.2 标签取值范围: {{join "," $e1.Values}}
              {{end}}

              分析结果以json格式返回，结果格式示例:{
              {{- range $i, $e := .Tags -}}
                "{{.Name}}":["{{join "\",\"" .Values}}"]
                {{- if ne (add1 $i) (len $.Tags)}},{{end -}}
              {{- end -}}
              }, 未提及的标签无需返回

              # 对话内容
              {{.Question}}

              # 答案:`}}


            prompt_words_limit: 4000
            history_limit: 0
            history_words_limit: 0
      role_custom_models: ${APPLICATION_ROBOT_DEFAULT_ROLE_CUSTOM_MODELS}
      filters:
        search_release:
          top_n: 15
          filter:
            - doc_type: 1
              confidence: 0.7
              top_n: 3
            - doc_type: 4
              confidence: 0.8
              top_n: 5
            - doc_type: 2
              confidence: 0.2
              top_n: 5
            - doc_type: 5
              confidence: 0
              top_n: 0
            - doc_type: 8
              confidence: 0
              top_n: 0
        search_release_question:
          top_n: 1
          skip_rechunk: ${APPLICATION_ROBOT_DEFAULT_FILTERS_SEARCH_RELEASE_QUESTION_SKIP_RECHUNK}
          filter:
            - doc_type: 1
              confidence: 0.97
              top_n: 1
        search_preview:
          top_n: 15
          filter:
            - doc_type: 1
              index_id: 2
              confidence: 0.7
              top_n: 3
            - doc_type: 4
              index_id: 7
              confidence: 0.8
              top_n: 5
            - doc_type: 2
              index_id: 4
              confidence: 0.2
              top_n: 5
            - doc_type: 5
              index_id: 0
              confidence: 0
              top_n: 0
            - doc_type: 8
              index_id: 0
              confidence: 0
              top_n: 0
        search_preview_question:
          top_n: 1
          skip_rechunk: ${APPLICATION_ROBOT_DEFAULT_FILTERS_SEARCH_PREVIEW_QUESTION_SKIP_RECHUNK}
          filter:
            - doc_type: 1
              index_id: 2
              confidence: 0.97
              top_n: 1
        match_refer:
          top_n: 3
          filter:
            - doc_type: 1
              top_n: 3
              rouge_score:
                f: 0.3
                p: 0.35
                r: 0.35
            - doc_type: 2
              top_n: 3
              rouge_score:
                f: 0.3
                p: 0.35
                r: 0.35
        search_rejected_question_preview:
          top_n: 5
          filter:
            - doc_type: 3
              index_id: 6
              confidence: 0.93
              top_n: 5
        search_rejected_question_release:
          top_n: 5
          filter:
            - doc_type: 3
              confidence: 0.93
              top_n: 5
        search_global:
          top_n: 1
          filter:
            - doc_type: 1
              index_id: 8
              confidence: 0.97
              top_n: 1
        search_global_all:
          top_n: 99
          filter:
            - doc_type: 1
              index_id: 8
              confidence: 0.97
              top_n: 99
        search_engine:
          top_n: 5
          filter:
            - doc_type: 4
              confidence: 0.8
              top_n: 5
        rerank:
          top_n: 20
      search_vector:
        confidence: 0.999
        top_n: 3
      embedding: ${APPLICATION_ROBOT_DEFAULT_EMBEDDING}
      default_doc_split:
        qa:
          parser_config:
            single_paragraph: true
            split_sub_table: false
          splitter_config:
            splitter: sentence
            splitter_sentence_config:
              enable_table: true
              enable_image: true
              sentence_symbols: ["。", "？", "！", "\n", "；", "!", ";", "?"]
              max_mini_chunk_length: 1000
          merger_config:
            merger: length
            merger_length_config:
              page_content_length: 7800
              head_overlap_length: 0
              tail_overlap_length: 0
              table_page_content_length: 7800
              table_head_overlap_length: 0
              table_tail_overlap_length: 0
          rechunk_config:
            head_overlap_size: 2
            tail_overlap_size: 2
            trim_by_symbols: ["。", "？", "！", "\n", "；", "!", ";", "?"]
        doc:
          parser_config:
            single_paragraph: true
            split_sub_table: true
          pattern_splitter_config:
            regexp_json: "{\"SplitMode\":{\"zhangtiao\":[\"(^第.{1,6}?章)\",\"(^第.{1,6}?条)\"],\"dunhao\":[\"(^[一二三四五六七八九十 ]+、)\",\"(（[ 零一二三四五六七八九十百]+）)\"],\"none\":[\"(^21d43jd73hk73jd93)\"]},\"SplitSequence\":[\"zhangtiao\",\"dunhao\",\"none\"],\"TitleMaxLength\":100,\"RechunkHeadOverlapSizeForPattern\":1,\"RechunkTailOverlapSizeForPattern\":4,\"ReplaceWords\":[[\"(\",\"（\"],[\")\",\"）\"]]}"
          splitter_config:
            splitter: token
            splitter_token_config:
              enable_table: true
              enable_image: true
              mini_chunk_length: 50
          merger_config:
            merger: amount
            merger_amount_config:
              page_content_size: 16
              head_overlap_size: 0
              tail_overlap_size: 2
              table_page_content_length: 800
              table_head_overlap_size: 1
              table_tail_overlap_size: 0
          rechunk_config:
            head_overlap_size: 2
            tail_overlap_size: 2
            trim_by_symbols: ["。", "？", "！", "\n", "；", "!", ";", "?", "、", "，"]
      max_char_size: 15000000
      role_description:
      greeting:
      bare_answer: 作为一个智能助手，针对您这个问题，我所提供的答案或建议可能会存在不准确的地方。建议您转到人工，由专业顾问为您提供服务。
      parse_strategy: 1
      max_file_size: 209715200
      file_type_size: ${APPLICATION_ROBOT_DEFAULT_FILE_TYPE_SIZE}
      doc_to_qa_max_char_size: 1500000
      bot_max_char_size: 300000000
      doc_release_max_limit: {{ .Values.doc_release_max_limit }} # 文档导入，未发布数量限制,超限不可继续上传文档
      qa_release_max_limit: 50000
      batch_download_doc_max_limit: 15
      bot_max_char_size_white_list: ${APPLICATION_ROBOT_DEFAULT_BOT_MAX_CHAR_SIZE_WHITE_LIST}
    doc_preview: ${APPLICATION_DOC_PREVIEW}
    doc_preview_type: 0
    doc_qa:
      cate_node_limit: 2001
      import_max_length: 5000
      similar_question_num_limit: 100
      similar_question_model_name: {{ .Values.similar_question_model_name }}
      question:
        min_length: 1
        max_length: 2000
      answer:
        min_length: 1
        max_length: 6000
      custom_param:
        min_length: 0
        max_length: 500
      question_desc:
        min_length: 0
        max_length: 300
      qa_cate:
        min_length: 1
        max_length: ${APPLICATION_DOC_QA_QA_CATE_MAX_LENGTH}
      similar_question:
        min_length: 1
        max_length: 500
      similar_question_prompt: ${APPLICATION_DOC_QA_SIMILAR_QUESTION_PROMPT}
      similar_question_llm_regexp:
        - ^问：
        - "^问:"
      generate_qa_limit: 20
      question_regexp: ${APPLICATION_DOC_QA_QUESTION_REGEXP}
      answer_regexp: ${APPLICATION_DOC_QA_ANSWER_REGEXP}
      resume_max_count_limit: 1500
      resume_batch_size: ${APPLICATION_DOC_QA_RESUME_BATCH_SIZE}
    cron_task:
      qa_similar_task:
        wait_a_moment: 30s
        page_size: 200
      export_qa_task:
        max_qa_count: 100000
    vector_sync:
      concurrent: 3
      time_before: 5m
      limit: 1000
    demo_mode: ${APPLICATION_DEMO_MODE}
    user_avatar: ${APPLICATION_USER_AVATAR}
    task_prefix: "knowledge:task"
    task_fetch_num: 100
    task_fetch_timeout: 5s
    task_fetch_period: 5s
    task_clean_enable: ${APPLICATION_TASK_CLEAN_ENABLE}
    task_keep_rows: ${APPLICATION_TASK_KEEP_ROWS}
    task_clean_start_hour: ${APPLICATION_TASK_CLEAN_START_HOUR}
    task_clean_end_hour: ${APPLICATION_TASK_CLEAN_END_HOUR}
    task_clean_slow_threshold: ${APPLICATION_TASK_CLEAN_SLOW_THRESHOLD}
    task_delete_batch_interval: ${APPLICATION_TASK_DELETE_BATCH_INTERVAL}
    tasks: ${APPLICATION_TASKS}
    short_url_root_url: ${APPLICATION_SHORT_URL_ROOT_URL}
    preview_url_root_url: ${APPLICATION_PREVIEW_URL_ROOT_URL}
    offline_short_url_scheme: ${APPLICATION_OFFLINE_SHORT_URL_SCHEME}
