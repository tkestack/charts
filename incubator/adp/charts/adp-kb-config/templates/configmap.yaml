                "type": "array",
                "items": {"type": "integer"},
                "description": "要查询的 kb_id 列表，可选。不传时使用当前会话的默认 KB 集合。"
              },
              "category_limit": {
                "type": "integer",
                "description": "单 KB 分类上限，默认 20，上限 200。"
              },
              "label_limit": {
                "type": "integer",
                "description": "单 label 下 values 上限，默认 20，上限 200。"
              },
              "document_limit": {
                "type": "integer",
                "description": "单 KB 文档上限，默认 20，上限 200。"
              }
            }
          }
        list_documents: |-
          {
            "type": "object",
            "properties": {
              "kb_id": {
                "type": "integer",
                "description": "知识库业务 ID（必填）。"
              },
              "query": {
                "type": "string",
                "description": "检索关键词，配合 query_type 使用。按文档名检索时填文件名关键词，按标签检索时填标签值关键词。"
              },
              "query_type": {
                "type": "string",
                "enum": ["filename", "attribute"],
                "description": "检索类型：filename=按文档名模糊匹配，attribute=按标签值模糊匹配。与 query 配合使用。"
              },
              "cate_id": {
                "type": "integer",
                "description": "分类业务 ID，按分类筛选文档（会自动包含该分类下的所有子分类）。"
              },
              "page": {
                "type": "integer",
                "description": "页码，从 1 开始，默认 1。"
              },
              "size": {
                "type": "integer",
                "description": "每页数量，默认 20，最大 200。"
              }
            },
            "required": ["kb_id"]
          }

        list_table_meta: |-
          {
            "type": "object",
            "properties": {
              "db_biz_id": {
                "type": "string",
                "description": "Filter by database business ID (optional)"
              },
              "table_id": {
                "type": "string",
                "description": "Filter by table ID (optional)"
              },
              "page": {
                "type": "integer",
                "description": "Page number, starting from 1; default 1"
              },
              "page_size": {
                "type": "integer",
                "description": "Page size, default 20, cap 100"
              }
            }
          }

        execute_sql: |-
          {
            "type": "object",
            "properties": {
              "sql": {
                "type": "string",
                "description": "待执行的 SQL 语句（必填）"
              },
              "tables": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "doc_id": {
                      "type": "integer",
                      "description": "文档ID（Excel 场景必填；外部 DB 场景为 0）"
                    },
                    "table_id": {
                      "type": "string",
                      "description": "表ID（Excel 对应 sheet id；外部 DB 对应 db_table_biz_id）"
                    },
                    "db_biz_id": {
                      "type": "string",
                      "description": "数据库业务ID，必须从 list_table_meta_data 返回结果中的 db_biz_id 字段原样填入（外部 DB 场景必填；Excel/doc 场景传空字符串）"
                    },
                    "table_name": {
                      "type": "string",
                      "description": "表的可读名称（对应 list_table_meta 返回的 table_name 字段，非 table_id）"
                    },
                    "db_source_type": {
                      "type": "string",
                      "description": "数据库类型(doc/mysql/sql_server/oracle/postgres/kingbase/dm/transwarp)"
                    },
                    "file_or_db_name": {
                      "type": "string",
                      "description": "文件名/数据库名（可选）"
                    },
                    "table_comment": {
                      "type": "string",
                      "description": "表注释（可选）"
                    }
                  },
                  "required": ["table_id", "table_name","doc_id","db_source_type","db_biz_id"]
                },
                "minItems": 1,
                "description": "SQL 涉及的表引用列表（必填，来自 list_table_meta 的结果）"
              }
            },
            "required": ["sql", "tables"]
          }

      tool_messages:
        invalid_args: "参数解析失败: %v"
        query_empty: "query 不能为空"
        no_kb: "没有可用的知识库（kb_id_list 为空）"

        standard_search_no_hit: "未命中任何结果。可尝试换用 grep_segments（字面精准匹配）或 broad_search（纯向量粗召）。"

        broad_search_no_hit: "未命中任何结果。可尝试换用 standard_search（综合召回）或 keyword_search(即grep_segments)（字面精准匹配）。"

        grep_no_hit: "未命中任何结果。可尝试换用 standard_search（语义检索）或放宽 query 字面串。"
        grep_no_wildcard: 'query 缺少 ES wildcard 通配符（* 或 ?），字面匹配将只命中与 query 完全相等的整段切片正文；如需模糊匹配请改写为 "*关键字*" 形式后重试。'
        grep_truncated: "结果已截断，底层命中 %d 条，当前返回 %d 条；如需更多可调大 limit。"

        list_kb_empty: "未查询到知识库信息"
        list_kb_no_scope: "没有可用的知识库（未注入 app_id 且 kb_ids 为空）"

        list_documents_no_kb: "kb_id 不能为空，请指定要查询的知识库 ID。"
        list_documents_empty: "未查询到符合条件的文档。可尝试放宽筛选条件（如去掉分类 / 标签 / 文档名过滤）后重试。"

        read_segments_doc_id_empty: "doc_id 不能为空。"
        read_segments_empty_rsp: "未读取到任何切片（空响应）。"
        read_segments_no_hit: "未读取到任何切片。doc_id=%d, index=[%d,%d], total_segments=%d。可能 index_from 已超过文档总切片数，请结合 total_segments 调整区间后重试。"

        read_parent_segments_ids_empty: "segment_ids 不能为空，请传入至少一个子切片业务 ID。"
        read_parent_no_hit: "未查到任何父切片。%s可能是输入 ID 不属于当前应用或已被删除，请核对后重试。"
        read_parent_missing_note: "（注：以下 segment_ids 未查到: %v）\n"
        read_parent_partial_truncated: "部分 segment_ids 未命中，详见 Content 末尾备注"

        list_table_meta_kb_empty: "没有可用的知识库（kb_id 未注入）"
        list_table_meta_app_empty: "没有可用的应用上下文（app_biz_id 未注入）"
        list_table_meta_empty: "未找到匹配的表元数据。可尝试不传 db_biz_id / table_id 过滤，或检查知识库下是否已配置 text2sql 表。"

        execute_sql_kb_empty: "没有可用的知识库（kb_id 未注入）"
        execute_sql_app_empty: "没有可用的应用上下文（app_biz_id 未注入）"
        execute_sql_empty: "sql 参数不能为空，请提供待执行的 SQL 语句"
        execute_sql_tables_empty: "tables 参数不能为空，请提供 SQL 涉及的表引用列表（来自 list_table_meta 的结果）"
        execute_sql_no_result: "SQL 执行成功但无返回结果。请检查 SQL 是否正确，或确认表中是否有匹配数据。"
  trpc_go.yaml: |
    global:
      namespace: ${TRPC_GO_GLOBAL_NAMESPACE}
      env_name: ${TRPC_GO_GLOBAL_ENV_NAME}
      enable_set: false
      full_set_name: adp
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
      serverConnector:
        joinPoint: ${TRPC_GO_GLOBAL_SERVER_CONNECTOR_JOIN_POINT}
    server:
      app: adp
      server: kb-config
      filter:
        - recovery
        - i18n-adp
        - validation
        - accesslog
        - opentelemetry
        - cos_rewrite
      admin:
        ip: ${POD_IP}
        port: 8081
      service:
        - name: trpc.adp.kb_config.Admin
          ip: ${POD_IP}
          port: 9090
          network: tcp
          protocol: trpc
          timeout: 120000
          filter:
            - session
            - permission
            - actionLog
        - name: trpc.adp.kb_config.Api
          ip: ${POD_IP}
          port: 9092
          network: tcp
          protocol: trpc
          timeout: ${TRPC_GO_SERVER_SERVICE_TRPC_ADP_KB_CONFIG__API_TIMEOUT}
        - name: trpc.adp.kb_config.QASimilarTask
          ip: ${POD_IP}
          port: 9094
          network: "*/5 * * * * *?scheduler=QASimilarTask&holdTime=5"
          protocol: timer
          timeout: 600000
        - name: trpc.adp.kb_config.DeleteCharSizeExceededTask
          ip: ${POD_IP}
          port: 9098
          network: "0 0 2 * * *?scheduler=DeleteCharSizeExceededTask&holdTime=5"
          protocol: timer
          timeout: 600000
        - name: trpc.adp.kb_config.CleanVectorSyncHistoryTask
          ip: ${POD_IP}
          port: 9099
          network: "0 0 */10 * * *?scheduler=CleanVectorSyncHistoryTask&holdTime=5"
          protocol: timer
          timeout: 3600000
        - name: trpc.adp.kb_config.UpdateAttributeLabelsTaskPreview
          ip: ${POD_IP}
          port: 9101
          network: "0 0 * * * *?scheduler=UpdateAttributeLabelsTaskPreview&holdTime=5"
          protocol: timer
          timeout: 900000
        - name: trpc.adp.kb_config.UpdateAttributeLabelsTaskProd
          ip: ${POD_IP}
          port: 9102
          network: "0 30 * * * *?scheduler=UpdateAttributeLabelsTaskProd&holdTime=5"
          protocol: timer
          timeout: 900000
        - name: trpc.adp.kb_config.CleanDatabaseCommonData
          ip: ${POD_IP}
          port: 9103
          network: ${TRPC_GO_SERVER_SERVICE_TRPC_ADP_KB_CONFIG__CLEAN_DATABASE_COMMON_DATA_NETWORK}
          protocol: timer
          timeout: ${TRPC_GO_SERVER_SERVICE_TRPC_ADP_KB_CONFIG__CLEAN_DATABASE_COMMON_DATA_TIMEOUT}
        - name: trpc.adp.kb_config.AutoDocRefresh
          ip: ${POD_IP}
          port: 9104
          network: ${TRPC_GO_SERVER_SERVICE_TRPC_ADP_KB_CONFIG__AUTO_DOC_REFRESH_NETWORK}
          protocol: timer
          timeout: 900000
        - name: trpc.adp.kb_config.CloudDocParsePollingTask
          ip: ${POD_IP}
          port: 9106
          network: "0 */1 * * * *?scheduler=CloudDocParsePollingTask&holdTime=5"
          protocol: timer
          timeout: 900000
        - name: trpc.adp.kb_config.CheckCustomESHealthTask
          ip: ${POD_IP}
          port: 9106
          network: "0 0 * * * *?scheduler=CheckCustomESHealthTask&holdTime=5"
          protocol: timer
          timeout: 900000
    plugins:
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
        clues:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/clues.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      i18n:
        i18n-adp:
          default_lang: ${TRPC_GO_PLUGINS_I18N_I18N_ADP_DEFAULT_LANG}
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: kb-config
            error_prefix: error
            char_scaling_factor:
              zh: 1
              en: 3
      selector:
        polaris:
          join_point: ${TRPC_GO_PLUGINS_SELECTOR_POLARIS_JOIN_POINT}

