      10002:
        msg: crc校验错误，请检查文件的CosHash值是否符合参数要求。
        is_allow_retry: false
      10003:
        msg: 文件名过长，请修改文件名后重新导入。
        is_allow_retry: false
      10004:
        msg: 系统错误。
