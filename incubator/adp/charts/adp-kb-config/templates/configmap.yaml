    APPLICATION_PRESET_CONNECTORS:
      - provider: iwiki
        plugin_id: d12a017e-30e5-40b1-ad9b-66f231c711fa
        display_name: iWiki
        is_whitelist_enabled: true
        description: "iWiki 企业知识库文档接入"
        icon_url: "https://qidian-qbot-1251316161.cos.ap-guangzhou.myqcloud.com/public/adp/66b5c09bd53f61d51898d95768f897a8_1779849432203.png"
        tool_names:
          - getSpaceInfoByKey
          - getSpacePageTree
          - getDocument
        connector_tools:
          - tool_name: getSpaceInfoByKey
            fun: list_docs
            desc: "获取 iWiki 空间信息（含 homepageid，用于 getSpacePageTree 的 parentid）"
            usage: browse
            params: "{\"spaceKey\":\"空间标识\"}"
            response_mapping: "{\"doc_id\":\"homepageid\",\"name\":\"spacename\"}"
          - tool_name: getSpacePageTree
            fun: list_docs
            desc: "获取空间/文件夹目录树（parentid 必须是整数 homepageid 或 docid）"
            usage: browse
            params: "{\"parentid\":0}"
            response_mapping: "{\"doc_id\":\"docid\",\"name\":\"title\",\"is_folder\":\"has_children\"}"
          - tool_name: getDocument
            fun: get_content
            desc: "获取 iWiki 文档内容（Markdown 格式）"
            params: "{\"docid\":\"文档ID（整数字符串）\"}"
            response_mapping: "{\"content\":\"body\"}"
      - connector_id: preset_tapd
        plugin_id: 980950af-0e4a-43f4-ae19-26a70a8c0a11
        is_whitelist_enabled: true
        provider: tapd
