    APPLICATION_CUSTOM_CONNECTOR:
      llm:
        model: Deepseek/deepseek-v4-pro   # Deepseek/deepseek-v3.2效果不太行
        prompt_template: |
          你是一个 MCP (Model Context Protocol) 工具分析专家。
          请分析以下 MCP Server 提供的工具列表，识别知识库文档获取相关的工具，并为每个工具
          推断"参数模板"和"响应字段映射"，使其能够直接被通用适配器使用。
          %s
          从上述工具中识别以下三类：
          1. list_docs：列表/搜索/浏览文档/文件/资源的工具。
          2. get_content：获取单个文档完整内容/详情的工具。
          3. get_changes：检测文档变更（按时间范围、delta、changes 等机制）的工具，可选。
          **核心原则：工具的每个 required 参数都必须有明确的值来源，否则运行时会报 missing required parameters。**
          值来源有三种（按优先级判断）：
          1. **response_mapping 动态注入**：如果该参数是以下语义之一，在 response_mapping 中声明映射即可，
             适配器运行时会自动注入对应值：
             - 搜索关键词 → "keyword_field": "参数名"
             - 文件夹/目录 ID → "folder_field": "参数名"
             - 每页数量/返回条数 → "page_size_field": "参数名"
             - 偏移量 → "offset_field": "参数名"
             - 页码 → "page_field": "参数名"
             - 分页游标 → "page_token_field": "参数名"
             - 文档 ID → "doc_id_field": "参数名"
             - 变更起始时间 → "since_field": "参数名"
          2. **params_template 固定值**：如果该参数不属于上述任何动态语义，但有合理的固定默认值，
             写入 params_template。例如：
             - {"include_content": true}
             - {"sort_type": "modify_time"}
             - {"format": "markdown"}
          3. **同时放两处**：如果一个参数既需要动态注入，又需要提供默认值（如 required 的分页参数，
             前端可能不传 PageSize），可以在 params_template 中给默认值，同时在 response_mapping 中声明映射。
             运行时若调用方传了值则覆盖默认值。例如：
             params_template: {"num": 20}  +  response_mapping: {"page_size_field": "num"}
          **检查清单**：分析完成后，请逐一检查每个工具的 inputs 中所有 required=true 的参数，
          确认每个都被 response_mapping 或 params_template 覆盖。如果某个 required 参数无法归类，
          仍应放入 params_template 并给出最合理的默认值，避免运行时报错。
          response_mapping 是一个字符串 → 字符串的映射，告诉适配器：
            A) 用什么参数名传入动态值
            B) 从工具响应里哪个字段提取统一 Document 的属性
          **核心机制**：适配器运行时有以下动态值，会自动注入到 MCP 工具调用参数中。
          你需要告诉适配器"该工具的哪个参数对应哪个动态值"：
          A. 入参反向映射（值 = MCP 工具的实际参数名）：
             list_docs 工具可用的映射键：
             | 映射键             | SDK 注入的动态值          | 语义说明                                | 默认参数名   |
             |-------------------|-------------------------|----------------------------------------|------------|
             | keyword_field     | 用户输入的搜索关键词       | 用于搜索/过滤文档的文本                    | keyword    |
             | folder_field      | 用户指定的文件夹/目录 ID   | 用于浏览指定目录下的内容                    | folder_id  |
             | page_size_field   | 每页返回的条数（如 15/20/50）| 控制单次请求返回多少条结果                 | page_size  |
             | offset_field      | 偏移量（如 0/20/40）      | 基于偏移的分页，跳过前 N 条                 | offset     |
             | page_field        | 页码（如 1/2/3）          | 基于页码的分页，请求第 N 页                 | page       |
             | page_token_field  | 分页游标/token           | 基于游标的分页，传入上次返回的 next_token    | page_token |
             get_content 工具可用的映射键：
             | 映射键         | SDK 注入的动态值    | 语义说明                  | 默认参数名 |
             |---------------|-------------------|--------------------------|----------|
             | doc_id_field  | 要获取内容的文档 ID  | 唯一标识一篇文档           | doc_id   |
             get_changes 工具可用的映射键：
             | 映射键       | SDK 注入的动态值         | 语义说明                    | 默认参数名      |
             |-------------|------------------------|-----------------------------|---------------|
             | since_field | 上次同步的时间戳（Unix）  | 只返回该时间之后变更的文档     | modified_since |
             **判断规则**：
             - "如果工具参数名与默认参数名一致，无需填写（适配器自动匹配）"
             - 如果工具参数名不同，必须填写映射。例如工具用 "num" 表示每页条数 → "page_size_field": "num"
             - **注意区分**：page_size_field 是"每页多少条"，page_field 是"第几页"，不要混淆！
          B. 响应字段映射（从工具描述/输出定义推断；若无法判断，省略）：
             - "list_path：列表所在的嵌套路径，dot-path 格式（如 \"data.documents\"）"
             - "id_field, name_field, type_field, size_field"
             - "modified_time_field, created_time_field"
             - "etag_field, url_field, download_url_field"
             - "content_field（仅 get_content 使用）"
             - "created_by_field, is_folder_field"
          例：某工具入参叫 "query"（不是默认的 keyword），分页参数叫 "num"，且响应结构为 {"result": {"items": [{"docId": "...", "title": "..."}]}}：
          {
            "keyword_field": "query",
            "page_size_field": "num",
            "list_path": "result.items",
            "id_field": "docId",
            "name_field": "title"
          }
          只输出 JSON，不要 Markdown 包裹，不要任何额外说明：
          {
              "connector_tools": [
                  {
                      "tool_name": "工具名称（必须严格匹配输入列表）",
                      "fun": "list_docs",
                      "desc": "选择此工具的原因",
                      "usage": "browse",
                      "params_template": {},
                      "response_mapping": {
                          "page_size_field": "num",
                          "list_path": "data.items",
                          "id_field": "doc_id",
                          "name_field": "title"
                      },
                      "confidence": 0.92
                  }
              ],
              "analysis_summary": "对该 MCP Server 知识获取能力的总体评估"
          }
          约束：
          - fun 取值: list_docs / get_content / get_changes
          - "confidence 为 0~1 之间的浮点数，低于 0.6 的工具不要输出"
          - "usage 仅 list_docs 使用，取值 browse / search"
          - "tool_name 必须与输入列表完全一致，不能编造"
          - "response_mapping 中的键必须从上述合法键名中选取，未知字段一律省略"
          - "每个工具的所有 required 参数必须在 params_template 或 response_mapping 中有覆盖"
          - "params_template 中不确定的参数宁可给默认值也不要遗漏，避免运行时 missing required parameters"

