kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-time-scheduler
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    database:
      service_name: ${APPLICATION_DATABASE_SERVICE_NAME}
      auto_migrate: ${APPLICATION_DATABASE_AUTO_MIGRATE}

    corp_assistant:
      default_model_id: ${APPLICATION_CORP_ASSISTANT_DEFAULT_MODEL_ID}
      default_workspace_id: ${APPLICATION_CORP_ASSISTANT_DEFAULT_WORKSPACE_ID}
      default_agent_id: ${APPLICATION_CORP_ASSISTANT_DEFAULT_AGENT_ID}
      timezone: ${APPLICATION_CORP_ASSISTANT_TIMEZONE}
      task_quota_per_user: ${APPLICATION_CORP_ASSISTANT_TASK_QUOTA_PER_USER}

    scheduler:
      shard_count: ${APPLICATION_SCHEDULER_SHARD_COUNT}
      node_id: ${POD_NAME}
      tick: ${APPLICATION_SCHEDULER_TICK}
      l0_tick: ${APPLICATION_SCHEDULER_L0_TICK}
      l1_tick: ${APPLICATION_SCHEDULER_L1_TICK}
      preload_window: ${APPLICATION_SCHEDULER_PRELOAD_WINDOW}
      preload_scan_interval: ${APPLICATION_SCHEDULER_PRELOAD_SCAN_INTERVAL}
      executor_poll_interval: ${APPLICATION_SCHEDULER_EXECUTOR_POLL_INTERVAL}
      executor_batch_size: ${APPLICATION_SCHEDULER_EXECUTOR_BATCH_SIZE}
      executor_max_concurrency: ${APPLICATION_SCHEDULER_EXECUTOR_MAX_CONCURRENCY}
      push_poll_interval: ${APPLICATION_SCHEDULER_PUSH_POLL_INTERVAL}
      push_batch_size: ${APPLICATION_SCHEDULER_PUSH_BATCH_SIZE}
      push_max_concurrency: ${APPLICATION_SCHEDULER_PUSH_MAX_CONCURRENCY}
      heartbeat_interval: ${APPLICATION_SCHEDULER_HEARTBEAT_INTERVAL}
      execution_lease: ${APPLICATION_SCHEDULER_EXECUTION_LEASE}
      max_attempt: ${APPLICATION_SCHEDULER_MAX_ATTEMPT}
      retry_backoff: ${APPLICATION_SCHEDULER_RETRY_BACKOFF}

    chat_service:
      mode: ${APPLICATION_CHAT_SERVICE_MODE}
      create_conversation_timeout: ${APPLICATION_CHAT_SERVICE_CREATE_CONVERSATION_TIMEOUT}
      sse_timeout: ${APPLICATION_CHAT_SERVICE_SSE_TIMEOUT}
      retry_count: ${APPLICATION_CHAT_SERVICE_RETRY_COUNT}
      idempotency_metadata_key: ${APPLICATION_CHAT_SERVICE_IDEMPOTENCY_METADATA_KEY}
      prompt_guardrail: ${APPLICATION_CHAT_SERVICE_PROMPT_GUARDRAIL}

    channel_service:
      mode: ${APPLICATION_CHANNEL_SERVICE_MODE}
      push_timeout: ${APPLICATION_CHANNEL_SERVICE_PUSH_TIMEOUT}
      retry_count: ${APPLICATION_CHANNEL_SERVICE_RETRY_COUNT}

    coordination:
      mode: ${APPLICATION_COORDINATION_MODE}
      endpoint: ${APPLICATION_COORDINATION_ENDPOINT}

  client.yaml: |
    client:
      namespace: ${CLIENT_NAMESPACE}
      filter:
        - opentelemetry
        - cle-route-propagator
        - chat-trace
      stream_filter:
      service:
        - name: tdsql.adp.time_scheduler
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - callee: trpc.adp.chat_manage.Chat
          target: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9091"
          namespace: ${CLIENT_NAMESPACE}
          network: tcp
          timeout: 30000
        - callee: trpc.adp.chat_manage.http
          target: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9099"
          namespace: ${CLIENT_NAMESPACE}
          network: tcp                    # 后端服务的网络类型 tcp udp 配置优先
          protocol: http                  # 应用层协议 trpc http
          timeout: 5400000
        - callee: trpc.adp.app_channel.Api
          target: "ip://adp-app-channel.{{ .Release.Namespace }}.svc.cluster.local:8002"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 30000
        - callee: trpc.adp.agent_config.AgentConfigApi
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.resource_gallery.Admin
          target: "ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 60000
        # 平台管理服务 - 登录态校验 (session filter 调用 CheckSession/CheckPermission)
        - name: trpc.adp.platform_manager.Login
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 30000

  env.yaml: |
    version: 2.0.0 # 固定值，不需要修改
    kind: env # 固定值，不需要修改
    metadata:
        name: formal # 环境名称 [选填]

