      "【图%d】": "【图%d】",
      "，也是%s": "，也是%s",
      "文档URL%d:%s": "文档URL%d：%s",
      "【图": "【图",
      "《%s》摘要：%s\n\n": "《%s》摘要：%s\n\n",
      "【图%d】描述：%s\n\n": "【图%d】描述：%s\n\n",
      "描述所有的文件和图片": "描述所有文件和图片",
      "用户输入": "用户输入",
      "从长期记忆中召回": "从长期记忆中召回",
      "调用思考模型": "调用思考模型",
      "调用生成模型": "调用生成模型",
      "调用工具": "调用工具",
      "执行任务": "执行任务",
      "用户画像信息\n": "用户画像信息\n",
      "专属模型超出并发数限制": "专属模型超出并发数限制",
      "task quota exceeded": "每个子uin在每个空间下的定时任务上限100个"
    }
  trpc_go.yaml: |
    global:
      env_name: ${TRPC_GO_GLOBAL_ENV_NAME}
      namespace: ${TRPC_GO_GLOBAL_NAMESPACE}
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}

    server:
      app: adp
      server: time-scheduler
      conf_path: /app/conf/
      admin:
        ip: ${POD_IP}
        port: 8081
      filter:
        - recovery
        - accesslog
        - validation
        - opentelemetry
        - cle-route-propagator
        - i18n-adp    # 在recovery filter之后引用，避免filter里的错误覆盖掉i18n错误
      service:
        - name: trpc.adp.time_scheduler.External
          ip: ${POD_IP}
          port: 9090
          network: tcp
          protocol: trpc
          filter:
            - session
          timeout: 30000
        - name: trpc.adp.time_scheduler.ExternalCAPI
          ip: ${POD_IP}
          port: 9091
          network: tcp
          protocol: adp-capi
          filter:
            - session
          timeout: 30000
    plugins:
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      selector:
        polaris:
          protocal: grpc
          discovery:
            refresh_interval: 10000
          enable_servicerouter: true
          enable_trans_meta: true
      i18n:
        i18n-adp:
          default_lang: ${TRPC_GO_I18N_DEFAULT_LANGUAGE}
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: time_scheduler
            error_prefix: error
            char_scaling_factor:
              zh: 1
              en: 3

    client:
      namespace: ${CLIENT_NAMESPACE}
      filter:
        - opentelemetry
        - cle-route-propagator
        - chat-trace
      stream_filter:
      service:
        - name: tdsql.adp.time_scheduler
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - callee: trpc.adp.chat_manage.Chat
          target: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9091"
          namespace: ${CLIENT_NAMESPACE}
          network: tcp
          timeout: 30000
        - callee: trpc.adp.chat_manage.http
          target: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9099"
          namespace: ${CLIENT_NAMESPACE}
          network: tcp                    # 后端服务的网络类型 tcp udp 配置优先
          protocol: http                  # 应用层协议 trpc http
          timeout: 5400000
        - callee: trpc.adp.app_channel.Api
          target: "ip://adp-app-channel.{{ .Release.Namespace }}.svc.cluster.local:8002"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 30000
        - callee: trpc.adp.agent_config.AgentConfigApi
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.resource_gallery.Admin
          target: "ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 60000
        # 平台管理服务 - 登录态校验 (session filter 调用 CheckSession/CheckPermission)
        - name: trpc.adp.platform_manager.Login
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091"
          namespace: ${CLIENT_NAMESPACE}
          protocol: trpc
          timeout: 30000
