  placeholder.yaml: |
    TRPC_GO_GLOBAL_ENV_NAME: formal
    TRPC_GO_GLOBAL_NAMESPACE: Production
    TRPC_GO_DISABLE_STREAM_TRACE_BODY: true
    TRPC_GO_LOG_WRITER: console
    TRPC_GO_FILE_LOG_LEVEL: info
    TRPC_GO_FILE_LOG_PATH: /app/logs/trpc.log
    TRPC_GO_FILE_LOG_WRITE_MODE: 2
    TRPC_GO_FILE_LOG_ROLL_TYPE: time
    TRPC_GO_FILE_LOG_MAX_SIZE: 100
    TRPC_GO_FILE_LOG_MAX_AGE: 7
    TRPC_GO_FILE_LOG_MAX_BACKUPS: 10
    TRPC_GO_FILE_LOG_COMPRESS: false
    TRPC_GO_FILE_LOG_TIME_UNIT: day
    TRPC_GO_I18N_DEFAULT_LANGUAGE: zh-CN

    CLIENT_NAMESPACE: Production
    CLIENT_ENV_NAME: formal
    CLIENT_TIME_SCHEDULER_TDSQL_TARGET: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
    CLIENT_CHAT_MANAGE_CHAT_TARGET: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9091"
    CLIENT_CHAT_MANAGE_HTTP_TARGET: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9099"
    CLIENT_APP_CHANNEL_API_TARGET: "ip://adp-app-channel.{{ .Release.Namespace }}.svc.cluster.local:8002"
    CLIENT_AGENT_CONFIG_SERVER_AGENTCONFIGAPI_TARGET: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
    CLIENT_RESOURCE_GALLERY_ADMIN_TARGET: "ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090"
    PLATFORM_MANAGER_LOGIN_TARGET: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091"

    #application.yaml
    APPLICATION_DATABASE_SERVICE_NAME: tdsql.adp.time_scheduler
    APPLICATION_DATABASE_AUTO_MIGRATE: false

    APPLICATION_CORP_ASSISTANT_DEFAULT_MODEL_ID: TCADP/glm-5.1
    APPLICATION_CORP_ASSISTANT_DEFAULT_WORKSPACE_ID: default-folder
    APPLICATION_CORP_ASSISTANT_DEFAULT_AGENT_ID: corp-assistant-default
    APPLICATION_CORP_ASSISTANT_TIMEZONE: Asia/Shanghai
    APPLICATION_CORP_ASSISTANT_TASK_QUOTA_PER_USER: 100

    APPLICATION_SCHEDULER_SHARD_COUNT: 4096
    APPLICATION_SCHEDULER_TICK: 100ms
    APPLICATION_SCHEDULER_L0_TICK: 100ms
    APPLICATION_SCHEDULER_L1_TICK: 1s
    APPLICATION_SCHEDULER_PRELOAD_WINDOW: 120s
    APPLICATION_SCHEDULER_PRELOAD_SCAN_INTERVAL: 500ms
    APPLICATION_SCHEDULER_EXECUTOR_POLL_INTERVAL: 300ms
    APPLICATION_SCHEDULER_EXECUTOR_BATCH_SIZE: 32
    APPLICATION_SCHEDULER_EXECUTOR_MAX_CONCURRENCY: 500
    APPLICATION_SCHEDULER_PUSH_POLL_INTERVAL: 500ms
    APPLICATION_SCHEDULER_PUSH_BATCH_SIZE: 32
    APPLICATION_SCHEDULER_PUSH_MAX_CONCURRENCY: 500
    APPLICATION_SCHEDULER_HEARTBEAT_INTERVAL: 3s
    APPLICATION_SCHEDULER_EXECUTION_LEASE: 15s
    APPLICATION_SCHEDULER_MAX_ATTEMPT: 3
    APPLICATION_SCHEDULER_RETRY_BACKOFF:
      - 3s
      - 10s
      - 30s

    APPLICATION_CHAT_SERVICE_MODE: real
    APPLICATION_CHAT_SERVICE_CREATE_CONVERSATION_TIMEOUT: 10s
    APPLICATION_CHAT_SERVICE_SSE_TIMEOUT: 90m
    APPLICATION_CHAT_SERVICE_RETRY_COUNT: 2
    APPLICATION_CHAT_SERVICE_IDEMPOTENCY_METADATA_KEY: x-idempotency-key
    APPLICATION_CHAT_SERVICE_PROMPT_GUARDRAIL: 

    APPLICATION_CHANNEL_SERVICE_MODE: real
    APPLICATION_CHANNEL_SERVICE_PUSH_TIMEOUT: 6s
    APPLICATION_CHANNEL_SERVICE_RETRY_COUNT: 2

    APPLICATION_COORDINATION_MODE: etcd
    APPLICATION_COORDINATION_ENDPOINT: "etcd.{{ .Release.Namespace }}.svc.cluster.local:2379"

