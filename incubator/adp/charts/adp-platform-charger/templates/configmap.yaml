  client.yaml: |
    client:
      filter:
        - opentelemetry
      service:
        - name: mysql.finance.finance
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_finance?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.finance.finance.slave
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_finance?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.finance.wedata
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_finance?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: redis.finance.finance
          network: tcp
          target: "ip://${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/10"
          password: ${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}
          timeout: 800
        - name: kafka.finance.finance.pay_producer
          target: "kafka://${INFRA_MIDDLEWARES_KAFKA_0_HOSTS}:${INFRA_MIDDLEWARES_KAFKA_0_PORT}?topic=pay&compression=none&partitioner=random&requiredAcks=-1"
          timeout: 5000
        - name: cloud.trade.gateway.http
          network: tcp
          protocol: http
          target: "ip://127.0.0.1:1"  # 私有化不使用公有云计量计费，占位避免空target panic
          namespace: ${POD_NAMESPACE}
          timeout: 5000
        - name: qcloud.measure.http
          network: tcp
          protocol: http
          target: "ip://127.0.0.1:1"  # 私有化不使用
          namespace: ${POD_NAMESPACE}
        - name: trpc.SmartAssistant.ResourceManager.ManagerObj
          namespace: ${POD_NAMESPACE}
          timeout: 3000
        - name: trpc.measure.tpapi.common.http
          network: tcp
          protocol: http
          target: "ip://127.0.0.1:1"  # 私有化不使用
          namespace: ${POD_NAMESPACE}
        - name: trpc.measure.openapi.resource.http
          network: tcp
          protocol: http
          target: "ip://127.0.0.1:1"  # 私有化不使用
          namespace: ${POD_NAMESPACE}
        - name: qcloud.account.http
          network: tcp
          protocol: http
          target: "ip://127.0.0.1:1"  # 私有化不使用
        - name: qcloud.msg.queue.http
          namespace: ${POD_NAMESPACE}
          network: tcp
          protocol: http
          target: "ip://127.0.0.1:1"  # 私有化不使用
        - name: trpc.KEP.bot-knowledge-config-server.Api
          target: "ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092"
          namespace: ${POD_NAMESPACE}
          callee: trpc.KEP.bot_knowledge_config_server.Api
          timeout: 3000
        - name: trpc.adp.kb-config.Api
          callee: trpc.adp.kb_config.Api
          target: "ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092"
          namespace: ${POD_NAMESPACE}
          protocol: trpc
          timeout: 60000
        - callee: trpc.ocr_app.qps_order_server.OcrQpsOrder
          name: trpc.ocr_app.qps_order_server.OcrQpsOrder
          network: tcp
          protocol: trpc
          timeout: 5000
          namespace: ${POD_NAMESPACE}
        - callee: trpc.KEP.bot_admin_config_server.Api
          namespace: ${POD_NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Api
          namespace: ${POD_NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.bot_admin_config_server.Login
          namespace: ${POD_NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.platform_manager.Login
          namespace: ${POD_NAMESPACE}
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 6000
        - callee: trpc.adp.resource_gallery.Admin
          namespace: ${POD_NAMESPACE}
          target: "ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          timeout: 20000
        - name: finance.dianshi.order
          network: tcp
          protocol: http
          target: "ip://127.0.0.1:1"  # 私有化不使用
          namespace: ${POD_NAMESPACE}
          timeout: 20000
        - callee: trpc.adp.platform_charger.Finance
          namespace: ${POD_NAMESPACE}
          network: tcp
          timeout: 300000
          target: ${TARGET_FINANCE}
        - callee: trpc.adp.platform_account.Internal
          namespace: ${CLIENT_NAMESPACE}
          target: "ip://adp-platform-account.{{ .Release.Namespace }}.svc.cluster.local:9092"  # TODO: 待人工确认
          protocol: trpc
          timeout: 5000


