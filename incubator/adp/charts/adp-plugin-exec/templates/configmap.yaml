      - name: mi_text2image
        headers: []
        tools:
          - name: SubmitMITextToImageJob
            handler_name: SubmitMITextToImageJob
            description: "提交MI文生图任务。MI文生图基于混元大模型，根据输入的文本描述智能生成图像。任务以异步方式提交，需通过 DescribeMITextToImageJob 接口查询结果。"
            properties:
              - name: Prompt
                type: string
                required: true
                description: "文本信息，长度[1-8192]（必填）。算法将根据输入的文本智能生成与之相关的图像。"
              - name: Callback
                type: string
                required: false
                description: 任务结果回调通知接口（可选）。
              - name: LogoAdd
                type: integer
                required: false
                description: 为生成图片添加标识的开关，默认为1。1：添加标识；0：不添加标识；其他数值：默认按1处理。
                default: 1
              - name: LogoParam
                type: object
                required: false
                description: "标识内容设置。默认在生成结果图右下角添加“图片由 AI 生成”字样，您可根据自身需要替换为其他的标识图片。"
                properties:
                  - name: LogoUrl
                    type: string
                    required: false
                    description: 水印Url（与LogoImage二选一，同时提供以LogoUrl为准）。
                  - name: LogoImage
                    type: string
                    required: false
                    description: 水印Base64（与LogoUrl二选一）。
                  - name: LogoRect
                    type: object
                    required: false
                    description: 水印图片在结果图中的位置和大小。
                    properties:
                      - name: X
                        type: integer
                        description: "水印图框X坐标。>0:原点在左侧向右；<0:原点在右侧向左。"
                      - name: Y
                        type: integer
                        description: "水印图框Y坐标。>0:原点在上侧向下；<0:原点在下侧向上。"
                      - name: Width
                        type: integer
                        description: 水印图框宽度。
                      - name: Height
                        type: integer
                        description: 水印图框高度。
          - name: DescribeMITextToImageJob
            handler_name: DescribeMITextToImageJob
            description: "查询MI文生图任务结果。需传入 SubmitMITextToImageJob 接口返回的 JobId。"
            properties:
              - name: JobId
                type: string
                required: true
                description: 任务ID。
      - name: content_to_image_gpt
        headers: []
        tools:
          - name: SubmitContentToImageGPTJob
            handler_name: SubmitContentToImageGPTJob
            description: 提交图片生成GPT版任务。基于用户提供的文本描述和/或图片，调用API创建图片生成任务，返回任务ID用于后续状态查询和结果获取。
            properties:
              - name: Prompt
                type: string
                required: false
                description: 文本描述，最大支持32000字符
              - name: Model
                type: string
                required: false
                description: 模型选择。默认：gpt-image-2
              - name: Images
                type: array
                required: false
                description: 输入图，支持1-16张图片
                items:
                  type: object
                  properties:
                  - name: ImageUrl
                    type: string
                    required: false
                    description: 图片URL，支持png、jpg、webp格式，暂不支持传base64编码数据
              - name: Mask
                type: object
                required: false
                description: 遮罩图，透明区域为编辑区域，仅支持png格式。通过ImageUrl或已上传的FileId引用输入图像，只能传其中的一个。
                properties:
                  - name: ImageUrl
                    type: string
                    required: false
                    description: 遮罩图片URL
              - name: InputFidelity
                type: string
                required: false
                description: 控制对原始输入图像的保真度。取值范围：high、low
              - name: Size
                type: string
                required: false
                description: "生成的图像尺寸。枚举值：1024x1024、1536x1024（横向）、1024x1536（纵向）、auto（默认值）。另外支持自定义尺寸（单边≤3840px，宽高为16的倍数，长短边比≤3:1，总像素655360~8294400）"
              - name: Quality
                type: string
                required: false
                description: 图像画质。支持：auto、high、medium、low
              - name: Background
                type: string
                required: false
                description: 生成图像背景的透明度。可选值：transparent、opaque、auto（默认值）。注意：gpt-image-2模型不支持输入值transparent
              - name: N
                type: integer
                required: false
                description: 生图数量，取值范围1-10，默认值：1
              - name: OutputFormat
                type: string
                required: false
                description: 生成图像的返回格式。支持：png、jpeg
              - name: OutputCompression
                type: integer
                required: false
                description: 生成图像的压缩级别（0-100），仅支持输出格式为jpeg时生效。默认值：100
              - name: LogoAdd
                type: integer
                required: false
                description: 为生成图片添加标识的开关，默认为1。1：添加标识；0：不添加标识；其他数值：默认按1处理。
              - name: LogoParam
                type: object
                required: false
                description: "标识内容设置。默认在生成结果图右下角添加“图片由 AI 生成”字样，您可根据自身需要替换为其他的标识图片。"
                properties:
                  - name: LogoUrl
                    type: string
                    required: false
                    description: 水印Url（与LogoImage二选一，同时提供以LogoUrl为准）。
                  - name: LogoImage
                    type: string
                    required: false
                    description: 水印Base64（与LogoUrl二选一）。
                  - name: LogoRect
                    type: object
                    required: false
                    description: 水印图片在结果图中的位置和大小。
                    properties:
                      - name: X
                        type: integer
                        description: "水印图框X坐标。>0:原点在左侧向右；<0:原点在右侧向左。"
                      - name: Y
                        type: integer
                        description: "水印图框Y坐标。>0:原点在上侧向下；<0:原点在下侧向上。"
                      - name: Width
                        type: integer
                        description: 水印图框宽度。
                      - name: Height
                        type: integer
                        description: 水印图框高度。
          - name: DescribeContentToImageGPTJob
            handler_name: DescribeContentToImageGPTJob
            description: 查询图片生成GPT版任务。通过JobId查询任务的处理状态和结果，任务处理完成后可获得生成图像结果。
            properties:
              - name: JobId
                type: string
                required: true
                description: 任务ID。由SubmitContentToImageGPTJob接口返回
