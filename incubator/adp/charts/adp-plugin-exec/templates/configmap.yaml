                type: string
                required: false
                description: "文生3D，3D内容的描述，中文正向提示词。最多支持1024个 utf-8 字符。ImageBase64、ImageUrl和 Prompt必填其一，且Prompt和ImageBase64/ImageUrl不能同时存在。"
              - name: ImageBase64
                type: string
                required: false
