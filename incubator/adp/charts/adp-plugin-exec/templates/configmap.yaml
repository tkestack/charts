                type: "array"
                required: false
                description: "多视角的模型图片数组，数组元素为ViewImage对象。每个ViewImage对象包含：ViewType（视角类型，取值：back/left/right）、ViewImageUrl（图片Url地址）、ViewImageBase64（图片base64数据）。每个视角仅限一张图片，图片大小不超过8M，分辨率小于5000且大于128，支持jpg或png格式。"
                items:
                  type: "object"
                  properties:
                    - name: "ViewType"
                      type: "string"
                      required: false
                      description: "视角类型，取值：back（后视图）、left（左视图）、right（右视图）。"
                    - name: "ViewImageUrl"
                      type: "string"
                      required: false
                      description: "图片Url地址。"
                    - name: "ViewImageBase64"
                      type: "string"
                      required: false
                      description: "图片base64数据。"
              - name: "EnablePBR"
                type: "boolean"
                required: false
                description: "是否开启 PBR材质生成，默认 false。"
              - name: "FaceCount"
                type: "integer"
                required: false
                description: "生成3D模型的面数，默认值为500000。可支持生成面数范围：40000-1500000。"
              - name: "GenerateType"
                type: "string"
                required: false
                description: "生成任务类型，默认Normal。可选值：Normal（生成带纹理的几何模型）、LowPoly（生成智能减面后的模型）、Geometry（生成不带纹理的几何模型/白模，此时EnablePBR不生效）、Sketch（输入草图或线稿图生成模型，此模式下prompt和ImageUrl/ImageBase64可一起输入）。"
              - name: "PolygonType"
                type: "string"
                required: false
                description: "多边形类型，仅在GenerateType选择LowPoly模式时生效。表示模型的表面由几边形网格构成，默认为triangle。可选值：triangle（三角形面）、quadrilateral（四边形面与三角形面混合生成）。"
          - name: "QueryHunyuanTo3DProJob"
            handler_name: "QueryHunyuanTo3DProJob"
            description: "查询混元生3D专业版任务状态，获取生成的3D文件数组和任务执行状态。返回结果包含：Status（任务状态：WAIT等待中/RUN执行中/FAIL任务失败/DONE任务成功）、ResultFile3Ds（3D文件数组，每个文件包含Type文件格式、Url文件地址、PreviewImageUrl预览图地址）。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID，由SubmitHunyuanTo3DProJob接口返回，有效期24小时。"
      - name: "image_translate_llm"
        headers: ["SECRET_ID","SECRET_KEY", "REGION"]
        tools:
          - name: "ImageTranslateLLM"
            handler_name: "ImageTranslateLLM"
            description: "自动识别图片中的文本内容并翻译成目标语言"
            properties:
              - name: "Data"
                type: "string"
                required: false
                description: "图片数据的Base64字符串，经Base64编码后不超过 9M，分辨率建议600*800以上，支持PNG、JPG、JPEG格式。和Url二选一"
              - name: "Target"
                type: "string"
                required: true
                description: "目标语言代码，支持语言：zh（中文）、zh-TW（繁体中文-台湾）、zh-HK（繁体中文-香港）、en（英文）、ja（日文）、ko（韩文）、th（泰文）、vi（越南文）、ru（俄文）、de（德文）、fr（法文）、ar（阿拉伯文）、es（西班牙文）、it（意大利文）、id（印尼文）、ms（马来文）、pt（葡萄牙文）、tr（土耳其文）。"
              - name: "Url"
                type: "string"
                required: false
                description: "输入图 Url。图片限制：小于 10MB，分辨率建议600*800以上，格式支持 jpg、jpeg、png。和 Data 二选一"
      - name: "hunyuan_video_1.5"
        headers: ["SECRET_ID","SECRET_KEY", "REGION"]
        tools:
          - name: "SubmitHunyuanToVideoJob"
            handler_name: "SubmitHunyuanToVideoJob"
            description: "提交混元生视频任务"
            properties:
              - name: "Prompt"
                type: "string"
                required: true
                description: "视频内容的描述，中文正向提示词。最多支持200个 utf-8 字符（首尾空格不计入字符数）。示例值：一只猫在草原上奔跑，写实风格"
              - name: "Image"
                type: "object"
                required: false
                description: "输入图片。上传图url大小不超过 10M，base64不超过8M。支持jpg，png，jpeg，webp，bmp，tiff 格式。单边分辨率不超过5000，不小于50，长宽限制1:4 ~ 4:1"
                properties:
                  - name: "Url"
                    type: "string"
                    required: false
                    description: "图片Url"
                  - name: "Base64"
                    type: "string"
                    required: false
                    description: "图片Base64"
              - name: "Resolution"
                type: "string"
                required: false
                description: "目前仅支持720p视频分辨率，默认720p。示例值：720p"
              - name: "LogoAdd"
                type: "integer"
                required: false
                description: "为生成视频添加标识的开关，默认为1，0 需前往控制台申请开启显示标识自主完成方可生效。1：添加标识；0：不添加标识；其他数值：默认按1处理。示例值：0"
              - name: "LogoParam"
                type: "object"
                required: false
                description: "默认在生成视频的右下角添加' AI 生成'字样，如需替换为其他的标识图片，需前往控制台申请开启显示标识自主完成。"
                properties:
                  - name: "LogoUrl"
                    type: "string"
                    required: false
                    description: "水印 Url"
                  - name: "LogoImage"
                    type: "string"
                    required: false
                    description: "水印 Base64，Url 和 Base64 二选一传入，如果都提供以 Url 为准"
                  - name: "LogoRect"
                    type: "object"
                    required: false
                    description: "水印图片位于生成结果图中的坐标及宽高，将按照坐标对标识图片进行位置和大小的拉伸匹配。"
                    properties:
                      - name: "X"
                        type: "integer"
                        required: false
                        description: "水印图框X坐标值。当值大于0时，坐标轴原点位于原图左侧，方向指右；当值小于0时，坐标轴原点位于原图右侧，方向指左。"
                      - name: "Y"
                        type: "integer"
                        required: false
                        description: "水印图框Y坐标值。当值大于0时，坐标轴原点位于原图上侧，方向指下；当值小于0时，坐标轴原点位于原图下侧，方向指上。"
                      - name: "Width"
                        type: "integer"
                        required: false
                        description: "水印图框宽度。"
                      - name: "Height"
                        type: "integer"
                        required: false
                        description: "水印图框高度。"
          - name: "DescribeHunyuanToVideoJob"
            handler_name: "DescribeHunyuanToVideoJob"
            description: "查询混元生视频任务"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID。示例值：1350360280588853248"
      - name: "vedas_ppt"
        headers: []
        tools:
          - name: "SubmitVedasPPTJob"
            handler_name: "SubmitVedasPPTJob"
            description: "创建PPT生成任务。请注意：PPT生成通常需要10-20分钟，请您耐心等待。"
            properties:
              - name: "Prompt"
                type: "string"
                required: true
                description: "用户输入prompt"
              - name: "SessionID"
                type: "string"
                required: false
                description: "会话id标识一整个对话。不传参的情况，表示新启动一个对话；传参的情况，等同于连续的对话。"
          - name: "QueryVedasPPTJob"
            handler_name: "QueryVedasPPTJob"
            description: "查询PPT生成任务"
            properties:
              - name: "JobID"
                type: "string"
                required: true
                description: "任务ID。由SubmitVedasPPTJob接口返回"
      - name: "sa_video"
        headers: []
        tools:
          - name: "SubmitSAVideoJob"
            handler_name: "SubmitSAVideoJob"
            description: "创建视频生成任务。基于用户提供的文本和图片，调用API创建任务，返回任务ID用于后续状态查询和文件获取。"
            properties:
              - name: "Prompt"
                type: "string"
                required: true
                description: "正向文本提示词，不超过2000个字符"
              - name: "Image"
                type: "string"
                required: false
                description: "首帧图片URL（确保可访问），图片支持格式：png、jpeg、webp，图片大小不超过10M。分辨率要求：与Resolution配置的分辨率相同"
              - name: "Duration"
                type: "integer"
                required: false
                description: "生成视频时长，单位s，可选项包括：4、8、12，默认4"
              - name: "Resolution"
                type: "string"
                required: false
                description: "分辨率，可选项：720x1280、1280x720，默认720x1280"
          - name: "QuerySAVideoJob"
            handler_name: "QuerySAVideoJob"
            description: "查询视频生成任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID"
      - name: "gi_image"
        headers: []
        tools:
          - name: "SubmitGIImageJob"
            handler_name: "SubmitGIImageJob"
            description: "创建图片生成任务。基于用户提供的图片和文本，调用API创建任务，返回任务ID用于后续状态查询和文件获取。"
            properties:
              - name: "Prompt"
                type: "string"
                required: true
                description: "正向文本提示词，不超过2000个字符"
              - name: "Images"
                type: "array"
                required: false
                description: "图像参考，支持上传1～11张图片。为了保证最终效果，建议上传：最多6张高保真对象图片，用于包含在最终图片中；最多5张人像照片，以保持角色一致性"
                items:
                  type: "object"
                  properties:
                    - name: "Url"
                      type: "string"
                      required: false
                      description: "图像URL"
                    - name: "Base64"
                      type: "string"
                      required: false
                      description: "图片Base64"
              - name: "AspectRatio"
                type: "string"
                required: false
                description: "画面纵横比（宽：高），可选项包括：\"1:1\"、\"2:3\"、\"3:2\"、\"3:4\"、\"4:3\"、\"4:5\"、\"5:4\"、\"9:16\"、\"16:9\"、\"21:9\"，默认16:9"
              - name: "Resolution"
                type: "string"
                required: false
                description: "分辨率，可选项：1K、2K、4K，默认2K"
          - name: "QueryGIImageJob"
            handler_name: "QueryGIImageJob"
            description: "查询图片生成任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID"
      - name: "veo_video"
        headers: []
        tools:
          - name: "SubmitVOVideoJob"
            handler_name: "SubmitVOVideoJob"
            description: "创建视频生成任务。基于用户提供的文本和图片，调用API创建任务，返回任务ID用于后续状态查询和文件获取。"
            properties:
              - name: "Prompt"
                type: "string"
                required: false
                description: "正向文本提示词，不超过2000个字符。文生视频时必填；图生视频时选填。"
              - name: "NegativePrompt"
                type: "string"
                required: false
                description: "负向文本提示词，不超过2000个字符。"
              - name: "Image"
                type: "string"
                required: false
                description: "首帧图像url，只支持1张图，jpg、png、jpeg、webp格式，大小不超过10M。图生视频时必填。"
              - name: "Model"
                type: "string"
                required: false
                description: "模型版本。可选项包括：V3-Fast、V3、V3-1Fast、V3-1。默认为V3。"
              - name: "Duration"
                type: "integer"
                required: false
                description: "生成视频时长，单位s。可选项包括：4、6、8。默认为4。"
              - name: "AspectRatio"
                type: "string"
                required: false
                description: "画面纵横比（宽：高）。可选项包括：16:9，9:16。默认为16:9。"
              - name: "Resolution"
                type: "string"
                required: false
                description: "分辨率。可选项：720p、1080p。默认为720p。"
          - name: "QueryVOVideoJob"
            handler_name: "QueryVOVideoJob"
            description: "查询视频生成任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID。通过SubmitVOVideoJob接口返回获取。"
      - name: "vidu_video"
        headers: []
        tools:
          - name: "SubmitViduTextToVideoJob"
            handler_name: "SubmitViduTextToVideoJob"
            description: "创建视频生成任务。基于用户提供的文本，调用文生视频API创建任务，返回任务ID用于后续状态查询和文件获取。"
            properties:
              - name: "Prompt"
                type: "string"
                required: true
                description: "正向文本提示词，一般不超过2500个字符。"
              - name: "Duration"
                type: "integer"
                required: false
                description: "生成视频时长，单位s。可选项包括：1-10（整数）。默认为5。"
              - name: "Bgm"
                type: "boolean"
                required: false
                description: "是否为生成的视频添加背景音乐。传true时系统将从预设BGM库中自动挑选合适的音乐并添加；不传或为false则不添加BGM。"
              - name: "AspectRatio"
                type: "string"
                required: false
                description: "画面纵横比（宽：高）。可选项包括：16:9，9:16，1:1，4:3，3:4。默认为16:9。"
              - name: "Resolution"
                type: "string"
                required: false
                description: "分辨率。可选项：540p、720p、1080p。默认为720p。"
          - name: "QueryViduTextToVideoJob"
            handler_name: "QueryViduTextToVideoJob"
            description: "查询视频生成任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID。通过SubmitViduTextToVideoJob接口返回获取。"
          - name: "SubmitViduImageToVideoJob"
            handler_name: "SubmitViduImageToVideoJob"
            description: "创建视频生成任务。基于用户提供的图片，调用图生视频API创建任务，返回任务ID用于后续状态查询和文件获取。"
            properties:
              - name: "Images"
                type: "array"
                required: true
                description: "首帧图像url列表，只支持1张图，jpg、png、jpeg、webp格式，比例小于1:4或4:1，大小不超过10M。"
                items:
                  type: "string"
              - name: "Prompt"
                type: "string"
                required: false
                description: "正向文本提示词，一般不超过2500个字符。选填。"
              - name: "Duration"
                type: "integer"
                required: false
                description: "生成视频时长，单位s。可选项包括：1-10（整数）。默认为5。"
              - name: "Audio"
                type: "boolean"
                required: false
                description: "是否使用音视频直出能力。false：输出静音视频；true：输出带台词以及背景音的视频。该参数为true时，VoiceId参数才生效。"
              - name: "VoiceId"
                type: "string"
                required: false
                description: "音色id，用来决定视频中的声音音色，为空时系统会自动推荐，Audio为true时才生效。"
              - name: "Resolution"
                type: "string"
                required: false
                description: "分辨率。可选项：540p、720p、1080p。默认为720p。"
          - name: "QueryViduImageToVideoJob"
            handler_name: "QueryViduImageToVideoJob"
            description: "查询视频生成任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID。通过SubmitViduImageToVideoJob接口返回获取。"
      - name: "kling_video"
