          ca_cert: none
        - name: llm.diagnosis.query.drug.instructions
          protocol: http
          network: tcp
          timeout: 10000
          target: "dns://miying.qq.com"
          namespace: Test
          ca_cert: none
        - callee: trpc.ai_tools.pc_tool_agent.ToolAgentSvr
