                description: "图片的URL地址。图片格式支持JPG、PNG、BMP。"
              - name: "ImageBase64"
                type: "string"
                required: false
                description: "图片经过base64编码的内容。与ImageUrl同时存在时优先使用ImageUrl字段。图片格式支持JPG、PNG、BMP。"
