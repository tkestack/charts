                type: "string"
                required: false
                description: "图片的Url地址。对应图片base64编码后大小不可超过5M，单边分辨率不超过4000。支持PNG、JPG、JPEG、BMP，不支持GIF图片。Image和Url必须提供一个，如果都提供，只使用Url。"
              - name: "Gender"
                type: "integer"
                required: true
                description: "性别转换类型，0表示男变女，1表示女变男。"
              - name: "RspImgType"
                type: "string"
                required: false
                description: "返回图片类型，url：返回图片链接，base64：返回base64编码。默认为url。"
  trpc_go.yaml: |
    global:
      namespace: ${NAMESPACE}
      env_name: ${GLOBAL_ENV_NAME}
      enable_set: false
      full_set_name: adp
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
    server:
      app: adp
      server: plugin-exec
      bin_path: /app/bin/
      conf_path: /app/conf/
      data_path: /app/data/
      filter:
        - recovery
        - i18n-adp
        - opentelemetry
        - cos_rewrite
      admin:
        ip: ${POD_IP}
        port: 8081
      service:
        - name: trpc.KEP.plugin-exec-server.PluginExec
          ip: ${POD_IP}
          port: 8000
          network: tcp
          protocol: trpc
          timeout: 7200000
          server_async: true
          idletime: 7200000
        - name: trpc.KEP.plugin-exec-server.PluginMCP
          ip: ${POD_IP}
          port: 8001
          network: tcp
          protocol: http_no_protocol
          timeout: 600000
          server_async: true
          idletime: 6000000
        - name: trpc.KEP.plugin-exec-server.PluginGateway
          ip: ${POD_IP}
          port: 8002
          network: tcp
          protocol: http_no_protocol
          timeout: 600000
          server_async: true
          idletime: 6000000
        - name: trpc.KEP.plugin-exec-server.PluginMCPStreamableSL
          ip: ${POD_IP}
          port: 8003
          network: tcp
          protocol: http_no_protocol
          timeout: 600000
          server_async: true
          idletime: 6000000
    plugins:
      log:
        default:
          - writer: console
            caller_skip: 3
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: rainbow-comm
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: plugin-exec
            error_prefix: error
            char_scaling_factor:
              zh-CN: 1
              en-US: 3
      selector:
        polaris:
          protocol: grpc
      registry:

