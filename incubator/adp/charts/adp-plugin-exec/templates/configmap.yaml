                    required: false
                    description: 水印Url
                  - name: LogoImage
                    type: string
                    required: false
                    description: 水印Base64，Url和Base64二选一传入，如果都提供以Url为准。
                  - name: LogoRect
                    type: object
                    required: false
                    description: 水印图片位于生成结果图中的坐标，将按照坐标对标识图片进行位置和大小的拉伸匹配。
                    properties:
                      - name: X
                        type: integer
                        required: false
                        description: 左上角X坐标
                      - name: Y
                        type: integer
                        required: false
                        description: 左上角Y坐标
                      - name: Width
                        type: integer
                        required: false
                        description: 方框宽度
                      - name: Height
                        type: integer
                        required: false
                        description: 方框高度
              - name: RspImgType
                required: false
                type: string
                description: "返回图像方式（base64或url) ，二选一，默认为url。url 有效期为1小时。"
