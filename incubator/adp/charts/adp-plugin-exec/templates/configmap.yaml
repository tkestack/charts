      - name: "text2image_3.0"
        headers: ["SECRET_ID","SECRET_KEY", "REGION"]
        tools:
          - name: "SubmitTextToImageJob"
            handler_name: "SubmitTextToImageJob"
            description: "提交混元生图3.0任务。"
            properties:
              - name: "Prompt"
                type: "string"
                required: true
                description: "文本描述。算法将根据输入的文本智能生成与之相关的图像。不能为空，推荐使用中文。最多可传1024个 utf-8 字符。示例值：雨中, 竹林, 小路"
              - name: "Resolution"
                type: "string"
                required: false
                description: "生成图分辨率，仅支持以下分辨率：640:1408,704:1344,768:1280,832:1216,896:1152,960:1088,1024:1024,1088:960,1152:896,1216:832,1280:768,1344:704,1408:640。示例值：1024:1024"
              - name: "Seed"
                type: "integer"
                required: false
                description: "随机种子，默认随机。不传：随机种子生成。正数：固定种子生成。扩写开启时固定种子不生效，将保持随机。示例值：1"
              - name: "LogoAdd"
                type: "integer"
                required: false
                description: "为生成结果图添加显式水印标识的开关，默认为1。1：添加。0：不添加。其他数值：默认按1处理。建议您使用显著标识来提示结果图使用了 AI 绘画技术，是 AI 生成的图片。示例值：1"
              - name: "LogoParam"
                type: "object"
                required: false
                description: "标识内容设置。默认在生成结果图右下角添加\"图片由 AI 生成\"字样，您可根据自身需要替换为其他的标识图片。"
                properties:
                  - name: "LogoUrl"
                    type: "string"
                    description: "水印Url(与LogoImage二选一)"
                    required: false
                  - name: "LogoImage"
                    type: "string"
                    description: "水印Base64(与LogoUrl二选一)"
                    required: false
                  - name: "LogoRect"
                    type: "object"
                    description: "水印图片位置和大小"
                    required: false
                    properties:
                      - name: "X"
                        type: "integer"
                        description: "水印图框X坐标。>0:原点在左侧向右 <0:原点在右侧向左"
                      - name: "Y"
                        type: "integer"
                        description: "水印图框Y坐标。>0:原点在上侧向下 <0:原点在下侧向上"
                      - name: "Width"
                        type: "integer"
                        description: "水印图框宽度"
                      - name: "Height"
                        type: "integer"
                        description: "水印图框高度"
              - name: "Revise"
                type: "integer"
                required: false
                description: "是否开启prompt改写，默认开启，改写预计会增加20s左右耗时。如果关闭改写，需要调用方自己接改写，否则对生图效果有较大影响。示例值：0"
              - name: "Images"
                type: "array"
                required: false
                description: "垫图url列表，用于图生图功能。大小不超过10MB，支持 jpg jpeg png webp格式，最多3张图。示例值：[\"https://xxx.jpeg\"]"
                items:
                  type: "string"
          - name: "QueryTextToImageJob"
            handler_name: "QueryTextToImageJob"
            description: "查询混元生图3.0任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务 ID。示例值：1344213737283272704"
