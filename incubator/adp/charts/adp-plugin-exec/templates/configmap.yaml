kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-plugin-exec
  namespace: {{ .Release.Namespace }}
data:
  client.yaml: |
    client:
      filter:
        - opentelemetry
      service:
        - name: mysql.llm.plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: trpc.SmartAssistant.LLMManagerServer.Chat
          target: ip://llm-manager-server.{{ .Release.Namespace }}.svc.cluster.local:10001
          protocol: trpc
          network: tcp
          timeout: 600000
          namespace: ${NAMESPACE_2}
          env_name: ${LLM_MANAGER_ENV_NAME}
          service_name: trpc.SmartAssistant.LLMManagerServer.Chat
        - callee: trpc.KEP.bot_admin_config_server.Api
          namespace: ${NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Api
          namespace: ${NAMESPACE}
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.plugin_config_server.PluginConfigApi
          namespace: ${NAMESPACE}
          target: "ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.plugin_config.PluginConfigApi
          namespace: ${NAMESPACE}
          target: "ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.code_interpreter_dispatcher.CodeExec
          namespace: ${NAMESPACE}
          target: "ip://adp-plugin-code-interpret.{{ .Release.Namespace }}.svc.cluster.local:8001"
          protocol: trpc
          timeout: 60000
        - callee: trpc.adp.plugin_code_interpret.CodeExec
          namespace: ${NAMESPACE}
          target: "ip://adp-plugin-code-interpret.{{ .Release.Namespace }}.svc.cluster.local:8001"
          protocol: trpc
          timeout: 60000
        - callee: trpc.SmartAssistant.WebParserServer.ParserObj
          namespace: ${NAMESPACE}
          target: ip://web-parser-server.{{ .Release.Namespace }}.svc.cluster.local:10001
          timeout: 60000
        - name: qbot.qbot.chat.StreamChat
          target: "ip://adp-chat-manage.{{ .Release.Namespace }}.svc.cluster.local:9190"
          protocol: trpc
          timeout: 60000
          namespace: ${NAMESPACE}
        - callee: trpc.KEP.bot_rag_server.Chat
          name: trpc.KEP.bot-rag-server.rpc
          target: "ip://adp-rag-exec.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: ${NAMESPACE}
          network: tcp
          protocol: trpc
          timeout: 300000
        - callee: trpc.adp.rag_exec.Chat
          name: trpc.KEP.bot-rag-server.rpc
          target: "ip://adp-rag-exec.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: ${NAMESPACE}
          network: tcp
          protocol: trpc
          timeout: 300000
        - name: weather.caiyun
          protocol: http
          network: tcp
          timeout: 5000
          target: "dns://api.caiyunapp.com"
          namespace: ${NAMESPACE}
          filter:
            - remove_trpc_headers
        - name: tencent.location
          protocol: http
          network: tcp
          timeout: 5000
          target: "dns://apis.map.qq.com"
          namespace: ${NAMESPACE}
          filter:
            - remove_trpc_headers
        - name: redis.plugin-exec-server
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${PLUGIN_REDIS_PORT}/${PLUGIN_REDIS_DB}"
        - name: mysql.news
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_digital_content?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: trpc.KEP.bot-llm-server.llm
          callee: trpc.KEP.bot_llm_server.llm
          target: "ip://adp-llm.{{ .Release.Namespace }}.svc.cluster.local:8000"
          namespace: Test
          network: tcp
          timeout: 3000
        - callee: trpc.adp.model_token_count.Tokenizer
          target: "ip://adp-llm.{{ .Release.Namespace }}.svc.cluster.local:8000"
          namespace: Test
          timeout: 3000
        - name: trpc.http.cos.Access
          namespace: Production
          network: tcp
          protocol: http
          target: {{ if eq .Values.global.components.s3.providerType "minio" }}{{ printf "ip://minio.%s.svc.cluster.local:80" .Release.Namespace }}{{- else if eq .Values.global.components.s3.providerType "obs" }}ip://{{ .Values.global.components.s3.obs.host }}:{{ .Values.global.components.s3.obs.port }}{{- else }}dns://cos-internal.{{ .Values.global.components.s3.cos.region }}.tencentcos.cn{{- end }}
          timeout: 50000
        - name: ximalaya.api
          protocol: http
          network: tcp
          timeout: 5000
          target: "dns://api.ximalaya.com"
          filter:
            - remove_trpc_headers
        - name: trpc.aimedia.adapter.Adapter
          namespace: Development
          network: tcp
          protocol: http
          target: ''
          timeout: 1800000
        - callee: trpc.KEP.bot_knowledge_config_server.Api
          target: "ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092"
