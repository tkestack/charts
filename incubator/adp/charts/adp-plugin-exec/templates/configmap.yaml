                description: "模型版本。可选项包括：v1.6, v2.0, v2.1, v2.5, v2.6。默认为v1.6。"
              - name: "NegativePrompt"
                type: "string"
                required: false
                description: "负向文本提示词，一般不超过2500个字符。"
              - name: "Duration"
                type: "string"
                required: false
                description: "生成视频时长，单位s。可选项包括：5，10。默认为5。"
              - name: "CfgScale"
                type: "number"
                required: false
                description: "生成视频的自由度，值越大，模型自由度越小，与用户输入的提示词相关性越强。取值范围[0,1]，默认为0.5。"
          - name: "QueryKlingImageToVideoJob"
            handler_name: "QueryKlingImageToVideoJob"
            description: "查询视频生成任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
