              - name: "ImageBase64"
                type: "string"
                required: false
                description: "图片经过Base64编码的内容。最大不超过4M。与ImageUrl同时存在时优先使用ImageUrl字段。图片格式支持PNG、JPG、JPEG。"
      - name: "medical_report_structuring"
        headers: ["SECRET_ID","SECRET_KEY", "REGION"]
