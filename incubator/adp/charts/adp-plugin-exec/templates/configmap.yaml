              - name: "ImageBase64"
                required: false
                type: "string"
                description: "图片的Base64值。PNG、JPG、JPEG，暂不支持 GIF 格式。支持的图片大小：所下载图片经Base64编码后不超过7M。图片下载时间不超过3秒。图片的ImageUrl、ImageBase64必须提供一个，如果都提供，只使用ImageUrl。"          
      - name: "license_plate"
        headers: ["SECRET_ID","SECRET_KEY", "REGION"]
        tools:
          - name: "LicensePlateOCR"
            handler_name: "LicensePlateOCR"
