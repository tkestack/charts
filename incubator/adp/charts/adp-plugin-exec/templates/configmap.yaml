            properties:
              - name: "model"
                type: "string"
                required: true
                description: "您需要调用的模型的ID（Model ID）。"
              - name: "content"
                type: "array"
                required: true
                description: "输入给模型，生成视频的信息，支持文本信息和图片信息。"
                items:
                  type: "object"
                  properties:
                    - name: "type"
                      type: "string"
                      required: false
                      description: "输入内容的类型。text：输入给模型的文本内容，描述期望生成的视频，image_url：输入给模型的图片对象。"
                    - name: "text"
                      type: "string"
                      required: false
                      description: "输入给模型的文本内容，描述期望生成的视频。如果type=text，则此字段必填。"
                    - name: "image_url"
                      type: "string"
                      required: false
                      description: "输入给模型的图片对象。如果type=image_url，则此字段必填，可以是图片URL或图片 Base64 编码。"
                    - name: "role"
                      type: "string"
                      required: false
                      description: "图片的位置或用途。"
