          network: tcp
          timeout: 60000
        - callee: trpc.adp.agent_config.v2.Mcp
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:9002"
          namespace: ${NAMESPACE}
          network: tcp
          protocol: trpc
          timeout: 10000
        - callee: trpc.adp.skill_config.Mcp
