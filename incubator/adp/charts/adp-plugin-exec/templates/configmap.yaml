  stateless_mcp_server_1.yaml: |
    servers:
      - name: adp_mcp
        headers:
        - APP_KEY
        - VISITOR_BIZ_ID
        tools:
          - name: Check
            mcp_tool_handler: AppAsMcpCheck
            description: 校验APP_KEY合法性
          - name: Chat
            mcp_tool_handler: AppAsMcpChat
            description: 与APP进行对话
            properties:
              - name: Query
                type: string
                required: true
                description: 用户输入Query
      - name: extract_doc_multi_ocr
        official_charge: true
        tools:
          - name: ExtractDocMulti
            handler_name: ExtractDocMulti
            description: 支持识别并提取场景复杂、版式多等结构化场景的字段信息。
            properties:
              - name: ImageUrl
                type: string
                required: false
                description: "图片的 Url 地址。支持的图片格式：PNG、JPG、JPEG，WORD，EXCEL，暂不支持 GIF 格式。支持的图片大小：所下载图片经 Base64 编码后不超过 10M。图片下载时间不超过 3 秒。"
              - name: ImageBase64
                type: string
                required: false
                description: "图片的 Base64 值。支持的图片格式：PNG、JPG、JPEG，WORD，EXCEL，暂不支持 GIF 格式。支持的图片大小：所下载图片经Base64编码后不超过 10M。。图片的 ImageUrl、ImageBase64 必须提供一个，如果都提供，只使用 ImageUrl。"
              - name: ConfigId
                type: string
                required: false
                description: 配置id支持
              - name: ItemNamesShowMode
                type: boolean
                required: false
                description: "true:仅输出自定义字段,false:输出默认字段+自定义字段,默认true"
              - name: EnableCoord
                type: boolean
                required: false
                description: 是否开启全文字段坐标值的识别
              - name: ReturnFullText
                type: boolean
                required: false
                description: 是否开启全文字段识别
              - name: ItemNames
                type: array
                required: false
                description: "自定义结构化功能需返回的字段名称，例：若客户想新增返回姓名、性别两个字段的识别结果，则输入ItemNames=[\"姓名\"，\"性别\"]"
                items:
                  type: string
      - name: pdf_to_office
        headers: []
        tools:
          - name: PDFToWord
            handler_name: PDFToWord
            description: "支持 pdf 转换为 word 文件，并尽可能保留原文件格式。"
            properties:
              - name: file_url
                required: true
                type: string
                description: "pdf 文件的 URL 地址。"
              - name: password
                required: false
                type: string
                description: "pdf 文件的密码。"
              - name: page_num
                required: false
                type: integer
                description: 需要转换的页数。
          - name: QueryPDFToWord
            handler_name: QueryPDFToWord
            description: "查询 pdf 转换为 word 结果。需要根据 PDFToWord 接口返回的 task_id 调用此接口查询转换结果。"
            properties:
              - name: task_id
                required: true
                type: string
                description: 任务ID。
          - name: PDFToExcel
            handler_name: PDFToExcel
            description: "支持 pdf 转换为 excel 文件，并尽可能保留原文件格式。"
            properties:
              - name: file_url
                required: true
                type: string
                description: "pdf 文件的 URL 地址。"
              - name: password
                required: false
                type: string
                description: "pdf 文件的密码。"
              - name: page_num
                required: false
                type: integer
                description: 需要转换的页数。
          - name: QueryPDFToExcel
            handler_name: QueryPDFToExcel
            description: "查询 pdf 转换为 excel 结果。需要根据 PDFToExcel 接口返回的 task_id 调用此接口查询转换结果。"
            properties:
              - name: task_id
                required: true
                type: string
                description: 任务ID。
      - name: office_to_pdf
        headers: []
        tools:
          - name: WordToPDF
            handler_name: WordToPDF
            description: "支持 word 转换为 pdf 文件，并尽可能保留原文件格式。"
            properties:
              - name: file_url
                required: true
                type: string
                description: "word 文件的 URL 地址。"
          - name: QueryWordToPDF
            handler_name: QueryWordToPDF
            description: "查询 word 转换为 pdf 结果。需要根据 WordToPDF 接口返回的 task_id 调用此接口查询转换结果。"
            properties:
              - name: task_id
                required: true
                type: string
                description: 任务ID。
          - name: ExcelToPDF
            handler_name: ExcelToPDF
            description: "支持 excel 转换为 pdf 文件，并尽可能保留原文件格式。"
            properties:
              - name: file_url
                required: true
                type: string
                description: "excel 文件的 URL 地址。"
          - name: QueryExcelToPDF
            handler_name: QueryExcelToPDF
            description: "查询 excel 转换为 pdf 结果。需要根据 ExcelToPDF 接口返回的 task_id 调用此接口查询转换结果。"
            properties:
              - name: task_id
                required: true
                type: string
                description: 任务ID。
      - name: image_to_office
        headers: []
        tools:
          - name: ImageToWord
            handler_name: ImageToWord
            description: "支持图片转换为 word 文件，并尽可能保留原文件格式。"
            properties:
              - name: file_urls
                required: true
                type: array
                description: "图片的 URL 地址。仅支持 JPG、PNG、BMP 格式的图片。"
                items:
                  type: string
          - name: ImageToExcel
            handler_name: ImageToExcel
            description: "支持图片转换为 excel 文件，并尽可能保留原文件格式。"
            properties:
              - name: file_urls
                required: true
                type: array
                description: "图片的 URL 地址。仅支持 JPG、PNG、BMP 格式的图片。"
                items:
                  type: string
      - name: translation
        headers: []
        tools:
          - name: PDFTranslation
            handler_name: PDFTranslation
            description: "pdf 文件翻译，支持多种语言。"
            properties:
              - name: url
                required: true
                type: string
                description: "pdf 文件的 URL 地址。"
              - name: target_lang
                required: true
                type: string
                description: "目标语言。支持简体中文：zh;  繁体中文：zh-TR，粤语：yue，英语：en，法语：fr，葡萄牙语：pt，西班牙语：es，日语：ja，土耳其语：tr，俄语：ru，阿拉伯语：ar，韩语：ko，泰语：th，意大利语：it，德语：de，越南语：vi，马来语：ms，印尼语：id"
              - name: source_lang
                required: false
                type: string
                description: "源语言。默认不传，工具将自动识别。若需传入，支持简体中文：zh;  繁体中文：zh-TR，粤语：yue，英语：en，法语：fr，葡萄牙语：pt，西班牙语：es，日语：ja，土耳其语：tr，俄语：ru，阿拉伯语：ar，韩语：ko，泰语：th，意大利语：it，德语：de，越南语：vi，马来语：ms，印尼语：id"
          - name: QueryPDFTranslation
            handler_name: QueryPDFTranslation
            description: "查询 pdf 翻译结果。需要根据 PDFTranslation 接口返回的 task_id 调用此接口查询翻译结果。"
            properties:
              - name: task_id
                required: true
                type: string
                description: 任务ID。
          - name: WordTranslation
            handler_name: WordTranslation
            description: "word 文件翻译，支持多种语言。"
            properties:
              - name: url
                required: true
