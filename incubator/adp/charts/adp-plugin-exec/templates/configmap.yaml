              - name: "ImageUrl"
                type: "string"
                required: false
                description: "传入图片URL地址，图片要求：图片格式：jpg、jpeg、png、bmp、webp，图片分辨率：192～4096，图片宽高比：图片【宽：高】在1:2到2:1范围内，"
              - name: "ImageBase64"
                type: "string"
                required: false
                description: "传入图片Base64编码，编码后请求体大小不超过10M，图片Base64编码与URL地址必传其一，如果都传以ImageBase64为准。"
          - name: "DescribePortraitSingJob"
            handler_name: "DescribePortraitSingJob"
            description: "查询图片唱演任务"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID。示例值：1350360280588853248"
      - name: "hunyuan_3d"
        official_charge: true
        tools:
          - name: "SubmitHunyuanTo3DJob"
            handler_name: "SubmitHunyuanTo3DJob"
            description: "提交混元生3D任务，基于混元大模型，根据输入的文本描述/图片智能生成3D。"
            properties:
              - name: "Prompt"
                type: "string"
                required: false
                description: "文生3D，3D内容的描述，中文正向提示词。最多支持1024个 utf-8 字符。"
              - name: "ImageBase64"
                type: "string"
                required: false
                description: "输入图 Base64 数据。格式：jpg，png，jpeg，webp。ImageBase64、ImageUrl和 Prompt必填其一，且Prompt和ImageBase64/ImageUrl不能同时存在。"
              - name: "ImageUrl"
                type: "string"
                required: false
                description: "输入图Url。格式：jpg，png，jpeg，webp。ImageBase64/ImageUrl和 Prompt必填其一，且Prompt和ImageBase64/ImageUrl不能同时存在。"
              - name: "ResultFormat"
                type: "string"
                required: false
                description: "生成模型的格式，仅限制生成一种格式。生成模型文件组默认返回obj格式。可选值：OBJ，GLB，STL，USDZ，FBX，MP4。"
          - name: "QueryHunyuanTo3DJob"
            handler_name: "QueryHunyuanTo3DJob"
            description: "查询混元生3D任务，输出文件和预览图片url。"
            properties:
              - name: "JobId"
                type: "string"
                required: false
                description: "任务ID。"
          - name: "SubmitHunyuanTo3DProJob"
            handler_name: "SubmitHunyuanTo3DProJob"
            description: "提交混元生3D专业版任务，基于混元大模型，根据输入的文本描述/图片智能生成3D。默认提供3个并发，代表最多能同时处理3个已提交的任务。"
            properties:
              - name: "Prompt"
                type: "string"
                required: false
                description: "文生3D，3D内容的描述，中文正向提示词。最多支持1024个 utf-8 字符。ImageBase64、ImageUrl和 Prompt必填其一，且Prompt和ImageBase64/ImageUrl不能同时存在。"
              - name: "ImageBase64"
                type: "string"
                required: false
                description: "输入图 Base64 数据。单边分辨率要求不小于128，不大于5000，大小不超过8m。格式：jpg，png，jpeg，webp。ImageBase64、ImageUrl和 Prompt必填其一，且Prompt和ImageBase64/ImageUrl不能同时存在。"
              - name: "ImageUrl"
                type: "string"
                required: false
                description: "输入图Url。单边分辨率要求不小于128，不大于5000，大小不超过8m。格式：jpg，png，jpeg，webp。ImageBase64、ImageUrl和 Prompt必填其一，且Prompt和ImageBase64/ImageUrl不能同时存在。"
              - name: "MultiViewImages"
                type: "array"
                required: false
                description: "多视角的模型图片数组，数组元素为ViewImage对象。每个ViewImage对象包含：ViewType（视角类型，取值：back/left/right）、ViewImageUrl（图片Url地址）、ViewImageBase64（图片base64数据）。每个视角仅限一张图片，图片大小不超过8M，分辨率小于5000且大于128，支持jpg或png格式。"
                items:
                  type: "object"
                  properties:
                    - name: "ViewType"
                      type: "string"
                      required: false
                      description: "视角类型，取值：back（后视图）、left（左视图）、right（右视图）。"
                    - name: "ViewImageUrl"
                      type: "string"
                      required: false
                      description: "图片Url地址。"
                    - name: "ViewImageBase64"
                      type: "string"
                      required: false
                      description: "图片base64数据。"
              - name: "EnablePBR"
                type: "boolean"
                required: false
                description: "是否开启 PBR材质生成，默认 false。"
              - name: "FaceCount"
                type: "integer"
                required: false
                description: "生成3D模型的面数，默认值为500000。可支持生成面数范围：40000-1500000。"
              - name: "GenerateType"
                type: "string"
                required: false
                description: "生成任务类型，默认Normal。可选值：Normal（生成带纹理的几何模型）、LowPoly（生成智能减面后的模型）、Geometry（生成不带纹理的几何模型/白模，此时EnablePBR不生效）、Sketch（输入草图或线稿图生成模型，此模式下prompt和ImageUrl/ImageBase64可一起输入）。"
              - name: "PolygonType"
                type: "string"
                required: false
                description: "多边形类型，仅在GenerateType选择LowPoly模式时生效。表示模型的表面由几边形网格构成，默认为triangle。可选值：triangle（三角形面）、quadrilateral（四边形面与三角形面混合生成）。"
          - name: "QueryHunyuanTo3DProJob"
            handler_name: "QueryHunyuanTo3DProJob"
            description: "查询混元生3D专业版任务状态，获取生成的3D文件数组和任务执行状态。返回结果包含：Status（任务状态：WAIT等待中/RUN执行中/FAIL任务失败/DONE任务成功）、ResultFile3Ds（3D文件数组，每个文件包含Type文件格式、Url文件地址、PreviewImageUrl预览图地址）。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID，由SubmitHunyuanTo3DProJob接口返回，有效期24小时。"
      - name: "english_essay_correction"
