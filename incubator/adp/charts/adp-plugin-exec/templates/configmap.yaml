  mcp_server_1.yaml: |
    servers:
      - name: image_creation
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: ReplaceBackground
            handler_name: ReplaceBackground
            description: 商品背景生成
            properties:
              - name: ProductUrl
                type: string
                required: true
                description: "商品原图 Url。图片限制：单边分辨率小于4000，长宽比在2:5 ~ 5:2之间，转成 Base64 字符串后小于 6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: Prompt
                type: string
                required: true
                description: "对新背景的文本描述。最多支持256个 utf-8 字符，支持中、英文"
              - name: Product
                type: string
                required: true
                description: "商品图中的商品主体名称。最多支持50个 utf-8 字符，支持中、英文"
      - name: image_recognition
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: DetectLabelPro
            handler_name: DetectLabelPro
            description: 通用图像标签
            properties:
              - name: ImageUrl
                type: string
                required: false
                description: 图片URL地址。图片限制：图片格式：PNG、JPG、JPEG、BMP。图片大小：所下载图片经Base64编码后不超过4M。图片下载时间不超过3秒，推荐将图片存储在腾讯云COS
              - name: ImageBase64
                type: string
                required: false
                description: 图片Base64编码数据。与ImageUrl同时存在时优先使用ImageUrl字段，图片限制：图片格式：PNG、JPG、JPEG、BMP。图片大小：经Base64编码后不超过4M。注意：图片需要Base64编码，并且要去掉编码头部
      - name: english_correction
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: CorrectMultiImage
            handler_name: CorrectMultiImage
            description: 多图像识别批改
            properties:
              - name: Image
                type: array
                required: true
                description: 图片的url链接或base64数据。每张图片数据作为数组的一个元素，数组个数与图片个数保持一致。存放类别依据InputType而定，url与base64编码不能混合使用
                items:
                  type: string
              - name: InputType
                type: integer
                required: true
                description: 图片类型，0表示Image字段是图片所在的url，1表示Image字段是base64编码后的图像数据
      - name: medical_report
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: TurnPdfToObject
            handler_name: TurnPdfToObject
            description: 体检报告PDF文件结构化
            properties:
              - name: PdfBase64
                type: string
                required: false
                description: "体检报告PDF文件信息, 支持传PDF文件的Base64编码字符"
              - name: PdfUrl
                type: string
                required: false
                description: 体检报告PDF的url，如果与PdfBase64同时填写以PdfBase64为准
      - name: math_correction
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: Evaluation
            handler_name: Evaluation
            description: 速算题目批改
            properties:
              - name: ImageBase64
                type: string
                description: 图片数据，需要使用base64对图片的二进制数据进行编码，与url参数二者填一即可，如果同时填写以base64为准
              - name: ImageUrl
                type: string
                description: "图片的url，与ImageBase64参数二者填一即可 如果同时填写以base64为准"
      - name: sgweb_search
        tools:
          - name: SougouWebSearch
            handler_name: SougouWebSearch
            description: 搜狗搜索工具，支持对全网范围进行网页搜索。
            properties:
              - name: Query
                required: true
                type: string
                description: "检索内容，建议长为128字节（约40～64个中英文字符）； 1.超过128字节的query，只会用前128字节进行搜索"
              - name: Insite
                required: false
                type: string
                description: "指定网址搜索，仅支持单域名筛选，例如:zhihu.com"
      - name: general_ocr
        headers:
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: GeneralAccurateOCR
            handler_name: GeneralAccurateOCR
            description: 通用印刷体识别（高精度版）
            properties:
              - name: ImageUrl
                required: false
                type: string
                description: "图片的Url地址。要求图片经Base64编码后不超过7M，分辨率建议600*800以上，支持PNG、JPG、JPEG、BMP格式。载时间不超过3秒"
              - name: ImageBase64
                required: false
                type: string
                description: "图片的Base64值。要求图片经Base64编码后不超过7M，分辨率建议600*800以上，支持PNG、JPG、JPEG、BMP格式。如果有ImageUrl，使用ImageUrl"
              - name: IsPdf
                required: false
                type: boolean
                description: 是否开启PDF识别，默认值为false，开启后可同时支持图片和PDF的识别
              - name: PdfPageNumber
                required: false
                type: integer
                description: "需要识别的PDF页面的对应页码，仅支持PDF单页识别,默认值1"
              - name: IsWords
                required: false
                type: boolean
                description: 是否返回单字信息，默认值为false，注：仅ConfigID配置为OCR时支持。
              - name: EnableDetectText
                type: boolean
                required: false
                description: 文本检测开关，默认为true。设置为false可直接进行单行识别，适用于仅包含正向单行文本的图片场景，提升识别速度。
              - name: ConfigID
                type: string
                required: false
                description: "配置ID支持：OCR -- 通用场景，MulOCR -- 多语种场景。"
      - name: question_ocr
        headers:
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: QuestionOCR
            handler_name: QuestionOCR
            description: 试题识别
            properties:
              - name: ImageUrl
                required: false
                type: string
                description: "图片的Url地址。所下载图片经Base64编码后不超过10M，分辨率建议600*800以上，支持PNG、JPG、JPEG、BMP格式。载时间不超过3秒"
              - name: ImageBase64
                required: false
                type: string
                description: "图片的Base64值。所下载图片经Base64编码后不超过10M，分辨率建议600*800以上，支持PNG、JPG、JPEG、BMP格式。如果有ImageUrl，使用ImageUrl"
              - name: IsPdf
                required: false
                type: boolean
                description: 是否开启PDF识别，默认值为false，开启后可同时支持图片和PDF的识别
              - name: PdfPageNumber
                required: false
                type: integer
                description: "需要识别的PDF页面的对应页码，仅支持PDF单页识别,默认值1"
      - name: send_sms
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: SendSms
            handler_name: SendSms
            description: 短信
            properties:
              - name: PhoneNumberSet
                required: true
                type: array
                description: "下发手机号码，采用 E.164 标准，格式为+[国家或地区码][手机号]，单次请求最多支持200个手机号且要求全为境内手机号或全为境外手机号。发送国内短信格式还支持0086、86或无任何国家或地区码的11位手机号码，前缀默认为+86。"
                items:
                  type: string
              - name: SmsSdkAppId
                required: true
                type: string
                description: "短信SdkAppId在[短信控制台](https://console.cloud.tencent.com/smsv2/app-manage)  添加应用后生成的实际SdkAppId，示例如1400006666。"
              - name: TemplateId
                required: true
                type: string
                description: "模板 ID，必须填写已审核通过的模板 ID。模板 ID 可前往 国内短信 或 国际/港澳台短信 的正文模板管理查看，若向境外手机号发送短信，仅支持使用国际/港澳台短信模板。"
              - name: SignName
                required: false
                type: string
                description: "短信签名内容，签名信息可前往 [国内短信](https://console.cloud.tencent.com/smsv2/csms-sign) 或 [国际/港澳台短信] 的签名管理查看。注：国内短信为必须，国际/港澳台短信为选填。"
              - name: TemplateParamSet
                required: false
                type: array
                description: "模板参数，若无模板参数，则设置为空。模板参数的个数需要与 TemplateId 对应模板的变量个数保持一致。"
                items:
                  type: string
              - name: SenderId
                required: false
                type: string
                description: "国内短信无需填写该项；国际/港澳台短信已申请独立 SenderId 需要填写该字段，默认使用公共 SenderId，无需填写该字段。"
      - name: send_email
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: SendEmail
            handler_name: SendEmail
            description: 发送邮件
            properties:
              - name: FromEmailAddress
                required: true
                type: string
                description: "发件人邮箱地址。例如：noreply@mail.qcloud.com，具体请查看 https://console.cloud.tencent.com/ses/address"
              - name: Destination
                required: false
                type: array
                description: 收信人邮箱地址，最多支持群发50人。示例值：destination@mail.qcloud.com
                items:
                  type: string
              - name: Subject
                required: true
                type: string
                description: 邮件主题。示例值：YourTestSubject
              - name: TemplateID
                required: true
                type: integer
                description: 模板ID。如果没有模板，请先新建一个
              - name: TemplateData
                required: true
                type: string
                description: 模板中的变量参数，该对象是一组键值对
      - name: image_moderation
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: ImageModeration
            handler_name: ImageModeration
            description: 图片内容安全
            properties:
              - name: FileUrl
                required: true
                type: string
                description: 图片内容链接
              - name: BizType
                required: false
                type: string
                description: 该字段表示特定审核策略的编号，用于接口调度。需要提前在内容安全控制台中创建策略后获取该Biztype字段，传入该字段，会根据业务场景在审核时调用相应的审核策略
      - name: text_moderation
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: TextModeration
            handler_name: TextModeration
            description: 文本内容安全
            properties:
              - name: Content
                required: true
                type: string
                description: "文本内容 base64加密"
              - name: BizType
                required: false
                type: string
                description: 该字段表示特定审核策略的编号，用于接口调度。需要提前在内容安全控制台中创建策略后获取该Biztype字段，传入该字段，会根据业务场景在审核时调用相应的审核策略
      - name: doc_parse
        tools:
          - name: DocParse
            handler_name: DocParse
            description: 将文档解析为markdown格式
            properties:
              - name: DocUrl
                required: true
                type: string
                description: 文件的Url地址
      - name: weather
        tools:
          - name: GetWeatherInfo
            handler_name: GetWeatherInfo
            description: 获取指定日期和地点的天气信息，只支持查询中国国内城市的天气
            properties:
              - name: Location
                required: true
                type: string
                description: 地点，可以包含省、市、区县等
              - name: StartTime
                required: false
                type: string
                description: 查询开始时间，格式为2006-01-02
              - name: EndTime
                required: false
                type: string
                description: 查询结束时间，格式为2006-01-02
      - name: table_ocr
        headers:
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: RecognizeTableAccurateOCR
            handler_name: RecognizeTableAccurateOCR
            description: 表格识别（V3）
            properties:
              - name: ImageUrl
                required: false
                type: string
                description: "图片/PDF的Url地址。要求图片/PDF经Base64编码后不超过7M，分辨率建议600*800以上，支持PNG、JPG、JPEG、BMP、PDF格式。图片支持的像素范围：需介于20-10000px之间。"
              - name: ImageBase64
                required: false
                type: string
                description: "图片/PDF的Base64值。要求图片/PDF经Base64编码后不超过7M，分辨率建议600*800以上，支持PNG、JPG、JPEG、BMP、PDF格式。图片支持的像素范围：需介于20-10000px之间。如果提供了ImageUrl以ImageUrl为主"
      - name: formula_ocr
        headers:
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: RecognizeFormulaOCR
            handler_name: RecognizeFormulaOCR
            description: 公式识别
            properties:
              - name: ImageUrl
                required: false
                type: string
                description: "图片的Url地址。支持格式：PNG、JPG、JPEG，不支持GIF格式。所下载图片经 Base64 编码后不超过10M。图片下载时间不超过3秒。支持的图片像素：需介于20-10000px之间。"
              - name: ImageBase64
                required: false
                type: string
                description: "图片的Base64值。支持格式：PNG、JPG、JPEG，不支持GIF格式。所下载图片经Base64编码后不超过10M。图片下载时间不超过3秒。支持的图片像素：需介于20-10000px之间。如果都提供，只使用 ImageUrl"
      - name: qrcode_ocr
        headers:
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: QrcodeOCR
            handler_name: QrcodeOCR
            description: 二维码和条形码识别
            properties:
              - name: ImageUrl
                required: false
                type: string
                description: "图片的 Url 地址。要求图片经Base64编码后不超过 7M，支持PNG、JPG、JPEG格式。"
              - name: ImageBase64
                required: false
                type: string
                description: 图片的Base64值。要求图片经Base64编码后不超过7M，支持PNG、JPG、JPEG格式。图片的ImageUrl、ImageBase64必须提供一个，如果都提供，只使用ImageUrl。
      - name: smart_ocr_pro
        headers:
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: SmartStructuralPro
            handler_name: SmartStructuralPro
            description: 智能结构化高级版识别
            properties:
              - name: ImageUrl
                required: false
                type: string
                description: 图片的Url地址。支持格式：PNG、JPG、JPEG，WORD，EXCEL，不支持GIF格式。大小：下载后经Base64编码后不超过7M。图片下载时间不超过3秒。像素：需介于20-10000px之间。
              - name: ImageBase64
                required: false
                type: string
                description: 格式：PNG、JPG、JPEG，WORD，EXCEL，不支持GIF格式。大小：所下载图片经Base64编码后不超过7M。下载时间不超过3秒。像素：需介于20-10000px之间。如果都提供，只使用ImageUrl。
      - name: tx_meeting
        headers:
        - SECRET_ID
        - SECRET_KEY
        - APP_ID
        - SDK_ID
        tools:
          - name: GetMeetingRecordList
            handler_name: GetMeetingRecordList
            description: 查询腾讯会议会议录制列表
            properties:
              - name: UserId
                type: string
                description: 用户ID
                required: true
              - name: MeetingCode
                type: string
                description: 会议code
                required: false
              - name: StartTime
                type: string
                description: "查询起始时间戳，UNIX 时间戳（单位秒），时间区间不允许超过31天"
                required: true
              - name: EndTime
                type: string
                description: "查询结束时间戳，UNIX 时间戳（单位秒），时间区间不允许超过31天"
                required: true
          - name: GetRecordDetail
            handler_name: GetRecordDetail
            description: 查询腾讯会议单个会议的录制详情，录制详情包括文件、转写、纪要
            properties:
              - name: UserId
                type: string
                description: 用户ID
                required: true
              - name: RecordFileId
                type: string
                description: "录制文件 ID，列表接口返回的 record_file_id"
                required: true
      - name: image_outpainting
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: ImageOutpainting
            handler_name: ImageOutpainting
            description: 支持对输入图像按指定宽高比实现智能扩图。
            properties:
              - name: Ratio
                required: true
                type: string
                description: "扩展后的比例（宽:高），需要不等于原图比例。支持：1:1、4:3、3:4、16:9、9:16"
              - name: InputImage
                required: false
                type: string
                description: "输入图Base64数据。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: InputUrl
                required: false
                type: string
                description: "输入图Url。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
      - name: sketch_to_image
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: SketchToImage
            handler_name: SketchToImage
            description: "支持上传一张黑白线稿图，按照指定的主体对象以及样式、颜色、材质、风格等的文本描述prompt ，对线稿图进行色彩填充与细节描绘，得到一张完整绘制的图像。"
            properties:
              - name: Prompt
                required: true
                type: string
                description: 用于线稿生图的文本描述。最多支持200个utf-8字符。建议格式：线稿中的主体对象+画面场景+配色/材质/元素/风格等
              - name: InputImage
                required: false
                type: string
                description: "线稿图Base64数据。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：黑白线稿图片，单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: InputUrl
                required: false
                type: string
                description: "线稿图Url。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：黑白线稿图片，单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
      - name: refine_image
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: RefineImage
            handler_name: RefineImage
            description: 将图像变清晰，增强图像细节。变清晰后的图片将保持原图比例，长边为2048。
            properties:
              - name: InputImage
                required: false
                type: string
                description: "输入图Base64数据。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: InputUrl
                required: false
                type: string
                description: "输入图Url。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
      - name: tmt_text_translate
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: TextTranslate
            handler_name: TextTranslate
            description: 文本翻译
            properties:
              - name: SourceText
                required: true
                type: string
                description: 待翻译的文本，文本统一使用utf-8格式编码，非utf-8格式编码字符会翻译失败，请传入有效文本，html标记等非常规翻译文本可能会翻译失败。单次请求的文本长度需要低于6000字符。
              - name: Source
                required: true
                type: string
                description: "源语言。支持情况详见：https://cloud.tencent.com/document/api/551/15619"
              - name: Target
                required: true
                type: string
                description: "目标语言。 各源语言的目标语言支持列表情况详见 https://cloud.tencent.com/document/api/551/15619"
      - name: tmt_lang_detect
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: LanguageDetect
            handler_name: LanguageDetect
            description: 语种识别
            properties:
              - name: Text
                required: true
                type: string
                description: 待识别的文本，文本统一使用utf-8格式编码，非utf-8格式编码字符会翻译失败。单次请求的文本长度需要低于2000。
      - name: detect_product
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: DetectProduct
            handler_name: DetectProduct
            description: 支持识别图片中包含的商品，能够输出商品的品类名称、类别。支持一张图片多个商品的识别。
            properties:
              - name: ImageBase64
                required: false
                type: string
                description: 图片经过base64编码的内容。最大不超过4M。与ImageUrl同时存在时优先使用ImageUrl字段。注意：图片需要base64编码，并且要去掉编码头部
              - name: ImageUrl
                required: false
                type: string
                description: "图片URL地址。图片限制：•图片格式：PNG、JPG、JPEG。•图片大小：所下载图片经Base64编码后不超过4M。图片下载时间不超过3秒。建议：•图片像素：大于50*50像素，否则影响识别效果"
      - name: crop_image
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: CropImage
            handler_name: CropImage
            description: 根据输入的裁剪比例，智能判断一张图片的最佳裁剪区域。
            properties:
              - name: Width
                required: true
                type: integer
                description: 需要裁剪区域的宽度，与Height共同组成所需裁剪的图片宽高比例。输入数字请大于0、小于图片宽度的像素值
              - name: Height
                required: true
                type: integer
                description: "需要裁剪区域的高度，与Width共同组成所需裁剪的图片宽高比例。输入数字请大于0、小于图片高度的像素值。宽高比例会简化为最简分数，即如果Width输入10、Height输入20，会简化为1：2。宽高比例建议取值在[1, 2.5]之间，超过这个范围可能会影响效果"
              - name: ImageUrl
                required: false
                type: string
                description: "图片URL地址。图片限制：•图片格式：PNG、JPG、JPEG。•图片大小：所下载图片经Base64编码后不超过4M。图片下载时间不超过3秒。建议：•图片像素：大于50*50像素，否则影响识别效果"
              - name: ImageBase64
                required: false
                type: string
                description: 图片经过base64编码的内容。最大不超过4M。与ImageUrl同时存在时优先使用ImageUrl字段。注意：图片需要base64编码，并且要去掉编码头部
      - name: text_english_correct
        headers:
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: TextEnglishCorrect
            handler_name: TextEnglishCorrect
            description: 覆盖英语学习全周期，提供高考价值、高人评拟合度的纯文本英文作文批改
            properties:
              - name: Content
                required: true
                type: string
                description: 作文文本
      - name: change_clothes
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: ChangeClothes
            handler_name: ChangeClothes
            description: 上传正面全身模特照和服装平铺图，生成模特换装后的图片。生成的换装图片分辨率和模特照分辨率一致。
            properties:
              - name: ModelUrl
                required: true
                type: string
                description: "模特图片Url。图片限制：单边分辨率小于3000，且大于512，转成Base64字符串后小于8MB，具体要求可查看文档https://cloud.tencent.com/document/api/1668/108532"
              - name: ClothesUrl
                required: true
                type: string
                description: "服装图片Url。图片限制：单边分辨率小于3000，且大于512，转成Base64字符串后小于8MB，具体要求可查看文档https://cloud.tencent.com/document/api/1668/108532"
              - name: ClothesType
                required: true
                type: string
                description: 服装类型，需要和服装图片保持一致。取值：Upper-body：上衣，Lower-body：下装，Dress：连衣裙
      - name: generate_avatar
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: GenerateAvatar
            handler_name: GenerateAvatar
            description: 将根据输入的人像、宠物照片，生成风格百变的头像。
            properties:
              - name: InputImage
                required: false
                type: string
                description: "输入图Base64数据。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：黑白线稿图片，单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: InputUrl
                required: false
                type: string
                description: "输入图Url。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：黑白线稿图片，单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: Type
                required: false
                type: string
                description: 图像类型，默认为人像。human：人像头像，仅支持人像图片输入，建议避免上传无人、多人、人像过小的图片。pet：萌宠贴纸，仅支持动物图片输入，建议避免上传无动物、多动物、动物过小的图片
              - name: Style
                required: false
                type: string
                description: "头像风格，仅在人像模式下生效。若使用人像模式，请在文档【https://cloud.tencent.com/document/product/1668/107741】列表中选择期望的风格，传入风格编号，不传默认使用flower风格。若使用萌宠贴纸模式，无需选择风格，该参数不生效"
      - name: image_to_image
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: ImageToImage
            handler_name: ImageToImage
            description: 提供生成式的图生图风格转化能力，将根据输入的图像及文本描述，智能生成风格转化后的图像。
            properties:
              - name: InputImage
                required: false
                type: string
                description: "输入图Base64数据。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：黑白线稿图片，单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: InputUrl
                required: false
                type: string
                description: "输入图Url。Base64和Url必须提供一个，如果都提供以Url为准。图片限制：黑白线稿图片，单边分辨率小于5000且大于128，转成Base64字符串后小于6MB，格式支持 jpg、jpeg、png、bmp、tiff、webp"
              - name: Prompt
                required: false
                type: string
                description: 文本描述。用于在输入图的基础上引导生成图效果，增加生成结果中出现描述内容的可能。推荐使用中文。最多支持256个utf-8字符
              - name: Styles
                required: false
                type: array
                description: "绘画风格，仅在人像模式下生效。请在文档【https://cloud.tencent.com/document/product/1668/86250】列表中选择期望的风格，传入风格编号，推荐使用且只使用一种风格。不传默认使用201（日系动漫风格）"
                items:
                  type: string
      - name: drug_instruction_object
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: DrugInstructionObject
            handler_name: DrugInstructionObject
            description: 药品说明书结构化
            properties:
              - name: PdfBase64
                type: string
                required: false
                description: "药品说明书信息信息, 支持传PDF文件的Base64编码字符"
              - name: PdfUrl
                type: string
                required: false
                description: 药品说明书PDF的url，如果与PdfBase64同时填写以PdfBase64为准
      - name: image_to_object
        headers:
        - REGION
        - SECRET_ID
        - SECRET_KEY
        tools:
          - name: ImageToObject
            handler_name: ImageToObject
            description: 医疗报告图片结构化
            properties:
              - name: ImageBase64
                type: string
                required: false
                description: "图片信息, 支持传图片的Base64编码字符"
              - name: ImageUrl
                type: string
                required: false
                description: 图片的url，如果与ImageBase64同时填写以ImageBase64为准
              - name: Type
                type: integer
                required: true
                description: 报告类型，目前支持11（检验报告），12（检查报告），15（病理报告），28（出院报告），29（入院报告），210（门诊病历），212（手术记录），218（诊断证明），363（心电图），27（内窥镜检查），215（处方单），219（免疫接种证明），301（C14呼气试验）。如果不清楚报告类型，可以使用分类引擎，该字段传0（同时IsUsedClassify字段必须为True，否则无法输出结果）
              - name: IsUsedClassify
                type: boolean
                required: true
                description: 是否使用分类引擎，当不确定报告类型时，可以使用收费的报告分类引擎服务。若该字段为False，则Type字段不能为0，否则无法输出结果。


  mcp_server_2.yaml: |
    servers:
      - name: "lexiang_ai_search"
        headers: ["AppSecret","AppKey", "StaffId"]
        tools:
          - name: "LexianglaKnowledge"
            handler_name: "LexianglaKnowledge"
            description: "查询腾讯乐享知识库"
            properties:
              - name: "query"
                type: "string"
                required: true
                description: "用户输入的问题，最长1024字符"
              - name: "top_n"
                type: "integer"
                required: true
                description: "指定输出rerank后排名前几的文档（1-50），建议控制在20以内"
              - name: "targets"
                type: "array"
                required: false
                description: "知识范围，可以通过传入参数限制知识来源的范围，仅支持指定单一知识范围，不传则默认为全站知识"
                items:
                  type: "object"
                  properties:
                    - name: "type"
                      type: "string"
                      required: false
                      description: "表示范围类型，可设置为space（知识库）/team（团队）/kb_entry（文档节点）"
                    - name: "id"
                      type: "string"
                      required: false
                      description: "space(知识库)对应id获取位置：指定知识库url链接中“space/xxx”，xxx为知识库id"
      - name: "english"
        headers: ["SECRET_ID","SECRET_KEY", "REGION"]
        tools:
          - name: "EnglishOCR"
            handler_name: "EnglishOCR"
            description: "支持图像英文文字的检测和识别，返回文字内容。"
            properties:
              - name: "ImageUrl"
                required: false
                type: "string"
                description: "图片的Url地址。支持图片格式：PNG、JPG、JPEG，暂不支持GIF格式。下载图片经Base64编码后不超过7M。图片下载时间不超过 3 秒。像素须介于20-10000px之间。如果都提供，只使用ImageUrl。"
              - name: "ImageBase64"
                required: false
                type: "string"
                description: "图片的Base64值。支持图片格式：PNG、JPG、JPEG，暂不支持GIF格式。下载图片经Base64编码后不超过7M。图片下载时间不超过3秒。像素须介于20-10000px之间。如果都提供，只使用ImageUrl。"
      - name: "advertise"
        headers: ["SECRET_ID","SECRET_KEY", "REGION"]
        tools:
          - name: "AdvertiseOCR"
            handler_name: "AdvertiseOCR"
