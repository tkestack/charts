                description: "画面纵横比（宽：高）。可选项包括：16:9，9:16，1:1。默认为16:9。"
          - name: "QueryKlingTextToVideoJob"
            handler_name: "QueryKlingTextToVideoJob"
            description: "查询视频生成任务。"
            properties:
              - name: "JobId"
                type: "string"
                required: true
                description: "任务ID。通过SubmitKlingTextToVideoJob接口返回获取。"
