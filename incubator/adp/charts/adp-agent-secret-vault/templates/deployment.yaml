apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    ti.cloud.tencent.com/resource-quota: unlimited
    configmap.reloader.stakater.com/reload: {{ .Release.Name }}-agent-secret-vault
    {{- if .Values.global.customAnnotations }}
    {{- range $key, $value := .Values.global.customAnnotations }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
  labels:
    app: adp-agent-secret-vault
    app.kubernetes.io/component: adp-agent-secret-vault
    {{- if .Values.global.customLabels }}
    {{- range $key, $value := .Values.global.customLabels }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
  name: adp-agent-secret-vault
  namespace: {{ .Release.Namespace }}
spec:
  {{- if eq .Values.global.clusterSize "minimal" }}
  replicas: 1
  {{- else if eq .Values.global.clusterSize "standard" }}
  replicas: 2
  {{- else }}
  replicas: 3
  {{- end }}
  selector:
    matchLabels:
      app: adp-agent-secret-vault
  strategy: {}
  template:
    metadata:
      labels:
        app: adp-agent-secret-vault
        {{- if .Values.global.customLabels }}
        {{- range $key, $value := .Values.global.customLabels }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
      {{- if .Values.global.customAnnotations }}
      annotations:
        {{- range $key, $value := .Values.global.customAnnotations }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
      {{- end }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - adp-agent-secret-vault
              topologyKey: kubernetes.io/hostname
            weight: 1
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: GPUName
                    operator: DoesNotExist
            - weight: 50
              preference:
                matchExpressions:
                  - key: product
                    operator: In
                    values:
                      - lke
      terminationGracePeriodSeconds: 30
      {{- if eq (include "needInitContainer" .) "true" }}
      serviceAccountName: adp-reader
      {{- end }}
      initContainers:
        {{- include "dependencyChecker.initContainer" . | nindent 8 }}
      containers:
        - name: adp-agent-secret-vault
          image: {{ include "resolveImageUrl" (dict "url" (index .Values.images "adp-agent-secret-vault").url "context" .) }}
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: INFRA_MIDDLEWARES_REDIS_0_HOSTS
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: INFRA_MIDDLEWARES_REDIS_0_PORT
            - name: REDIS_ADDR
              value: "$(REDIS_HOST):$(REDIS_PORT)"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: INFRA_MIDDLEWARES_REDIS_0_PASSWORD
            - name: REDIS_DB
              value: {{ .Values.secretVault.redisDb | default "0" | quote }}
            - name: REDIS_KEY_PREFIX
              value: {{ .Values.secretVault.redisKeyPrefix | default "" | quote }}
            - name: AUTH_SIGN_KEY
              value: {{ .Values.secretVault.authSignKey | default "" | quote }}
            - name: AES_KEY
              value: {{ .Values.secretVault.aesKey | default "" | quote }}
            - name: TTL_SECONDS
              value: {{ .Values.secretVault.ttlSeconds | default "7200" | quote }}
            - name: TIMESTAMP_SKEW_SECONDS
              value: {{ .Values.secretVault.timestampSkewSeconds | default "300" | quote }}
            - name: NONCE_TTL_SECONDS
              value: {{ .Values.secretVault.nonceTTLSeconds | default "300" | quote }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.secretVault.shutdownTimeout | default "10s" | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          {{- if eq .Values.global.clusterSize "minimal" }}
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "125m"
              memory: "512Mi"
          {{- else if eq .Values.global.clusterSize "standard" }}
          resources:
            limits:
              cpu: "500m"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          {{- else }}
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          {{- end }}
          volumeMounts:
            - name: logs
              mountPath: /data/log/
              subPathExpr: $(POD_NAME)
            - mountPath: /app/conf/infrastructure.yaml
              name: infrastructure
              subPath: infrastructure.yaml
      restartPolicy: Always
      volumes:
        {{- include "dependencyChecker.volumes" . | nindent 8 }}
        - hostPath:
            path: /data/ti-platform/log/adp-agent-secret-vault
            type: DirectoryOrCreate
          name: logs
        - configMap:
            defaultMode: 420
            name: infrastructure
          name: infrastructure
