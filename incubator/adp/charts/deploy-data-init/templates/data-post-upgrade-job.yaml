{{- $isUpgrade := eq (dig "is_upgrade" false .Values.global | toString) "true" }}
{{- if and .Values.enabled .Values.postUpgrade.enabled $isUpgrade }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-data-post-upgrade-job
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-data-post-upgrade-job
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- if .Values.global.customLabels }}
    {{- range $key, $value := .Values.global.customLabels }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-succeeded": continue
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- if .Values.global.customAnnotations }}
    {{- range $key, $value := .Values.global.customAnnotations }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-data-post-upgrade-job
        release: {{ .Release.Name }}
        {{- if .Values.global.customLabels }}
        {{- range $key, $value := .Values.global.customLabels }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
      annotations:
        eks.tke.cloud.tencent.com/reserve-sandbox-duration: "30m"
        eks.tke.cloud.tencent.com/reserve-succeeded-sandbox: "true"
        eks.tke.cloud.tencent.com/reserve-failed-sandbox: "true"
        {{- if .Values.global.customAnnotations }}
        {{- range $key, $value := .Values.global.customAnnotations }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-data-init-sa
      restartPolicy: Never
      {{- if .Values.postUpgrade.dependencyCheck.enabled | default true }}
      volumes:
      - name: dependency-checker-script
        configMap:
          name: dependency-checker-script
          defaultMode: 0755
      - name: helmfile-config
        configMap:
          name: helmfile-config
      initContainers:
      - name: wait-for-dependencies
        image: {{ include "resolveImageUrl" (dict "url" (index .Values.images "dependency_check").url "context" .) }}
        imagePullPolicy: IfNotPresent
        env:
          - name: RELEASE_NAME
            value: deploy-data-init-post
          - name: NAMESPACE
            value: {{ .Release.Namespace | quote }}
        command:
          - /bin/bash
          - /scripts/check-dependencies.sh
        volumeMounts:
          - name: dependency-checker-script
            mountPath: /scripts
          - name: helmfile-config
            mountPath: /helmfile
      {{- end }}
      containers:
      - name: data-post-upgrade
        image: {{ include "resolveImageUrl" (dict "url" (index .Values.images "deploy-data-init").url "context" .) }}
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command:
          - "/bin/sh"
          - "-c"
          - |
            TARGET_VERSION="{{ .Values.targetVersion }}"

            # 版本比较函数：version_lt A B 返回 0 表示 A < B
            version_lt() {
              [ "$1" = "$2" ] && return 1
              printf '%s\n%s\n' "$1" "$2" | sort -V -C 2>/dev/null
            }

            # 版本归一化（3位扩4位兼容）：三位版本补 .0 对齐四位（v3.4.1 → v3.4.1.0、v4.0.3 → v4.0.3.0），
            # 仅用于版本比较；传给 cross-up 的 --target 仍用原始 TARGET_VERSION
            normalize_version() {
              case "$1" in
                v*.*.*.*) printf '%s' "$1" ;;
                v*.*.*) printf '%s.0' "$1" ;;
                *) printf '%s' "$1" ;;
              esac
            }

            echo "=== Querying cluster data version ==="
            VERSION_OUTPUT=$(/app/bin/cross-up --config /app/conf/trpc_go.yaml version 2>&1) || VERSION_OUTPUT=""

            if [ -z "$VERSION_OUTPUT" ]; then
              echo "=== ERROR: No version data found, init/upgrade may not have completed ==="
              exit 0
            fi

            echo "$VERSION_OUTPUT"
            POST_UPGRADE_VERSION=$(echo "$VERSION_OUTPUT" | grep '(post_upgrade)' | awk '{print $NF}')
            POST_UPGRADE_VERSION=$(normalize_version "$POST_UPGRADE_VERSION")
            COMPARE_TARGET=$(normalize_version "$TARGET_VERSION")

            # 存在 post_upgrade 版本记录且低于目标版本时才执行；无记录/已达标/更高版本均跳过
            if [ -n "$POST_UPGRADE_VERSION" ] && version_lt "$POST_UPGRADE_VERSION" "$COMPARE_TARGET"; then
              echo "=== Running post-upgrade from ${POST_UPGRADE_VERSION} to ${TARGET_VERSION} ==="
              /app/bin/cross-up --config /app/conf/trpc_go.yaml post-upgrade --target ${TARGET_VERSION}
              EXIT_CODE=$?
            else
              echo "=== post_upgrade version '${POST_UPGRADE_VERSION}' not below ${TARGET_VERSION}, skipping ==="
              EXIT_CODE=0
            fi

            if [ $EXIT_CODE -ne 0 ]; then
              echo "=== FAILED with exit code $EXIT_CODE, sleeping 10min for debug ==="
              sleep 600
            fi
            exit $EXIT_CODE
        env:
          {{- include "dataInit.commonEnv" . | nindent 10 }}
        resources:
          limits:
            cpu: "2"
            memory: 2G
          requests:
            cpu: "2"
            memory: 2G
{{- end }}
