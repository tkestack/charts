{{- if .Values.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-data-init-job
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-data-init-job
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- if .Values.global.customLabels }}
    {{- range $key, $value := .Values.global.customLabels }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-succeeded": continue
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- if .Values.global.customAnnotations }}
    {{- range $key, $value := .Values.global.customAnnotations }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-data-init-job
        release: {{ .Release.Name }}
        {{- if .Values.global.customLabels }}
        {{- range $key, $value := .Values.global.customLabels }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
      annotations:
        eks.tke.cloud.tencent.com/reserve-sandbox-duration: "30m"
        eks.tke.cloud.tencent.com/reserve-succeeded-sandbox: "true"
        eks.tke.cloud.tencent.com/reserve-failed-sandbox: "true"
        {{- if .Values.global.customAnnotations }}
        {{- range $key, $value := .Values.global.customAnnotations }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-data-init-sa
      restartPolicy: Never
      containers:
      - name: data-init
        image: {{ include "resolveImageUrl" (dict "url" (index .Values.images "deploy-data-init").url "context" .) }}
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command:
          - "/bin/sh"
          - "-c"
          - |
            TARGET_VERSION="{{ .Values.targetVersion }}"

            # 升级部署（global.is_upgrade=true）执行 upgrade，否则执行 init（首次安装）
            if [ "$IS_UPGRADE" = "true" ]; then
              # 重入保护：先查询当前升级版本，若已是目标版本则直接退出，避免重复 upgrade 报错
              CURRENT_VERSION=$(/app/bin/cross-up --config /app/conf/trpc_go.yaml version --type upgrade | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
              echo "=== current upgrade version: ${CURRENT_VERSION}, target version: ${TARGET_VERSION} ==="
              if [ -n "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
                echo "=== already at target version ${TARGET_VERSION}, skip upgrade ==="
                exit 0
              fi
              echo "=== IS_UPGRADE=true, running upgrade to ${TARGET_VERSION} ==="
              /app/bin/cross-up --config /app/conf/trpc_go.yaml upgrade --target ${TARGET_VERSION}
            else
              echo "=== IS_UPGRADE=${IS_UPGRADE}, running init to ${TARGET_VERSION} ==="
              /app/bin/cross-up --config /app/conf/trpc_go.yaml init --target ${TARGET_VERSION}
            fi
            EXIT_CODE=$?

            if [ $EXIT_CODE -ne 0 ]; then
              echo "=== FAILED with exit code $EXIT_CODE, sleeping 10min for debug ==="
              sleep 600
            fi
            exit $EXIT_CODE
        env:
          {{- include "dataInit.commonEnv" . | nindent 10 }}
        resources:
          limits:
            cpu: "2"
            memory: 2G
          requests:
            cpu: "2"
            memory: 2G
{{- end }}
