{{- if and .Values.enabled .Values.init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-data-init-job
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-data-init-job
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- if .Values.global.customLabels }}
    {{- range $key, $value := .Values.global.customLabels }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-succeeded": continue
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- if .Values.global.customAnnotations }}
    {{- range $key, $value := .Values.global.customAnnotations }}
    {{ $key }}: {{ $value | toString | quote }}
    {{- end }}
    {{- end }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-data-init-job
        release: {{ .Release.Name }}
        {{- if .Values.global.customLabels }}
        {{- range $key, $value := .Values.global.customLabels }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
      annotations:
        eks.tke.cloud.tencent.com/reserve-sandbox-duration: "30m"
        eks.tke.cloud.tencent.com/reserve-succeeded-sandbox: "true"
        eks.tke.cloud.tencent.com/reserve-failed-sandbox: "true"
        {{- if .Values.global.customAnnotations }}
        {{- range $key, $value := .Values.global.customAnnotations }}
        {{ $key }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-data-init-sa
      restartPolicy: Never
      containers:
      - name: data-init
        image: {{ include "resolveImageUrl" (dict "url" (index .Values.images "deploy-data-init").url "context" .) }}
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command:
          - "/bin/sh"
          - "-c"
          - |
            TARGET_VERSION="{{ .Values.targetVersion }}"

            # 版本比较函数：version_lt A B 返回 0 表示 A < B
            version_lt() {
              [ "$1" = "$2" ] && return 1
              printf '%s\n%s\n' "$1" "$2" | sort -V -C 2>/dev/null
            }

            echo "=== Querying cluster data version ==="
            VERSION_OUTPUT=$(/app/bin/cross-up --config /app/conf/trpc_go.yaml version 2>&1) || VERSION_OUTPUT=""

            if [ -z "$VERSION_OUTPUT" ]; then
              # 无版本数据 → 首次安装
              echo "=== No version data found, running init ==="
              /app/bin/cross-up --config /app/conf/trpc_go.yaml init --target ${TARGET_VERSION}
              EXIT_CODE=$?
            else
              echo "$VERSION_OUTPUT"
              # 仅提取形如 vX.Y.Z 或 vX.Y.Z.W 的有效版本号，未设置或占位符（如 "(未设置)"）会被视为空
              # 精确匹配行，避免 "(upgrade)" 误命中 "(post_upgrade)"
              VERSION_REGEX='v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?'
              INIT_VERSION=$(echo "$VERSION_OUTPUT" | awk '/\(init\)/'    | grep -oE "$VERSION_REGEX" | head -n1)
              UPGRADE_VERSION=$(echo "$VERSION_OUTPUT" | awk '/\(upgrade\)/' | grep -oE "$VERSION_REGEX" | head -n1)

              if [ -z "$INIT_VERSION" ]; then
                # init 版本不存在 → 首次安装
                echo "=== No init version found, running init ==="
                /app/bin/cross-up --config /app/conf/trpc_go.yaml init --target ${TARGET_VERSION}
                EXIT_CODE=$?
              elif [ -z "$UPGRADE_VERSION" ] || version_lt "$UPGRADE_VERSION" "$TARGET_VERSION"; then
                # init 已执行，但 upgrade 版本不存在或 < target → 执行 upgrade
                echo "=== Upgrading (init=${INIT_VERSION}, upgrade=${UPGRADE_VERSION:-none}) to ${TARGET_VERSION} ==="
                /app/bin/cross-up --config /app/conf/trpc_go.yaml upgrade --target ${TARGET_VERSION}
                EXIT_CODE=$?
              else
                # init 已执行且 upgrade >= target → 跳过
                echo "=== Already upgraded (init=${INIT_VERSION}, upgrade=${UPGRADE_VERSION}), target=${TARGET_VERSION}, skipping ==="
                EXIT_CODE=0
              fi
            fi

            if [ $EXIT_CODE -ne 0 ]; then
              echo "=== FAILED with exit code $EXIT_CODE, sleeping 10min for debug ==="
              sleep 600
            fi
            exit $EXIT_CODE
        env:
          {{- include "dataInit.commonEnv" . | nindent 10 }}
        resources:
          limits:
            cpu: "2"
            memory: 2G
          requests:
            cpu: "2"
            memory: 2G
{{- end }}
