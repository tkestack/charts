apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-data-init-role
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-data-init-job
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # Pod 查看（list/watch/get，用于按 selector 查找目标 Pod）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # exec 进入容器（cross-up post_upgrade kubectl_exec 需要）
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # 查看日志（便于排查）
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Service 元数据补齐（adopt_legacy_services.sh 需要,
  # 用于把历史 hook 遗留 Service 过继给当前 Helm release）
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch"]

  # baseliner (Phase 3, after_success 阶段): 读取 helm release secret
  # (sh.helm.release.v1.<release>.v<N>, type: helm.sh/release.v1) 拿到当前
  # 已交付的 chart rendered manifest, 上传到 COS 作为下一次升级 3-way merge
  # 的 BASE 输入。详见 upgrade/scripts/baseliner/lib/helm_source.go.
  # 权限仅需 list/get, 不需要 write, 遵循最小权限原则。
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # 清理不再使用的 ApisixRoute CRD（升级过程 del_nonuse_ar.sh 需要）
  # 缺少此权限会导致 CRD 被 ti-ingress-controller 反复回写，路由删不掉
  - apiGroups: ["apisix.apache.org"]
    resources: ["apisixroutes"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "patch"]
