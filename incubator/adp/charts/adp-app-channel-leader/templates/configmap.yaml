kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-app-channel-leader
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    # ETCD 集群地址
    etcd_endpoints: ${ETCD_ENDPOINTS}

    # ETCD 连接超时
    etcd_dial_timeout: "5s"

    # 选举相关配置
    election:
      # leader 租约 TTL（秒）
      lease_ttl: 5
      # 选举失败重试间隔
      retry_interval: "3s"

    # Watcher 相关配置
    watcher:
      # Watch 断开后重连间隔
      reconnect_interval: "2s"

    # Rebalance 相关配置
    rebalance:
      # 新 app / migration-request 防抖时间
      debounce: "2s"
      # 无可用节点时的初始重试间隔
      no_node_retry_interval: "5s"
      # 无可用节点时的最大重试间隔（指数退避上限）
      no_node_retry_max: "60s"
      # 负载不均衡告警阈值（最大负载 / 最小负载 > 此值时告警）
      imbalance_threshold: 2.0
      # 负载不均衡告警最小差值（最大负载 - 最小负载 > 此值时告警）
      imbalance_min_diff: 50
      # 全量 Rebalance 触发时间戳（秒级 Unix 时间戳）
      # 运维想触发全量 rebalance 时，修改为当前或未来的秒级时间戳即可
      # 服务对比 ETCD 中记录的上次执行时间戳，配置值 > 上次执行值时触发
      # 设为 0 表示不触发
      full_rebalance_at: ${FULL_REBALANCE_AT}
      # 一致性哈希虚拟节点数，越大分布越均匀
      virtual_nodes: 150
      # 全量 Rebalance 检测间隔
      full_rebalance_check_interval: "5s"

    # 对账配置
    reconcile:
      # 对账巡检间隔
      interval: "30s"

    # 节点黑名单配置（Rainbow 热加载，修改后自动生效无需重启）
    blacklist:
      # 手动拉黑的节点列表（填写 nodeID，即 podIP:port 或 hostname）
      # 被拉黑的节点不参与调度，其负责的 app 会被迁移到其他节点
      nodes: ${BLACKLIST_NODES}
      # 黑名单变更检测间隔
      check_interval: "2s"
  client.yaml: |
    client:
      namespace: ${NAMESPACE}
      filter:
        - cle-route-propagator
      service:
        - name: tdsql.tcadp.channel
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local

  env.yaml: |
    version: 2.0.0 # 固定值，不需要修改
    kind: env # 固定值，不需要修改
    metadata:
        name: formal # 环境名称 [选填]

  placeholder.yaml: |
    # ============================================================
    # trpc_go.yaml 占位符
    # ============================================================

    # 命名空间
    NAMESPACE: Production

    # 环境名
    ENV_NAME: formal

    # Rainbow 环境名
    RAINBOW_ENV_NAME: formal

    # 是否启用 set
    ENABLE_SET: "N"

    # set 名
    FULL_SET_NAME: ""

    # 日志级别
    LOG_LEVEL: info

    # Polaris Leader 服务 token
    POLARIS_LEADER_TOKEN: "9c2e094500c642daba328b6067129ae4"

    # ============================================================
    # client.yaml 占位符
    # ============================================================

    CHANNEL_TDSQL_TARGET: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local

    # ============================================================
    # application.yaml 占位符
    # ============================================================

    # ETCD 集群地址（集群内部署，namespace 与本服务保持一致，通过 ClusterIP Service 访问）
    ETCD_ENDPOINTS:
      - "etcd.{{ .Release.Namespace }}.svc.cluster.local:2379"

    # 黑名单节点列表（空列表用 [] 表示，有值时用 YAML 列表格式）
    BLACKLIST_NODES: []

    FULL_REBALANCE_AT: 0
  trpc_go.yaml: |
    global:                             # 全局配置
      namespace: ${NAMESPACE}           # 环境类型，分正式 Production 和非正式 Development 两种类型
      env_name: ${ENV_NAME}             # 环境名称，非正式环境下多环境的名称
      enable_set: ${ENABLE_SET}         # 是否启用 set
      full_set_name: ${FULL_SET_NAME}   # set 名
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}

    server:                                            # 服务端配置
      app: adp                                         # 业务的应用名
      server: app-channel-leader                       # 进程服务名
      bin_path: /usr/local/trpc/bin/                   # 二进制可执行文件和框架配置文件所在路径
      conf_path: /usr/local/trpc/conf/                 # 业务配置文件所在路径
      data_path: /usr/local/trpc/data/                 # 业务数据文件所在路径
      filter:                                          # 针对所有 service 处理函数前后的拦截器列表
        - recovery                                     # 拦截框架创建的业务处理协程 panic
        - i18n-adp                                     # 在 recovery 之后引用，避免 filter 里的错误覆盖掉 i18n 错误
        - cle-route-propagator
        - opentelemetry
      admin:
        ip: ${POD_IP}
        port: 8081
      service:                                         # 业务服务提供的 service，可以有多个
        - name: trpc.adp.app-channel-leader.Admin     # service 的路由名称
          ip: ${POD_IP}                                # 服务监听 ip 地址
          port: 9300                                   # 服务监听端口
          network: tcp                                 # 网络监听类型 tcp/udp
          protocol: trpc                               # 应用层协议 trpc/restful
          timeout: 30000                               # 请求最长处理时间，单位毫秒

    client:
      namespace: ${NAMESPACE}
      filter:
        - cle-route-propagator
      service:
        - name: tdsql.tcadp.channel
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local
    plugins:                                           # 插件配置
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /usr/local/trpc/log/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      registry:                                        # 服务注册配置
        polaris:
          register_self: false
          heartbeat_interval: 3000
          heartbeat_timeout: 1000
          service:
            - name: trpc.adp.app-channel-leader.Admin
              namespace: ${NAMESPACE}
              token: ${POLARIS_LEADER_TOKEN}
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: leader
            error_prefix: error
            char_scaling_factor:
              zh-CN: 1
              en-US: 3
      selector:                                        # 针对用户自定义的 selector 的配置
        polaris:
          protocol: grpc
          enable_servicerouter: true
          enable_trans_meta: true
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
