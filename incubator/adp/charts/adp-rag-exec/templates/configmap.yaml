  trpc_go.yaml: |
    global:                             #全局配置
      namespace: Test                           #环境类型，分正式production和非正式development两种类型
      env_name: test                           #环境名称，非正式环境下多环境的名称
      enable_set: false                 #是否启用set
      full_set_name: adp                #set名
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
      serverConnector:
        joinPoint: ${TRPC_GLOBAL_JOIN_POINT}

    server:                                            #服务端配置
      app: adp                                        #业务的应用名
      server: rag-exec                                   #进程服务名
      bin_path: /usr/local/trpc/bin/                   #二进制可执行文件和框架配置文件所在路径
      conf_path: ${SERVER_CONF_PATH}                 #业务配置文件所在路径
      data_path: /usr/local/trpc/data/                 #业务数据文件所在路径
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - recovery
        - cle-route-propagator
        - i18n-adp
        - chat-trace
        - opentelemetry
        - cos_rewrite
      admin:
        ip: ${POD_IP}
        port: 8081
      service:
        - name: trpc.KEP.bot-rag-server.rpc
          ip: ${POD_IP}
          port: 8001
          network: tcp
          protocol: trpc
          timeout: 30000
        - name: trpc.KEP.bot-rag-server.chat
          ip: ${POD_IP}
          port: 8000
          network: tcp
          protocol: http
          timeout: 0
          server_async: true
          idletime: 600000
        - name: qbot.chat.chat.LoadPromptVersionFromDB
          ip: ${POD_IP}
          port: 9001
          network: "0 */2 * * * * ?startAtOnce=1"
          protocol: timer
          timeout: 600000
        - name: qbot.chat.chat.GetRejectAnswer
          ip: ${POD_IP}
          port: 9002
          network: "0 */2 * * * * ?startAtOnce=1"
          protocol: timer
          timeout: 600000
    plugins:                                          #插件配置
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      i18n:
        i18n-adp:
          default_lang: ${I18N_ADP_DEFAULT_LANG}
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: rag
            error_prefix: error
            char_scaling_factor:
              zh: 1
              en: 3
