kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-rag-exec
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    sse:
      data_channel: ${DATA_CHANNEL}
    bot:
      timeout: 280
      rejected_reply: 这个问题我不是很清楚，我所提供的答案或建议可能会存在不准确的地方。建议您转到人工，由专业顾问为您提供服务。
      empty_reply: 抱歉，目前我无法提供关于这个问题的答复。为了更好地帮助您，请您尝试提出其他问题或需求。
      summary_reject: 对不起，作为知识库问答应用里的人工智能，我无法帮您总结文档。请告诉我你需要了解的其他信息，我会尽力为你提供帮助。
      multi_intent_reply: 在知识库中找到多个内容可以回答您的问题。请问您是想问哪个问题：
      clarify_confirm_reply: 请描述您的问题
      intent_achievements:
        0: ["qa", "workflow", "self_awareness", "doc", "search_engine", "llm", "default"]
      rewrite:
        rewrite_threshold: ${REWRITE_THRESHOLD}
      intent_threshold: ${INTENT_THRESHOLD}
      search_threshold: ${SEARCH_THRESHOLD}
      busy_replies: ${BUSY_REPLIES}
      throttles:
        check: ${THROTTLES_CHECK}
        streaming: ${THROTTLES_STREAMING}
      response_channel_size: 1500
      answer_from_knowledge_timeout: 2
      single_message_limit: ${SINGLE_MESSAGE_LIMIT}
      role_description: ${ROLE_DESCRIPTION}
      bot_role_description: ${BOT_ROLE_DESCRIPTION}
      self_awareness_direct_reply_models: ${SELF_AWARENESS_DIRECT_REPLY_MODELS}
      content_limit: ${BOT_CONTENT_LIMIT}
      role_command_regx:
        role_name_regex: "#+\\s*角色名称: (.*)"
        speech_style_regex: "#+\\s*言谈风格:\\n((?:.|\\n)+?)\\n\\n#+\\s*性格特点:"
        personality_regex: "#+\\s*性格特点:\\n((?:.|\\n)+?)\\n\\n#+\\s*经历和背景:"
        experience_regex: "#+\\s*经历和背景:\\n((?:.|\\n)+?)\\n\\n#+\\s*能力限制:"
        capability_limit_regex: "#+\\s*能力限制:\\n(.*?)\\n\\n"
        skills_regex: "(#+\\s*意图\\s*\\d+)：([\\s\\S]*?)(#+\\s*意图描述)：([\\s\\S]*?)(#+\\s*意图实现)：([\\s\\S]*?)#"
      recommend_regex: ${BOT_RECOMMEND_REGEX}
      placeholder_conf:
        start_placeholders: ${START_PLACEHOLDERS}
      channel_type_list: ${CHANNEL_TYPE_LIST}
    reject_answer_judge_length: ${REJECT_ANSWER_JUDGE_LENGTH}
    space_limiter_account: ${SPACE_USER_ACCOUNT}
    use_placeholder_models: ${USE_PLACEHOLDER_MODELS}
    app:
      knowledge_summary:
    multi_modal:
      model_name_dialog: ${MODEL_NAME_DIALOG}
      only_cos_url: ${ONLY_COS_URL}
      white_list: ${MULTI_MODEL_WHITE_LIST}
      history_limit: 3
      get_caption_prompt: 用200字以内描述这张图片
      get_multi_prompt: 分别用200字以内描述以上图片
      rewrite_prefix: 用户的问题是：
      placeholder: "<ut_im##age_here_index>%d</ut_im##age_here_index>"
      placeholderv2: "Picture %d: <image>[Picture %d]"
      max_image_count: 20
      one_image_token_length: ${ONE_IMAGE_TOKEN_LENGTH}
      multi_modal_comprehension:
        model_name: ${MLLM_MODEL_NAME}
        white_list: ${MLLM_WHITE_LIST}
      can_use_multi_modal_search: ${CAN_USE_MULTI_MODAL_SEARCH}
      max_image_count_limit: ${MAX_IMAGE_COUNT_LIMIT}
    procedure:
      knowledge: 调用知识库
      task_flow: 调用任务流程
      search_engine: 调用搜索引擎
      image: 调用图片理解
      large_language_model: 大模型直接回复
      pot_math: 调用计算器
      file: 阅读文件
      workflow: 调用工作流
      agent: 运行Agent
      model_generate: 大模型生成中
    limiter:
      report_judge_length: ${REPORT_JUDGE_LENGTH}
    hunyuan_config:
      # 注意这里B是大写 跟其他的不一样
      hunyuan_standard: ${HUNYUAN_CONFIG_HUNYUAN_STANDARD}
      hunyuan_search: ${HUNYUAN_CONFIG_HUNYUAN_SEARCH}
      whitelist: ${HUNYUAN_CONFIG_WHITELIST}
      enable_instruction_list: ${HUNYUAN_CONFIG_ENABLE_INSTRUCTION_LIST}
    workflow_config:
      model_name: {{ .Values.global.RagServer.workflow_config_model_name }}
      close_token_report: ${WORKFLOW_CONFIG_CLOSE_TOKEN_REPORT}
    model:
      prompt_length: ${MODEL_PROMPT_LENGHT}
      white_list: ${MODEL_WHITE_LIST}
      prompt_list: ${MODEL_PROMPT_LIST}
    reference:
      patterns: ${REFERENCE_PATTERN}
      hunyuan_switch: ${REFERENCE_HUNYUAN_SWITCH}
      hunyuan_patterns:
        - "（passage (\\d+)）"
        - "以上信息来源于【passage (\\d+)】(。|和【passage (\\d+)】。)"
        - \n引用的passage编号：(\d+)
        - \n引用的passage编号是：(\d+)
        - "\\n\\*\\*引用passage编号\\*\\*：\\[(\\d+)\\]"
        - "\\[passage (\\d+)\\]"
        - \n引用的passage编号是：
        - \n引用的passage编号为：
        - "\\n\\*\\*引用passage编号：\\*\\*"
      retrieval_docs_white_list: ${REFERENCE_RETRIEVAL_DOCS_WHITE_LIST}
      repeat_bracket: ${REPEAT_BRACKET}
      abnormal_bracket: ${ABNORMAL_BRACKET}
      max_input_length: ${REFERENCE_MAX_INPUT_LENGTH}
    finance:
      default_qpm: ${RAG_DEFAULT_QPM}
      default_tpm: ${RAG_DEFAULT_TPM}
      ds_default_qpm: ${RAG_DS_DEFAULT_QPM}
      ds_default_tpm: ${RAG_DS_DEFAULT_TPM}
      model_config:
    clarify_confirm: # 澄清确认、猜你想问白名单
      top_n: ${CLARIFY_CONFIRM_TOP_N}
      white_list: ${CLARIFY_CONFIRM_WHITE_LIST}
    intent_model:
      # 加白是意图中不添加文档
      white_list: ${INTENT_MODEL_WHITE_LIST}
      is_qa_not_first: ${INTENT_MODEL_IS_QA_NOT_FIRST}
      no_faq: ${INTENT_MODEL_NO_FQA}
      system_intent:
        -1: 其他问题
        1: 指令跟随回答
        2: 代码问题
        3: 数学计算
        4: 逻辑推理
        5: 自我认知
        6: 聊天
        7: 天气
        8: 全文处理
        9: 知识问答
      system_intent_map: ${SYSTEM_INTENT_MAP}
      system_intent_white_list: ${SYSTEM_INTENT_WHITE_LIST}
      explicit_intent: ${EXPLICIT_INTENT}
      ds_faq_reject_model: ${DS_FAQ_REJECT_MODEL}
      rerank_score: -3
      guide_of_opt_cards: 请从下面几个选项中进行选择。
      is_free: ${RAG_INTENT_MODEL_FREE}
    mock:
      enable_llm: false
      enable_search: false
      enable_workflow: false
    retrieval_config:
      close_priority: []
      ner_threshold: ${RETRIEVAL_CONFIG_NER_THRESHOLD}
    need_search_global_knowledge: ${NEED_SEARCH_GLOBAL_KNOWLEDGE}
    thought_conf:
      thought_icon: ${RAG_THOUGHT_ICON}
      status_title:
        stop: 思考已停止
        success: 思考已完成
        processing: 思考中
    stage_task_name:
      dialog_ppl: 1_dialog_ppl
      basic_search: 2.2_basic_search
      query_rewrite: 2.3_query_rewrite
      intent_recognize: 3_intent_recognize
      search_pro_for_ds: 4_search_pro_for_ds
      search_knowledge: 4_search_knowledge
      workflow: 5_workflow
      llm_reply: 5_llm_reply
    error_downgrade_conf: ${ERROR_DOWNGRADE_CONF}
    is_private: true
    deep_seek_conf:
      model_name: ${DEEP_SEEK_CONF_MODEL_NAME}
      model_has_think: ${DEEP_SEEK_CONF_MODEL_HAS_THINK}
      image_quiz_white_list: ${DEEP_SEEK_CONF_IMAGE_QUIZE_WHITE_LIST} # 图文问答白名单列表
      qd_ds_start_time: ${DEEP_SEEK_CONF_QD_DS_START_TIME}
      search_secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
      search_secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
      search_result_size: 9
      search_enable_free: ${SEARCH_ENABLE_FREE}
      exclude_search_engine: ["mp"]
      no_think_prompt: ${NO_THINK_PROMPT}
      no_think_model_params: ${NO_THINK_MODEL_PARAMS}
    local_cache: ${LOCAL_CACHE}
    search_engine: ${SEARCH_ENGINE}
    reply_trace_names:
      # 中间节点
      rewrite: ${REPLY_TRACE_REWRITE}
      basic_search: ${REPLY_TRACE_BASIC_SEARCH}
      knowledge_search: ${REPLY_TRACE_KNOWLEDGE_SEARCH}
      intent_recognize: ${REPLY_TRACE_INTENT_RECOGNIZE}
      workflow: ${REPLY_TRACE_WORKFLOW}
      # 回复节点
      query_with_image_and_file: ${REPLY_TRACE_QUERY_WITH_IMAGE_AND_FILE}
      query_with_text_image_file_by_mllm_comprehension: ${REPLY_TRACE_QUERY_WITH_TEXT_IMAGE_FILE}
      doc_summary: ${REPLY_TRACE_DOC_SUMMARY}
      query_with_image: ${REPLY_TRACE_QUERY_WITH_IMAGE}
      multi_modal_multi_turn_dialog: ${REPLY_TRACE_MULTI_MODAL_MULTI_TURN}
      multi_modal_reading_comprehension: ${REPLY_TRACE_MULTI_MODAL_READING}
      ds_r1_summary: ${REPLY_TRACE_DS_R1_SUMMARY}
      faq_reply: ${REPLY_TRACE_FAQ_REPLY}
      llm_direct: ${REPLY_TRACE_LLM_DIRECT}
      qa_direct_reply: ${REPLY_TRACE_QA_DIRECT_REPLY}
      reject_reply: ${REPLY_TRACE_REJECT_REPLY}
      global_knowledge: ${REPLY_TRACE_GLOBAL_KNOWLEDGE}
      summary_reject_reply: ${REPLY_TRACE_SUMMARY_REJECT_REPLY}
      doc_and_qa: ${REPLY_TRACE_DOC_AND_QA}
      doc: ${REPLY_TRACE_DOC}
      doc_multi_model: ${REPLY_TRACE_DOC_MULTI_MODEL}
      clarify_confirm: ${REPLY_TRACE_CLARIFY_CONFIRM}
      general: ${REPLY_TRACE_GENERAL}
      single_doc_full_text: ${REPLY_TRACE_SINGLE_DOC_FULL_TEXT}
      multi_doc_summarize: ${REPLY_TRACE_MULTI_DOC_SUMMARIZE}
      hun_yuan_search: ${REPLY_TRACE_HUN_YUAN_SEARCH}
      sougou_search: ${REPLY_TRACE_SOUGOU_SEARCH}
      search_intl: ${REPLY_TRACE_SEARCH_INTL}
      yuanbao_search: ${REPLY_TRACE_YUANBAO_SEARCH}
    think_conf:
      model_has_think: ${THINK_CONF_MODEL_HAS_THINK}
    web_search: ${WEB_SEARCH}


  client.yaml: |
    client:
      namespace: Test
      filter:
        - opentelemetry
        - cle-route-propagator
        - chat-trace
      service:
        - name: mysql.qbot.qbot
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local
        - name: tdsql.qbot.qbot
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local
        - name: mysql.adp.prompt
          target: dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local
        - name: redis.qbot.qbot
          network: tcp
          protocol: redis
          target: ip://${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379
          password: "${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}"
          timeout: 800
        - name: redis.lke.limiter
          network: tcp
          protocol: redis
          target: ip://${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/4
          password: "${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}"
          timeout: 800
        - callee: trpc.KEP.bot_knowledge_config_server.Api
          name: trpc.KEP.bot-knowledge-config-server.Api
          target: "ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092"
          namespace: Test
          protocol: trpc
          timeout: 600000
        - name: qbot.finance.finance.Finance
          namespace: Test
          target: "ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090"
          network: tcp
          timeout: 30000
        - name: trpc.KEP.bot-llm-server.llm
          callee: trpc.KEP.bot_llm_server.llm
          namespace: Test
          target: "ip://adp-llm.{{ .Release.Namespace }}.svc.cluster.local:8000"
          network: tcp
          timeout: 5000
        - callee: trpc.KEP.bot_admin_config_server.Api
          namespace: Test
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Api
          namespace: Test
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.bot_workflow_dm_server.WorkflowDm
          name: trpc.KEP.bot-workflow-dm-server.workflow-dm
          namespace: Test
          target: "ip://adp-workflow-exec.{{ .Release.Namespace }}.svc.cluster.local:8000"
          timeout: 600000
        - callee: trpc.KEP.bot-workflow-dm-server.workflow-dm-http
          target: "ip://adp-workflow-exec.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: Test
          network: tcp
          protocol: http
          timeout: 600000
        - name: trpc.adp.ai-gateway.api
          target: "ip://adp-ai-gateway.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: Test
          network: tcp
          protocol: http
          timeout: 1800000
        - callee: trpc.KEP.bot_data_statistics_server.Api
          target: "ip://adp-platform-metrology.{{ .Release.Namespace }}.svc.cluster.local:8000"
          namespace: Test
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.kb_config.Api
          namespace: Test
          protocol: trpc
          timeout: 60000
          target: "ip://adp-kb-config.{{ .Release.Namespace }}.svc.cluster.local:9092"
        - callee: trpc.adp.workflow_exec.WorkflowExec
          namespace: Test
          timeout: 600000
          target: "ip://adp-workflow-exec.{{ .Release.Namespace }}.svc.cluster.local:8000"
        - callee: trpc.adp.platform_metrology.Api
          namespace: Test
          target: "ip://adp-platform-metrology.{{ .Release.Namespace }}.svc.cluster.local:8000"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_config.Admin
          target: "ip://adp-app-config.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: Test
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.resource_gallery.Admin
          target: "ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: Test
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.platform_manager.Login
          namespace: Test
          target: "ip://adp-platform-manager.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 6000
        - callee: trpc.adp.platform_charger.Finance
          namespace: Test
          target: "ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090"
          network: tcp
          protocol: trpc
          timeout: 20000
        - name: trpc.adp.kb_retrieval.DirectIndex
          namespace: Test
          target: "ip://adp-kb-retrieval.{{ .Release.Namespace }}.svc.cluster.local:9091"
          timeout: 30000


