    RAG_WORKFLOW_DM_SERVER_TARGET: "ip://adp-workflow-exec.{{ .Release.Namespace }}.svc.cluster.local:8000"

    RAG_WORKFLOW_DM_HTTP_SERVER_TARGET: "ip://adp-workflow-exec.{{ .Release.Namespace }}.svc.cluster.local:8001"

