kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-workflow-config
  namespace: {{ .Release.Namespace }}
data:
  client.yaml: |
    client:
      filter:
        - client_track
        - cle-route-propagator
      service:
        # 工作流MySQL
        - name: mysql.db_llm_plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_task
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot_task?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_task_prod
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot_task_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_workflow
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_workflow_formal?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_workflow_prod
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_workflow_formal_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_task.delete
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot_task?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_task_prod.delete
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot_task_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_workflow.delete
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_workflow_formal?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: mysql.db_llm_robot_workflow_prod.delete
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_workflow_formal_prod?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: redis.bot-task-config-server
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/0"
          password: ${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}
        - name: tdsql.db_llm_robot_workflow_exec
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_workflow?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: tdsql.db_llm_robot_workflow_exec_readonly
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_workflow?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: trpc.http.cos.Access
          target: "dns://cos-internal.${INFRA_MIDDLEWARES_S3_COS_REGION}.tencentcos.cn"
          network: tcp
          protocol: http
          timeout: 5000
        - callee: trpc.KEP.bot_admin_config_server.Login
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Login
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9091"
          protocol: trpc
          timeout: 20000
        - callee: trpc.KEP.bot_admin_config_server.Api
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: trpc.adp.app_admin_proxy.Api
          target: "ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092"
          protocol: trpc
          timeout: 20000
        - callee: qbot.finance.finance.Finance
          target: "ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          timeout: 300000
        - callee: trpc.adp.platform_charger.Finance
          target: "ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: trpc
          timeout: 300000
