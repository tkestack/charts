  trpc_go.yaml: |
    global:
      namespace: {{ .Release.Namespace }}
    server:
      app: adp
      server: workflow-config
      bin_path: /app/bin/
      conf_path: /app/conf/
      data_path: /app/data/
      admin:
        ip: ''
        port: 8081
        write_timeout: 600000
      filter:
        - recovery
        - i18n-adp
        - cle-route-propagator
        - opentelemetry
        - cos_rewrite
      service:
        - name: trpc.KEP.bot-task-config-server.TimerCheckTaskFlowMigration
          ip: ${POD_IP}
          port: 8005
          network: "0 */2 * * * * ?startAtOnce=0&scheduler=redis&holdTime=60"
          protocol: timer
          timeout: 120000
        - name: trpc.adp.workflow_config.WorkflowConfig
          ip: ${POD_IP}
          port: 8000
          network: tcp
          protocol: trpc
          timeout: 10000
          server_async: true
          idletime: 600000
          filter:
            - session
            - permission
        - name: trpc.adp.workflow_config.WorkflowConfigApi
          ip: ${POD_IP}
          port: 8001
          network: tcp
          protocol: trpc
          timeout: 10000
          server_async: true
          idletime: 600000
    plugins:
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
        clues:
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/clues.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: rainbow-comm
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      registry:
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: task
            error_prefix: error
            char_scaling_factor:
              zh-CN: 1
              en-US: 3
      selector:
        polaris:
          enable_servicerouter: true


    client:
      filter:
        - client_track
        - cle-route-propagator
      service:
        # 工作流MySQL
        - name: mysql.db_llm_plugin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_plugin?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
