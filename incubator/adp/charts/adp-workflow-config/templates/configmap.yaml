          protocol: trpc
          network: tcp
          timeout: 20000
        - name: customer_service.robot.robot_config.RobotConfig
          target: "ip://${QIDIAN_TARGET}:9091"
          protocol: trpc
          timeout: 3000
        - callee: trpc.KEP.bot_workflow_dm_server.WorkflowDm
