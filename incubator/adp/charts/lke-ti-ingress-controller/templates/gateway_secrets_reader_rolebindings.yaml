apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-apisix-secrets-reader-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-apisix-secrets-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-apisix-view-serviceaccount
    namespace: {{ .Release.Namespace }}
