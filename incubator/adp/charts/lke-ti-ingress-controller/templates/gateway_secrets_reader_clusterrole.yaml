# 仅授予 secrets 的 get/list/watch；需配合同目录 RoleBinding 才在指定 namespace 生效
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-apisix-secrets-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
