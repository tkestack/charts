kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-plugin-gateway
  namespace: {{ .Release.Namespace }}
data:
  client.yaml: |
    client:                                            #客户端调用的后端配置
      namespace: ${NAMESPACE}                                  #针对所有后端的环境
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - cle-route-propagator
      stream_filter:
      service:
        - name: redis.plugin-gateway-server
          target: redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${INFRA_MIDDLEWARES_REDIS_0_PORT}/27

        - callee: trpc.KEP.plugin_config_server.PluginConfigApi
          namespace: ${NAMESPACE}
          target: ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          protocol: trpc
          timeout: 20000

        - callee: trpc.adp.plugin_config.PluginConfigApi
          namespace: ${NAMESPACE}
          target: ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          protocol: trpc
          timeout: 20000

        - callee: trpc.adp.plugin_exec.PluginExec
          namespace: ${NAMESPACE}
          target: ip://adp-plugin-exec.{{ .Release.Namespace }}.svc.cluster.local:8000
          timeout: 7200000

        - name: qbot.finance.finance.Finance
          target: ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp
          timeout: 30000

        - name: trpc.adp.resource_gallery.Admin
          target: ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp
          timeout: 30000

        - callee: trpc.adp.platform_metrology.Api
          target: ip://adp-platform-metrology.{{ .Release.Namespace }}.svc.cluster.local:8000
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp
          timeout: 30000

        - name: qbot.finance.finance.Finance
          target: ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp    
          timeout: 300000

  env.yaml: |
    version: 2.0.0 # 固定值，不需要修改
    kind: env # 固定值，不需要修改
    metadata:
        name: formal # 环境名称 [选填]

  main.yaml: |
    gateway:
      gateway_timeout: 60
      downstream_timeout: 30
      session_ttl_second: 1800
      owner_command_max_concurrency: 128
      owner_command_session_queue_size: 128
      mcp_protocol_version: "2025-03-26"
      mcp_server_name: "ADP"
      session_cleanup_interval_second: 300
      max_logged_body_bytes: 4096
      forward_header_blacklist:
        - host
        - content-length
        - connection
        - proxy-connection
        - keep-alive
        - proxy-authenticate
        - proxy-authorization
        - te
        - trailer
        - transfer-encoding
        - upgrade
      rate_limit:
        ip_enabled: true
        request_enabled: true
        tool_call_enabled: true
        report_only: false
        polaris:
          namespace: ${NAMESPACE}
          service: "trpc.KEP.plugin-gateway-server.PluginGatewayHttp"
          timeout_ms: 50
          max_retries: 1
  placeholder.yaml: |
    NAMESPACE: Production
    ENV_NAME: formal

    PLUGIN_CONFIG_TARGET: ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001

    PLUGIN_EXEC_TARGET: ip://adp-plugin-exec.{{ .Release.Namespace }}.svc.cluster.local:8000

    RESOURCE_GALLERY_TARGET: ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090

    METROLOGY_TARGET: ip://adp-platform-metrology.{{ .Release.Namespace }}.svc.cluster.local:8000

    FINANCE_TARGET: ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090
  plugin_zh-CN.json: |
    {
      "oauth2_unauthorized_format": "%s插件需授权后方可使用，完成授权即表示您同意将相关数据共享给智能体开发平台中的大模型。请[点击此处](%s)进行授权（链接有效期 10 分钟，授权完成后该链接将失效）。如需取消授权，请前往插件服务提供方进行操作。"
    }
  trpc_go.yaml: |
    global:                             #全局配置
      namespace: ${NAMESPACE}            #环境类型，分正式production和非正式development两种类型
      env_name: ${ENV_NAME}                    #环境名称，非正式环境下多环境的名称
      enable_set: ${ENABLE_SET}         #是否启用set
      full_set_name: ${FULL_SET_NAME}   #set名
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
      max_frame_size: 20971520 # 最大20M限制

    server:
      app: adp
      server: plugin-gateway
      bin_path: /app/bin/
      conf_path: /app/conf/
      data_path: /app/data/
      filter:
        - recovery
        - i18n-adp
        - opentelemetry
        - cle-route-propagator
      admin:
        ip: ${POD_IP}
        port: 8081
      service:                                         #业务服务提供的service，可以有多个
        - name: trpc.KEP.plugin-gateway-server.PluginGatewayHttp      #service的路由名称
          ip: ${POD_IP}                                 #服务监听ip地址 可使用占位符 ${ip},ip和nic二选一，优先ip
          port: 8002                                    #服务监听端口 可使用占位符 ${port}
          network: tcp                                  #网络监听类型  tcp udp
          protocol: http_no_protocol                    #应用层协议 trpc http
          timeout: 600000                               #请求最长处理时间 单位 毫秒
          server_async: true                            #开启异步处理
          idletime: 6000000                             # idletime，设置tcp空闲等待时间，避免耗时过长的操作导致trpc-go将tcp关闭
    plugins:                                          #插件配置
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: rainbow-comm
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}  # appid
              group: global # 配置所属组
              type: kv   # 七彩石数据格式, kv(默认), table
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      i18n:
        i18n-adp:
          default_lang: zh-CN
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: plugin
            error_prefix: error
            char_scaling_factor:
              zh-CN: 1
              en-US: 3
      selector: #针对用户自定义的selector的配置
        polaris: #针对polaris整体api的内部配置
          protocol: grpc                              #名字服务远程交互协议类型
          enable_servicerouter: true
          enable_trans_meta: true

    client:                                            #客户端调用的后端配置
      namespace: ${NAMESPACE}                                  #针对所有后端的环境
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - cle-route-propagator
      stream_filter:
      service:
        - name: redis.plugin-gateway-server
          target: redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:${INFRA_MIDDLEWARES_REDIS_0_PORT}/27

        - callee: trpc.KEP.plugin_config_server.PluginConfigApi
          namespace: ${NAMESPACE}
          target: ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          protocol: trpc
          timeout: 20000

        - callee: trpc.adp.plugin_config.PluginConfigApi
          namespace: ${NAMESPACE}
          target: ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001
          protocol: trpc
          timeout: 20000

        - callee: trpc.adp.plugin_exec.PluginExec
          namespace: ${NAMESPACE}
          target: ip://adp-plugin-exec.{{ .Release.Namespace }}.svc.cluster.local:8000
          timeout: 7200000

        - name: qbot.finance.finance.Finance
          target: ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp
          timeout: 30000

        - name: trpc.adp.resource_gallery.Admin
          target: ip://adp-resource-gallery.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp
          timeout: 30000

        - callee: trpc.adp.platform_metrology.Api
          target: ip://adp-platform-metrology.{{ .Release.Namespace }}.svc.cluster.local:8000
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp
          timeout: 30000

        - name: qbot.finance.finance.Finance
          target: ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090
          namespace: ${NAMESPACE}
          protocol: trpc
          network: tcp    
          timeout: 300000
