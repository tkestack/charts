apiVersion: v1
kind: Service
metadata:
  labels:
    app: adp-plugin-gateway
  name: adp-plugin-gateway
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: adp-plugin-gateway-8002
      port: 8002
      protocol: TCP
      targetPort: 8002
    - name: adp-plugin-gateway-8081
      port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    app: adp-plugin-gateway
  sessionAffinity: None
  type: ClusterIP
