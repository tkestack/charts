kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-chat-manage
  namespace: {{ .Release.Namespace }}
data:
  adp.yaml: |
    vips:
    envs:
      - env: gray-kb
        uins:
      - env: gray-base
        uins:

  agent.yaml: |
    tipwords_opt:
      hunyuan_version: {{ .Values.global.ChatServer.tipwords_opt_hunyuan_version }}
      prompt: |-
        {{`<Background>
        You are an expert in enhancing user prompts, skilled at adding detailed clarifications and correcting language issues. Identify unclear, incorrect, or missing information in the "User Prompt", and suggest precise additions or corrections to improve clarity and accuracy.
        Note: Only supplement user prompts, DO NOT directly answer user prompts, DO NOT omit important information from the "User Prompt".
        </Background>

        <User Prompt>
        {{ user_prompt | trim }}
        </User Prompt>

        <Output Format>
        - Revise the "User Prompt", and output the revised user prompt directly in Chinese without adding any extra content.
        - Your output should be formed as:

        (具体的任务目标)

        (详细且完整的任务流程，需要从User Prompt中拆分出具体的执行步骤，每个步骤应逐个列出，确保每个步骤都写得清晰具体完整，不要遗漏"回复示例"或"回复格式")

        (任务的限制条件，例如具体的输出格式要求、内容要求等。需要从User Prompt中提取出所有的限制条件，并合理补充其他的限制条件，以更好地完成任务)

        </Output Format>

        <Revised User Prompt>`}}
    unsafe_domain:
      - cos.${INFRA_MIDDLEWARES_S3_COS_REGION}.myqcloud.com
      - {{ .Values.global.clb }}


  application.yaml: |
    disable_content_check: {{ .Values.global.contentSecurity.disableContentCheck }}
    # RESOLVE: keep-private
    skip_check: []
    evil_check_config: ${APPLICATION_EVIL_CHECK_CONFIG}
    session:
      downvote_expire: 900
      greeting_interval: 900
      intent_transfer_keyword: ${APPLICATION_INTENT_TRANSFER_KEYWORD}
      intent_model_name: ${APPLICATION_INTENT_MODEL_NAME}
    websocket:
      token_ttl: 60
      client_ttl: ${APPLICATION_WEBSOCKET_CLIENT_TTL}
      emit_max_goroutine: 5
    openclaw:
      ws_target: "ws://trpc.adp.adpbot-gateway.websocket.polaris:9003"
      ws_service_name: ${APPLICATION_OPENCLAW_WS_SERVICE_NAME}
      ws_path: ${APPLICATION_OPENCLAW_WS_PATH}
      ws_dial_timeout_ms: 5000
      ws_auth_timeout_ms: 30000
      greeting_message: ${APPLICATION_OPENCLAW_GREETING_MESSAGE}
      recommend_questions: ${APPLICATION_OPENCLAW_RECOMMEND_QUESTIONS}
      text_replacements: ${APPLICATION_OPENCLAW_TEXT_REPLACEMENTS}
    reconnect:
      reconnect_data_ttl: 600
      reconnect_idle_time: 120
      output_rate: ${APPLICATION_RECONNECT_OUTPUT_RATE}
      recovery_max_time: 900
      support_events: ${APPLICATION_RECONNECT_SUPPORT_EVENTS}
      max_times: ${APPLICATION_RECONNECT_MAX_TIMES}
      max_same_event: 100
      nil_return_msg: "nil returned"
    clean_data_conf:
      # RESOLVE: keep-private
      retention_day: {{ .Values.global.delete_data.chat_server_retention_days }}
      select_batch_size: ${APPLICATION_CLEAN_DATA_SELECT_BATCH_SIZE}
      clean_interval: 1000
      need_clear_max_cost: 1000
      retention_session_msg_num: 2000
      select_session_num: 10
    sse:
      enable_defer_client_close: true
      defer_client_close_time: ${APPLICATION_SSE_DEFER_CLIENT_CLOSE_TIME}
    bot:
      timeout: ${APPLICATION_BOT_TIMEOUT}
      evil_reply: ${APPLICATION_BOT_EVIL_REPLY}
      busy_replies: ${APPLICATION_BOT_BUSY_REPLIES}
      throttles:
        check: 20
        streaming: ${APPLICATION_BOT_THROTTLES_STREAMING}
      response_channel_size: 1500
      # RESOLVE: keep-private
      max_concurrence:
        standard: {{ .Values.global.ChatServer.max_concurrence }}
        white_list:
          10101010110: 50
      stop_generation:
        key_expire: 180
        check_interval: 250
      history_limit: ${APPLICATION_BOT_HISTORY_LIMIT}
      single_message_limit: ${APPLICATION_BOT_SINGLE_MESSAGE_LIMIT}
      role_description: ${APPLICATION_ROLE_DESCRIPTION}
      bot_role_description: ${APPLICATION_BOT_ROLE_DESCRIPTION}
      visitor_labels:
        label_count: 10
        label_name_length: 30
        label_value_count: 10
        label_value_length: 50
      content_limit: ${APPLICATION_BOT_CONTENT_LIMIT}
      session_regx: ${APPLICATION_BOT_SESSION_REGX}
      recommend_regex: ${APPLICATION_BOT_RECOMMEND_REGEX}
      channel_type_list: ${APPLICATION_BOT_CHANNEL_TYPE_LIST}
    unsatisfied_reply:
      context_length:
        above: 15
        below: 15
    reject_answer_judge_length: 20
    app:
      # RESOLVE: keep-private
      black_list: []
      # RESOLVE: keep-private
      force_close_llm: []
    multi_modal:
      get_caption_prompt: 用200字以内描述这张图片
    rate_limiter:
      enable: ${RATE_LIMITER_ENABLE}
      redis_address: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/4"
      period: 1s
      clean_up_interval: 1m
      limit: 10
    limiter:
      enable: ${LIMITER_ENABLE}
      limit_buffer: 5
      time_period: 1
      default_corp_limit: ${APPLICATION_LIMITER_DEFAULT_CORP_LIMIT}
      report_judge_length: 100
      # RESOLVE: keep-private
      corp_limit:
        233748: 20
        274049: 100
        275582: 84
        284605: 300
    workflow_config:
      model_name: workflow-pro
      workflow_role_model_name: ${APPLICATION_WORKFLOW_ROLE_MODEL_NAME}
      workflow_intent_model_name: ${APPLICATION_WORKFLOW_INTENT_MODEL_NAME}
      role_intent_model_name:
      param_regexp: "{{`{{(.*?)}}`}}"
      code_gen_model_name: lke-deepseek-v3.1
      close_token_report: true
    one_click_optimization:
      default_model_name: ${APPLICATION_ONE_CLICK_DEFAULT_MODEL_NAME}
      agent_transfer_desc_model_name: ${APPLICATION_ONE_CLICK_AGENT_TRANSFER_DESC_MODEL_NAME}
    pipeline_debugging:
      keys:
        - knowledge.SearchPreviewDoc
        - knowledge.SearchDoc
    model:
      local_cache_ttl: 300
      prompt_length: ${APPLICATION_MODEL_PROMPT_LENGTH}
      # RESOLVE: keep-private
      white_list: []
      prompt_list:
        normal_message: |-
              {{`{{- if gt (len .Docs) 0 -}}
                以下的已知信息包括多个passage，请基于这个已知信息，简洁和专业的来回答用户的问题。并输出引用的passage编号。
                已知内容:<$!truN#cAte+>
                {{range $i, $el := .Docs -}}
                  【passage {{addOne $i }}】
                  {{ if or (eq .DocType 1) (eq .DocType 4) -}}
                    {{.Question}} {{.Answer}}
                  {{- else -}}
                    {{.OrgData}}
                  {{- end}}
                {{end}}<-truN#cAte!$>
              问题:
              {{end -}}
              {{.Question}}`}}
        normal_message_non_general_knowledge: |-
              {{`{{- if gt (len .Docs) 0 -}}
                以下的已知信息包括多个passage，请基于这个已知信息，简洁和专业的来回答用户的问题。并输出引用的passage编号。如果无法从中得到答案，请拒绝回答，并说明原因。
                已知内容:<$!truN#cAte+>
                {{range $i, $el := .Docs -}}
                  【passage {{addOne $i }}】
                  {{ if or (eq .DocType 1) (eq .DocType 4) -}}
                    {{.Question}} {{.Answer}}
                  {{- else -}}
                    {{.OrgData}}
                  {{- end}}
                {{end}}<-truN#cAte!$>
              问题:
              {{end -}}
              {{.Question}}`}}
    finance:
      search_disabled: {{ .Values.global.finance.search_disabled }}
      disabled: {{ .Values.global.finance.disabled }}
      report_disabled: {{ .Values.global.finance.report_disabled }}
      key_expire: 1800
      default_qpm: 50
      default_tpm: 100000
      ds_default_qpm: ${APPLICATION_FINANCE_DS_DEFAULT_QPM}
      ds_default_tpm: ${APPLICATION_FINANCE_DS_DEFAULT_TPM}
      billing_model_map: ${APPLICATION_FINANCE_BILLING_MODEL_MAP}
      biz_type: ${APPLICATION_FINANCE_BIZ_TYPE}
      # 模型级默认 QPM/TPM 限流配置
      model_config: ${APPLICATION_FINANCE_MODEL_CONFIG}
    clarify_confirm:
      top_n: 3
      # RESOLVE: keep-private
      white_list: []
    mock:
      enable_llm: false
    debug_message:
      salt: a99a52254a1d58231ebe07b2a7f28534
    stage_task_name: ${APPLICATION_STAGE_TASK_NAME}
    thought_conf:
      # RESOLVE: keep-public
      thought_icon: ${APPLICATION_THOUGHT_ICON}
      status_title: ${APPLICATION_THOUGHT_STATUS_TITLE}
    event_downgrade_conf: ${APPLICATION_EVENT_DOWNGRADE_CONF}
    error_downgrade_conf: ${APPLICATION_ERROR_DOWNGRADE_CONF}
    deep_seek_conf:
      model_name: ${APPLICATION_DEEP_SEEK_MODEL_NAME}
      model_has_think: ${APPLICATION_DEEP_SEEK_MODEL_HAS_THINK}
      enable_ds_math_calculate: true
      no_think_prompt: ${APPLICATION_DEEP_SEEK_NO_THINK_PROMPT}
      no_think_model_params: ${APPLICATION_DEEP_SEEK_NO_THINK_PARAM}
    get_msg_count_limit: 1000
    get_msg_default_count: 15
    rtc:
      user_sig_ttl: 10800
      robot_user_suffix: _robot
      avatar_user_suffix: _avatar
      room_map: ${APPLICATION_RTC_ROOM_MAP}
      agent_config:
        enable: true
        filter_brackets_content: 1
      stt_config:
        enable: true
        vad_silence_time: 2000
      limiter:
        enable: true
        time_period: ${APPLICATION_RTC_LIMITER_TIME_PERIOD}
      max_concurrence: ${APPLICATION_RTC_MAX_CONCURRENCE}
      callback:
        enable: true
        enable_debug: true
        enable_metric_label: true
        report_metric_map:
          asr_latency: histogram
          llm_network_latency: histogram
          llm_first_token: histogram
          tts_network_latency: histogram
          tts_first_frame_latency: histogram
          llm_first_sentence_generate_cost: histogram
          tts_discontinuity: sum
          interruption: sum
      enable_task_valid: ${APPLICATION_RTC_ENABLE_TASK_VALID}
    trtc:
      endpoint: ${TRTC_ENDPOINT}
      region: ${TRTC_REGION}
      secret_id: ${TRTC_SECRET_ID}
      secret_key: ${TRTC_SECRET_KEY}
      sdk_app_id: ${TRTC_SDK_APP_ID}
      user_key: ${TRTC_USER_KEY}
      callback_key: ${TRTC_CALLBACK_KEY}
    llm:
      api_url: ${LLM_API_URL}
      api_exp_url: ${LLM_EXP_API_URL}
      timeout: ${APPLICATION_LLM_TIMEOUT}
      is_ret_thought_event: true
    tts:
      app_id: ${TTS_APP_ID}
      secret_id: ${TTS_SECRET_ID}
      secret_key: ${TTS_SECRET_KEY}
      signature_action: ${TTS_SIGNATURE_ACTION}
      signature_url: ${TTS_SIGNATURE_URL}
      signature_ttl: ${TTS_SIGNATURE_TTL}
    digital_human:
      app_key: ${DIGITAL_HUMAN_APP_KEY}
      access_token: ${DIGITAL_HUMAN_ACCESS_TOKEN}
      secret_key: ${DIGITAL_HUMAN_SECRET_KEY}
      signature_ttl: ${DIGITAL_HUMAN_SIGNATURE_TTL}
    sts:
      app_id: ${STS_APP_ID}
      endpoint: ${STS_ENDPOINT}
      region: ${STS_REGION}
      secret_id: ${STS_SECRET_ID}
      secret_key: ${STS_SECRET_KEY}
      credential_map:
        asr:
          name: ${STS_ASR_NAME}
          policy: ${STS_ASR_POLICY}
          ttl: 3600
    local_cache:
      app_cache:
        switch: false
        capacity: ${APPLICATION_LOCAL_CACHE_APP_CACHE_CAPACITY}
        expiration: 1800
        update_cache_interval: ${APPLICATION_LOCAL_CACHE_APP_CACHE_UPDATE_CACHE_INTERVAL}
    doc_clean_config:
      doc_record_expire_days: ${APPLICATION_DOC_CLEAN_EXPIRE_DAYS}
      default_expire_seconds: ${APPLICATION_DOC_CLEAN_DEFAULT_EXPIRE_SECONDS}
      # RESOLVE: keep-public
      custom_app_expire_seconds: ${APPLICATION_DOC_CLEAN_CUSTOM_APP_EXPIRE_SECONDS}
    core_config:
      data_channel: ${APPLICATION_CORE_CONFIG_DATA_CHANNEL}
      sse_timeout: 5400000
      rag:
        blacklist: ${APPLICATION_CORE_CONFIG_RAG_BLACKLIST}
        switch: true
        whitelist: ${APPLICATION_CORE_CONFIG_RAG_WHITELIST}
        callee: ${CORE_RAG_CALLEE}
        path: /rag/chat
      agent:
        blacklist: ${APPLICATION_CORE_CONFIG_AGENT_BLACKLIST}
        switch: true
        whitelist: ${APPLICATION_CORE_CONFIG_AGENT_WHITELIST}
        callee: ${CORE_AGENT_CALLEE}
        path: /agent/chat
      workflow:
        blacklist: ${APPLICATION_CORE_CONFIG_WORKFLOW_BLACKLIST}
        switch: true
        whitelist: ${APPLICATION_CORE_CONFIG_WORKFLOW_WHITELIST}
        callee: ${CORE_WORKFLOW_CALLEE}
        path: /single_workflow/chat
      cloud_agent:
        blacklist: ${APPLICATION_CORE_CONFIG_CLOUD_AGENT_BLACKLIST}
        switch: true
        whitelist: ${APPLICATION_CORE_CONFIG_CLOUD_AGENT_WHITELIST}
        callee: ${APPLICATION_CORE_CONFIG_CLOUD_AGENT_CALLEE}
        path: /agent/v2/chat
      corp_assistant:
        blacklist: ${APPLICATION_CORE_CONFIG_CORP_ASSISTANT_BLACKLIST}
        switch: true
        whitelist: ${APPLICATION_CORE_CONFIG_CORP_ASSISTANT_WHITELIST}
        callee: ${APPLICATION_CORE_CONFIG_CORP_ASSISTANT_CALLEE}
        path: /agent/v2/chat
    ip_check_list:
      white:
      black:
    widget:
      default_uin: 90000001
      default_action_echo: ${APPLICATION_WIDGET_DEFAULT_ACTION_ECHO}
      fallback_prefix: ${APPLICATION_WIDGET_FALLBACK_PREFIX}
      component_value_keys:
      token_verify:
        disabled: ${APPLICATION_WIDGET_TOKEN_VERIFY_DISABLED}
        secret: ${APPLICATION_WIDGET_TOKEN_VERIFY_SECRET}
        cos_config:
          secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
          secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
          region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
          bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
          bucket_path: ${INFRA_MIDDLEWARES_S3_COS_SUBPATH}
          endpoint:
        storage:
          type: cos
          cos_map:
            offline:
              secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
              secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
              app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
              region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
              bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
              domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
              expire_time: 30m
              credential_time: 10m
              assume_role:
                role_arn: "{{ dig "components" "s3" "cos" "stsRoleArn" "" .Values.global }}"
                duration_seconds: 43200
                refresh_ahead_seconds: 300
            realtime:
              secret_id: ${INFRA_MIDDLEWARES_S3_COS_SECRETID}
              secret_key: ${INFRA_MIDDLEWARES_S3_COS_SECRETKEY}
              app_id: ${INFRA_MIDDLEWARES_S3_COS_APPID}
              region: ${INFRA_MIDDLEWARES_S3_COS_REGION}
              bucket: ${INFRA_MIDDLEWARES_S3_COS_BUCKET}
              domain: ${INFRA_MIDDLEWARES_S3_COS_DOMAIN}
              expire_time: 30m
              credential_time: 10m
              assume_role:
                role_arn: "{{ dig "components" "s3" "cos" "stsRoleArn" "" .Values.global }}"
                duration_seconds: 43200
                refresh_ahead_seconds: 300
      optimize:
        default_model_name: ${APPLICATION_WIDGET_OPTIMIZE_DEFAULT_MODEL}
        # RESOLVE: keep-public
        prompt_template: ${APPLICATION_WIDGET_OPTIMIZE_PROMPT_TEMPLATE}
      storage: ${APPLICATION_WIDGET_STORAGE}
      cos_config:
        secret_id: ${APPLICATION_WIDGET_COS_SECID}
        secret_key: ${APPLICATION_WIDGET_COS_SECKEY}
        region: ${APPLICATION_WIDGET_COS_REGION}
        bucket: ${APPLICATION_WIDGET_COS_BUCKET}
        bucket_path: ${APPLICATION_WIDGET_COS_BUCKET_PATH}
        endpoint: ${APPLICATION_WIDGET_COS_ENDPOINT}
    db_transfer_map: ${APPLICATION_DB_TRANSFER_MAP}
    inner_access_control: ${APPLICATION_INNER_ACCESS_CONTROL}
    is_private: true
    apex:
      # RESOLVE: keep-private
      use_grpc: true
      # RESOLVE: keep-private
      namespace: ''
      # RESOLVE: keep-private
      service: apex.router
      default_target: "apex-router-cmlb-8083-0.{{ .Release.Namespace }}.svc.cluster.local:8083"
    experiment_config:
      knowledge_service_name: ${APPLICATION_EXPERIMENT_KNOWLEDGE_SERVICE_NAME}
      namespace: ${APPLICATION_EXPERIMENT_NAMESPACE}
      env_name: ${APPLICATION_EXPERIMENT_ENV_NAME}
      replace_app_map: ${EXPERIENCE_REPLACE_APP_MAP}
    corp_assistant:
      conversation_limit:
        default_conversation_count: ${APPLICATION_CORP_ASSISTANT_DEFAULT_CONVERSATION_COUNT}
      deleted_conversation_retention_seconds: ${APPLICATION_CORP_ASSISTANT_DELETED_CONVERSATION_RETENTION_SECONDS}
      title_generate_timeout: ${APPLICATION_CORP_ASSISTANT_TITLE_GENERATE_TIMEOUT}
      storage_type: ${APPLICATION_CORP_ASSISTANT_STORAGE_TYPE}
      cos_storage:
        type_key: ${APPLICATION_CORP_ASSISTANT_COS_TYPE_KEY}
        secret_id: ${APPLICATION_CORP_ASSISTANT_COS_SECRET_ID}
        secret_key: ${APPLICATION_CORP_ASSISTANT_COS_SECRET_KEY}
        app_id: ${APPLICATION_CORP_ASSISTANT_COS_APP_ID}
        region: ${APPLICATION_CORP_ASSISTANT_COS_REGIN}
        bucket: ${APPLICATION_CORP_ASSISTANT_COS_BUCKET}
        domain: ${APPLICATION_CORP_ASSISTANT_COS_DOMAIN}
        expire_time: 24h
        credential_time: 10m
        polaris_service: ${APPLICATION_CORP_ASSISTANT_COS_POLARIS_SERVICE}
        polaris_namespace: ${APPLICATION_CORP_ASSISTANT_COS_POLARIS_NAMESPACE}
      sandbox_storage:
        domain: ${AGENT_FILE_SYSTEM_DOMAIN}
        token_request_signature_key: ${AGENT_FILE_SYSTEM_SIGN_KEY}
        file_token_expire_time: 24h
        token_ttl: 30m
        request_timeout: 10s
        token_tag: ${APPLICATION_CORP_ASSISTANT_FILE_SYSTEM_TOKEN_TAG}
      snapshot_storage: ${APPLICATION_CORP_ASSISTANT_SNAPSHOT_STORAGE}
    cloud_agent:
      storage_type: ${APPLICATION_CLOUD_AGENT_STORAGE_TYPE}
      title_generate_timeout: ${APPLICATION_CLOUD_AGENT_TITLE_GENERATE_TIMEOUT}
      sandbox_storage:
        domain: ${APPLICATION_CLOUD_AGENT_FILE_SYSTEM_DOMAIN}
        token_request_signature_key: ${APPLICATION_CLOUD_AGENT_FILE_SYSTEM_SIGN_KEY}
        file_token_expire_time: 24h
        token_ttl: 30m
        request_timeout: 10s
        path: ${APPLICATION_CLOUD_AGENT_FILE_SYSTEM_PATH}
        token_tag: ${APPLICATION_CLOUD_AGENT_FILE_SYSTEM_TOKEN_TAG}
      snapshot_storage: ${APPLICATION_CLOUD_AGENT_SNAPSHOT_STORAGE}
    admin_app: ${APPLICATION_ADMIN_APP}

  chat_zh-CN.json: |
    {
      "抱歉，您这个问题我暂时无法回答，建议您换一个问题试试呢！": "抱歉，您这个问题我暂时无法回答，建议您换一个问题试试呢！",
