{{- /* global.clb 为 IP 时，K8s 校验不允许 spec.rules[].host 填写 IP，需省略 host（即匹配所有 Host） */ -}}
{{- $isIP := regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" (.Values.global.clb | toString) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  generation: 1
  labels:
    app.kubernetes.io/managed-by: Helm
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: nginx
  rules:
  {{- if $isIP }}
  - http:
  {{- else }}
  - host: {{ .Values.global.clb }}
    http:
  {{- end }}
      paths:
      - backend:
          service:
            name: {{ .Release.Name }}
            port:
              number: 9099
        path: /adp/v2/chat
        pathType: ImplementationSpecific