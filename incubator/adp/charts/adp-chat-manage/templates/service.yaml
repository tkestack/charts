apiVersion: v1
kind: Service
metadata:
  labels:
    app: adp-chat-manage
  name: adp-chat-manage
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: tcp-9090
      port: 9090
      protocol: TCP
      targetPort: 9090
    - name: tcp-9091
      port: 9091
      protocol: TCP
      targetPort: 9091
    - name: tcp-9099
      port: 9099
      protocol: TCP
      targetPort: 9099
    - name: tcp-8081
      port: 8081
      protocol: TCP
      targetPort: 8081
    - name: tcp-9190
      port: 9190
      protocol: TCP
      targetPort: 9190
    - name: adp-chat-manage-9092
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: adp-chat-manage-9093
      port: 9093
      protocol: TCP
      targetPort: 9093
    - name: adp-chat-manage-9094
      port: 9094
      protocol: TCP
      targetPort: 9094
  selector:
    app: adp-chat-manage
  type: ClusterIP
