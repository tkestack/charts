  trpc_go.yaml: |
    global: #全局配置
      namespace: default
      env_name: tcs                        #环境名称，非正式环境下多环境的名称
      container_name: ${POD_NAME}                    #容器名称
      local_ip: ${POD_IP}                            #本地IP，容器内为容器ip，物理机或虚拟机为本机ip
      admin_port: 18888                              #管理命令服务端口
      enable_set: false                      #是否启用set
      full_set_name: adp                     #set名
    server:                                            #服务端配置
      app: adp                                 #业务的应用名
      server: AIConfManagerServer                           #进程服务名
      bin_path: /app/bin/                   #二进制可执行文件和框架配置文件所在路径
      conf_path: /app/conf/                 #业务配置文件所在路径
      data_path: /app/data/                 #业务数据文件所在路径
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - simpledebuglog
        - recovery                                     #拦截框架创建的业务处理协程panic
      admin:
        ip: ${POD_IP}                                  # 必须填外部可访问的ip, 不能填127.0.0.1
        port: 18888                                    # admin 端口
        read_timeout: 3000                             #ms. 请求被接受到请求信息被完全读取的超时时间设置，防止慢客户端
        write_timeout: 60000                           #ms. 处理的超时时间
      service:                                         #业务服务提供的service，可以有多个
        - name: trpc.adp.AIConfManagerServer.AIConfManagerHttp #把ReplaceMe换成自己服务pb里的service名
          network: tcp                                 #网络监听类型  tcp udp
          protocol: http                               #应用层协议 trpc http
          timeout: 5000                                #请求最长处理时间 单位 毫秒
          ip: ${POD_IP}                                #服务监听ip地址 可使用占位符 ${ip},ip和nic二选一，优先ip
          port: 10001                                  #服务监听端口
        - name: trpc.adp.AIConfManagerServer.AIConfManager #把ReplaceMe换成自己服务pb里的service名
          network: tcp                                 #网络监听类型  tcp udp
          protocol: trpc                               #应用层协议 trpc http
          timeout: 5000                                #请求最长处理时间 单位 毫秒
          ip: ${POD_IP}                                #服务监听ip地址 可使用占位符 ${ip},ip和nic二选一，优先ip
          port: 10002                                  #服务监听端口
    plugins:                                           #插件配置
      log:
        default:
          - writer: file
            level: info
            caller_skip: 2
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
          - writer: console
            level: info
            caller_skip: 2
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
      telemetry:
        tpstelemetry:  # 或者tpstelemetry
          addr: {{ .Values.global.observability.apm.otlp}}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if .Values.global.observability.apm.registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if .Values.global.observability.apm.attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
            - key: {{ $key }}
              value: {{ $value }}
              {{- end }}
          {{- end }}


    client:                                            #客户端调用的后端配置
      namespace: default
      filter:
        - tpstelemetry
      timeout: 5000                                    #针对所有后端的请求最长处理时间
      service:                                         #针对单个后端的配置，默认都有默认值，可以完全不用配置
        - callee: trpc.VirtualHuman.virtualmanconfig.virtualmanInstance
          name:  trpc.VirtualHuman.access.AccessService
          env_name: tcs
        - name: trpc.KEP.bot_admin_config_server.Api
          callee: trpc.KEP.bot_admin_config_server.Api
          target: ip://adp-app-admin-proxy.{{ .Release.Namespace }}.svc.cluster.local:9092
          protocol: trpc
          network: tcp
          timeout: 4000