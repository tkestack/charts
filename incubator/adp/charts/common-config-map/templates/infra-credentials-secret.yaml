kind: Secret
apiVersion: v1
metadata:
  name: infra-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    # 保留 hook 方式：保证在 data-init Job（pre-install/pre-upgrade hook, weight 1）之前创建，
    # 避免 Job Pod 因找不到 infra-credentials 而 CreateContainerConfigError。
    # weight 设为 -20，确保早于 data-init 的 SA/Role/RoleBinding（weight -2）及 Job（weight 1）创建。
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
stringData:
  # ===== DB =====
  INFRA_MIDDLEWARES_DB_0_VENDOR: {{ .Values.global.components.db.vendor | quote }}
  INFRA_MIDDLEWARES_DB_0_PROVIDERTYPE: {{ .Values.global.components.db.providerType | quote }}
  INFRA_MIDDLEWARES_DB_0_HOST: {{ .Values.global.components.db.host | quote }}
  INFRA_MIDDLEWARES_DB_0_PORT: {{ .Values.global.components.db.port | quote }}
  INFRA_MIDDLEWARES_DB_0_USER: {{ .Values.global.components.db.user | quote }}
  INFRA_MIDDLEWARES_DB_0_PASSWORD: {{ .Values.global.components.db.password | quote }}
  # ===== Redis =====
  INFRA_MIDDLEWARES_REDIS_0_VENDOR: {{ .Values.global.components.redis.vendor | quote }}
  INFRA_MIDDLEWARES_REDIS_0_PROVIDERTYPE: {{ .Values.global.components.redis.providerType | quote }}
  INFRA_MIDDLEWARES_REDIS_0_CLUSTER: {{ .Values.global.components.redis.cluster | quote }}
  INFRA_MIDDLEWARES_REDIS_0_HOSTS: {{ index .Values.global.components.redis.hosts 0 | quote }}
  INFRA_MIDDLEWARES_REDIS_0_PORT: {{ .Values.global.components.redis.port | quote }}
  INFRA_MIDDLEWARES_REDIS_0_PASSWORD: {{ .Values.global.components.redis.password | quote }}
  # ===== ES =====
  INFRA_MIDDLEWARES_ES_0_VENDOR: {{ .Values.global.components.es.vendor | quote }}
  INFRA_MIDDLEWARES_ES_0_PROVIDERTYPE: {{ .Values.global.components.es.providerType | quote }}
  INFRA_MIDDLEWARES_ES_0_HOSTS: {{ index .Values.global.components.es.hosts 0 | quote }}
  INFRA_MIDDLEWARES_ES_0_PORT: {{ .Values.global.components.es.port | quote }}
  INFRA_MIDDLEWARES_ES_0_USER: {{ .Values.global.components.es.user | quote }}
  INFRA_MIDDLEWARES_ES_0_PASSWORD: {{ .Values.global.components.es.password | quote }}
  # ===== Kafka =====
  INFRA_MIDDLEWARES_KAFKA_0_VENDOR: {{ .Values.global.components.kafka.vendor | quote }}
  INFRA_MIDDLEWARES_KAFKA_0_PROVIDERTYPE: {{ .Values.global.components.kafka.providerType | quote }}
  INFRA_MIDDLEWARES_KAFKA_0_HOSTS: {{ index .Values.global.components.kafka.hosts 0 | quote }}
  INFRA_MIDDLEWARES_KAFKA_0_PORT: {{ .Values.global.components.kafka.port | quote }}
  # ===== ClickHouse =====
  INFRA_MIDDLEWARES_CLICKHOUSE_0_VENDOR: {{ .Values.global.components.clickhouse.vendor | quote }}
  INFRA_MIDDLEWARES_CLICKHOUSE_0_PROVIDERTYPE: {{ .Values.global.components.clickhouse.providerType | quote }}
  INFRA_MIDDLEWARES_CLICKHOUSE_0_HOSTS: {{ index .Values.global.components.clickhouse.hosts 0 | quote }}
  INFRA_MIDDLEWARES_CLICKHOUSE_0_PORT: {{ .Values.global.components.clickhouse.port | quote }}
  INFRA_MIDDLEWARES_CLICKHOUSE_0_USER: {{ .Values.global.components.clickhouse.user | quote }}
  INFRA_MIDDLEWARES_CLICKHOUSE_0_PASSWORD: {{ .Values.global.components.clickhouse.password | quote }}
  # ===== S3/COS =====
  # STS 主凭证：始终注入，供已 STS 化的服务
  # 通过 ADP_ASSUME_ROLE_SECRET_ID/KEY 调 STS 换临时凭证使用。
  ADP_ASSUME_ROLE_SECRET_ID: {{ .Values.global.components.s3.cos.secretId | quote }}
  ADP_ASSUME_ROLE_SECRET_KEY: {{ .Values.global.components.s3.cos.secretKey | quote }}
  # 长期 AK：仅在未启用 STS 时下发。enableSts=true 时置空，
  # 防止服务误用长期凭证直接访问 COS（安全兜底）。
  {{- if .Values.global.components.s3.cos.enableSts }}
  INFRA_MIDDLEWARES_S3_COS_SECRETID: ""
  INFRA_MIDDLEWARES_S3_COS_SECRETKEY: ""
  {{- else }}
  INFRA_MIDDLEWARES_S3_COS_SECRETID: {{ .Values.global.components.s3.cos.secretId | quote }}
  INFRA_MIDDLEWARES_S3_COS_SECRETKEY: {{ .Values.global.components.s3.cos.secretKey | quote }}
  {{- end }}
  # ===== RSA =====
  INFRA_MIDDLEWARES_RSA_PUBLICKEY: {{ .Values.global.rsa.publicKey | quote }}
  INFRA_MIDDLEWARES_RSA_PRIVATEKEY: {{ .Values.global.rsa.privateKey | quote }}
  # ===== Content Security =====
  INFRA_MIDDLEWARES_CONTENTSECURITY_SECRETID: {{ .Values.global.contentSecurity.secretId | quote }}
  INFRA_MIDDLEWARES_CONTENTSECURITY_SECRETKEY: {{ .Values.global.contentSecurity.secretKey | quote }}