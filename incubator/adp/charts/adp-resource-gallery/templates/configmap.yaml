  client.yaml: |
    client:
      namespace: ${POD_NAMESPACE}
      filter:
        - cle-route-propagator
      service:
        - name: mysql.qbot.admin
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=1s&parseTime=true&interpolateParams=true&loc=Local"
        - name: tdsql.qbot.qbot
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_robot?charset=utf8mb4&timeout=10s&readTimeout=30s&writeTimeout=30s&parseTime=true&loc=Local"
        - name: tdsql.qbot.openclaw
          target: "dsn://${INFRA_MIDDLEWARES_DB_0_USER}:${INFRA_MIDDLEWARES_DB_0_PASSWORD}@tcp(${INFRA_MIDDLEWARES_DB_0_HOST}:${INFRA_MIDDLEWARES_DB_0_PORT})/db_llm_openclaw?charset=utf8mb4&timeout=10s&readTimeout=30s&writeTimeout=30s&parseTime=true&loc=Local"
        - name: redis.qbot.admin
          target: "redis://:${INFRA_MIDDLEWARES_REDIS_0_PASSWORD}@${INFRA_MIDDLEWARES_REDIS_0_HOSTS}:6379/2"
          timeout: 3000
        - callee: trpc.KEP.agent_config_server.AgentConfigApi
          name: trpc.KEP.agent-config-server.AgentConfigApi
          target: "ip://adp-agent-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: Production
          protocol: trpc
          timeout: 20000
        - name: trpc.adp.ai_gateway.Admin
          namespace: Production
          network: tcp
          protocol: trpc
          target: "ip://adp-ai-gateway.{{ .Release.Namespace }}.svc.cluster.local:9092"
          timeout: 2000
        - name: qbot.finance.finance.Finance
          target: "ip://adp-platform-charger.{{ .Release.Namespace }}.svc.cluster.local:9090"
          namespace: Production
          network: tcp
          protocol: trpc
          timeout: 30000
        - name: trpc.adp.ai-gateway.api
          namespace: Production
          network: tcp
          timeout: 4500000
          target: "ip://adp-ai-gateway.{{ .Release.Namespace }}.svc.cluster.local:9090"
          protocol: http
        - callee: trpc.KEP.plugin_config_server.PluginConfigApi
          name: trpc.KEP.plugin-config-server.PluginConfigApi
          target: "ip://adp-plugin-config.{{ .Release.Namespace }}.svc.cluster.local:8001"
          namespace: Production
