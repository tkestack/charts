        "KeyModelDesc_deepseek-deepseek-v4-pro": "1.6T总参数，49B激活参数MoE混合专家旗舰模型，在百万级超长上下文下精准驾驭复杂编程、深度推理与高精度知识问答等全链路高难度任务。",
        "KeyModelDesc_deepseek-deepseek-v4-pro-202606": "由 DeepSeek 直接提供的 DeepSeek V4 Pro 模型服务，该模型不适用《腾讯云智能体开发平台服务等级协议》的约定，ADP不对服务可用率进行承诺。使用该模型即视为您已知晓并同意遵守 DeepSeek 的服务协议，请您在使用前务必仔细阅读其中使用规范、数据处理规则、用户责任义务等相关内容（https://cdn.deepseek.com/policies/zh-CN/deepseek-terms-of-use.html），如不接受上述内容，请您立即停止使用。",
        "KeyModelDesc_hunyuan-hy3-preview": "采用高能效 MoE 架构，支持从对话智能切换至AGENT智能，灵活适配从日常高频交互到复杂长程工程任务的全场景需求。",
        "KeyModelDesc_hunyuan-role-latest": "混元最新版角色扮演模型，混元官方精调训练推出的角色扮演模型，基于混元模型结合角色扮演场景数据集进行增训，在角色扮演场景具有更好的基础效果。",
        "KeyModelDesc_hy-vision-2.0-instruct": "快思考模型，适用通用图生文场景。相比上代模型在基础感知、内容识别、知识、OCR、STEM、推理、图表理解等维度有明显提升。",
        "KeyModelDesc_tcadp-Gemini-3.0-flash": "Google 推出的低延迟推理模型，兼顾响应速度与推理质量，适用于通用对话、智能助手及实时交互任务",
        "KeyModelDesc_tcadp-claude-opus-4.6": "Anthropic 最强推理模型,擅长复杂分析和长文本理解",
        "KeyModelDesc_tcadp-gemini-3.1-flash-lite": "Google 轻量级快速响应模型,适合对话和快速推理",
        "KeyModelDesc_tcadp-gemini-3.1-pro": "Google 最新旗舰多模态模型,在推理、编码、图像理解等方面表现卓越",
        "KeyModelDesc_tcadp-glm-5v-turbo": "GLM-5V-Turbo 是智谱首个多模态 Coding 基座模型，面向视觉编程任务打造。能够原生处理图片、视频、文本等多模态输入，同时擅长长程规划、复杂编程和动作执行；深度适配 Agent 工作流，能够与 Claude Code、OpenClaw 等 Agent 深度协同。",
        "KeyModelDesc_tcadp-glm-5.0-turbo": "面向真实 Agent 长链路任务深度优化的模型，重点提升了复杂指令拆解、工具调用、定时持续执行与长任务稳定性。",
        "KeyModelDesc_tcadp-glm-5.1": "智谱最新旗舰基座模型，擅长复杂逻辑推理、长程任务执行与代码生成，支持深度思考模式与 Function Call，可用于高阶 Agent 任务编排与 Agentic Coding 场景。",
