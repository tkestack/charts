        "KeyModelDesc_tcadp-gpt-5.5": "OpenAI 迄今最智能的模型，速度更快、功能更强，专为处理编程、研究以及跨工具数据分析等复杂任务而打造。",
        "KeyModelDesc_tcadp-kimi-k2.6": "支持图片、文本和视频输入的多模态模型，在长程代码任务中表现突出，面对不同编程语言和任务场景均具备可靠的泛化能力。",
        "KeyModelDesc_tcadp-kimi-k3": "Kimi K3是月之暗面（Moonshot）发布的开源SOTA旗舰大模型，基于KDA混合线性注意力机制（Kimi Delta Attention）与注意力残差技术构建，原生支持视觉理解（视频/图片/文本输入），拥有100万token上下文窗口，支持工具调用、结构化输出与深度思考。",
        "KeyModelDesc_tcadp-minimax-m2.7": "MiniMax 推出的自我进化大语言模型，具备卓越的软件工程能力和专业办公能力，支持复杂 Agent 交互与端到端项目交付。",
        "KeyModelDesc_tcadp-qwen3.5-flash": "Qwen3.5原生视觉语言系列Flash模型，基于混合架构设计，融合了线性注意力机制与稀疏混合专家模型，实现了更高的推理效率。模型效果在纯文本与多模态方面相较3系列均实现飞跃式进步；响应速度快，兼具推理速度和性能",
        "KeyModelDesc_tcadp-qwen3.5-plus": "Qwen3.5原生视觉语言系列Plus模型，基于混合架构设计，融合了线性注意力机制与稀疏混合专家模型，实现了更高的推理效率。",
        "KeyModelDesc_tongyi-embedding-vision-plus": "由阿里云通义实验室推出的通用多模态向量化模型，能够将文本和图片转换为高质量的语义向量，适用于跨模态检索、语义相似度计算、内容分类与聚类等场景。",
        "KeyModelDesc_yt-vita": "VITA是一款多模态理解模型，支持对视频和图片内容进行分析，可用于视频结构解析、图像目标检测等场景",
