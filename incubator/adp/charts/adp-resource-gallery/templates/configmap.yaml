kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-resource-gallery
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    cache_limit:
      corp_expire: 720h
      staff_expire: 120h
      intent_expire: 120h
      app_expire: 120h
      model_expire: 120h
    tione:
      secret_id: ${TIONE_SECRET_ID}
      secret_key: ${TIONE_SECRET_KEY}
      region: ${TIONE_REGION}
      sts_host: ${TIONE_STS_HOST}
      tione_host: ${TIONE_HOST}
      service_role_name: ADP_QCSLinkedRoleInTIONE
      tione_regions: ${TIONE_REGIONS}
      tione_enable_white: ${TIONE_ENABLE_WHITE}
      tione_white_uin: ${TIONE_WHITE_UIN}
      disabled: ${TIONE_DISABLED}
    model_hub:
      model_type: llm
      model_params:
        - name: temperature
          max: 2
          min: 0
          default: 0.7
        - name: top_p
          max: 1
          min: 0
          default: 1
        - name: seed
          max: 10000
          min: 0
          default: 1024
        - name: presence_penalty
          max: 2
          min: -2
          default: 0
        - name: frequency_penalty
          max: 2
          min: -2
          default: 0
        - name: repetition_penalty
          max: 2
          min: 1
          default: 1
        - name: max_tokens
          max: 262144
          min: 1
          default: 4096
      model_tags:
        - KeyModelTagOmniModal
      model_properties:
        model_length: 64k
        input_length: 57344
      model_category_to_tags:
        generate: ["KeyModelTagTextReasoning", "KeyModelTagToolCalling", "KeyModelTagOmniModal"]
        thought: ["KeyModelTagTextReasoning", "KeyModelTagToolCalling", "KeyModelTagOmniModal"]
        standard_thought: ["KeyModelTagTextReasoning", "KeyModelTagToolCalling", "KeyModelTagOmniModal"]
        agent_thought: ["KeyModelTagTextReasoning", "KeyModelTagToolCalling", "KeyModelTagOmniModal"]
        rewrite: ["KeyModelTagTextReasoning", "KeyModelTagToolCalling", "KeyModelTagOmniModal"]
        rerank: ["KeyModelTagRerankingModel"]
        embedding: ["KeyModelTagVectorModel"]
        widget: ["KeyModelTagTextReasoning"]
        openclaw: ["KeyModelTagTextReasoning", "KeyModelTagToolCalling", "KeyModelTagOmniModal"]
        multi_modal_embedding:
        - KeyModelTagImageVector
        corp_assistant:
        - KeyModelTagTextReasoning
        - KeyModelTagToolCalling
        - KeyModelTagOmniModal
      enable_scene_categories:
        - multi_modal_qa
        - multi_modal_understanding
        - ai_optimize
        - long_memory
        - nl2sql
        - graphrag
      embedding_limit:
        enable: true
        max_vector_dimension: 4096
        default_vector_dimension: 1024
      model_finance_free_white: ${MODEL_FINANCE_FREE_WHITE}
      model_reply_format: ${MODEL_REPLY_FORMAT}
      check_models_before_delete: true
      temporary_free_models: ${TEMPORARY_FREE_MODELS}
      model_access_control: ${MODEL_ACCESS_CONTROL}
      model_sync:
        extra_model_names: ${EXTRA_MODEL_NAMES}
      custom_model_allowed_params: ${CUSTOM_MODEL_ALLOWED_PARAMS}
      exposed_model_properties: ${EXPOSED_MODEL_PROPERTIES}
      exposed_model_parameters: ${EXPOSED_MODEL_PARAMETERS}
    robot_default:
      app_default_model:
        knowledge_qa: ${APP_DEFAULT_MODEL_KNOWLEDGE_QA}
      app_thought_model:
        standard: ${APP_THOUGHT_MODEL_STANDARD}
        agent: ${APP_THOUGHT_MODEL_AGENT}
      app_rewrite_model: ${APP_REWRITE_MODEL}
      app_rerank_model: ${APP_RERANK_MODEL}
      app_embedding_model: ${APP_EMBEDDING_MODEL}
      app_widget_model: ${APP_WIDGET_MODEL}
      app_fileparse_model: ${APP_FILEPARSE_MODEL}
      app_openclaw_model: ${APP_OPENCLAW_MODEL}
      llm_word_limit: ${LLM_WORD_LIMIT}
      search_model_free: ${SEARCH_MODEL_FREE}
      llm_support_ai_call: ${LLM_SUPPORT_AI_CALL}
      default_model_config: ${DEFAULT_MODEL_CONFIG}
      corp_assistant_model: ${CORP_ASSISTANT_MODEL}
      extra_model_config: ${EXTRA_MODEL_CONFIG}
    finance:
      disabled: ${FINANCE_DISABLED}
      search_disabled: ${SEARCH_DISABLED}
    limit_config_info:
      expire: 4m
      max_unlock_retry: 3
      try_lock_interval: 50ms
      concurrency_key_expire: 1800
    experience_uin: 999999999
    managed_account_ids: ${MANAGED_ACCOUNT_IDS}
    language_all_switch: ${LANGUAGE_ALL_SWITCH}
    deep_think_enable_model: ${DEEP_THINK_ENABLE_MODEL}
    permission_app_category:
      - permission_id: lkeRepository
        app_type: knowledge_qa
        name: 知识库问答
        logo: /qbot/public/app-icon-knowledge_qa.png
      - permission_id: lkeSummary
        app_type: summary
        name: 知识摘要
        logo: /qbot/public/app-icon-summary.png
      - permission_id: lkeClassify
        app_type: classify
        name: 标签提取
        logo: /qbot/public/app-icon-classify.png
    cipher_config:
      default_version: 1
      iv: "hBb3Ls3edFBzYyrpQzTGSA=="
      versions:
        1: "Od3J9Ig47ztUpmdqfkRcAqXhqE7dlWHYLOFK/NDA+yU="
        2: "1ofPtcXorwOy8r74H9DYO5ZMxoTFWdTZVf0bxv5zKqQ="
        3: "woEahOi+Bo6ejhBm2DqJL9wcVzQmoOx+lEE0DjYAaVo="
    prompt_version:
      max_limit: 50
      max_version: 20
    model_uin_white: ${MODEL_UIN_WHITE}
    quota_model: ${QUOTA_MODEL}
    resource_config: ${RESOURCE_CONFIG}
    openclaw_config:
      default_name: ${OPENCLAW_DEFAULT_NAME}
      icon_url_regex: ${OPENCLAW_ICON_REGEX}
      instance:
        password: ${OPENCLAW_INSTANCE_PASSWORD}
        create_regions: ${OPENCLAW_CREATE_REGIONS}
        region_map: ${OPENCLAW_CREATE_REGION_MAP}
        package_bundle_map: ${OPENCLAW_PACKAGE_BUNDLE_MAP}
      async_config: ${OPENCLAW_CREATE_ASYNC_CONFIG}
      credential:
        secret_id: ''
        secret_key: ''
      model_config: ${OPENCLAW_MODEL_CONFIG}
      channel_config: ${OPENCLAW_CHANNEL_CONFIG}
      skill_required_config: ${SKILL_REQUIRED_CONFIG}
      skill_template_config: ${OPENCLAW_SKILL_TEMPLATE_CONFIG}
      wx_kf: ${OPENCLAW_WX_KF}
      watch_skill_status_max_seconds: 120
      skill_desc_max_length: 100
      provider_guide_config: ${PROVIDER_GUIDE_CONFIG}
    api_key_config: ${API_KEY_CONFIG}
    adp_cloud:
      model_list_url: "https://api.adp.cloud.tencent.com/v1/model/list"
    connectivity_test:
      default_max_tokens: 100
      uin_max_tokens: ${CONNECTIVITY_TEST_UIN_MAX_TOKENS}
    ioa_model_black: ${IOA_MODEL_BLACK}
    ioa_model_black_mapping: ${IOA_MODEL_BLACK_MAPPING}
    ioa_model_black_scene_mapping: ${IOA_MODEL_BLACK_SCENE_MAPPING}
    ioa_model_black_fallback: ${IOA_MODEL_BLACK_FALLBACK}
    api_key_access_log_config: ${API_KEY_ACCESS_LOG_CONFIG}
    gray_model_uin_white: ${GRAY_MODEL_UIN_WHITE}
    model_package_types: ${MODEL_PACKAGE_TYPES}
    model_providers: ${MODEL_PROVIDERS}
    corp_assistant_var: ${CORP_ASSISTANT_VAR}
    overseas_model_whitelist:
      models: ${OVERSEAS_MODELS}
      whitelist_uins: ${OVERSEAS_MODEL_WHITELIST_UINS}


    quota:
      public_key: ${QUOTA_PUBLIC_KEY}
      token: ${QUOTA_SIGNED_TOKEN}
  biz_zh-CN.json: |
    {
        "KeyModelConnectivityErr": "模型连通性错误:%s",
        "KeyProviderAliasNameYoutu": "腾讯优图",
        "KeyProviderAliasNameHunyuan": "腾讯混元",
        "KeyProviderAliasNameQwen": "通义千问",
        "KeyProviderAliasNameBaichuan": "百川智能",
        "KeyProviderAliasNameZhipu": "智谱AI",
        "KeyProviderAliasNameOpenAI": "OpenAI Compatible",
        "KeyProviderAliasNameMoonshot": "月之暗面",
        "KeyProviderAliasNameDeepSeek": "深度求索",
        "KeyProviderAliasNameMinimax": "Minimax",
        "KeyProviderAliasNameStepfun": "阶跃星辰",
        "KeyProviderAliasNameVolcengine": "火山引擎",
        "KeyProviderAliasNameTIONE": "腾讯云TI-ONE",
        "KeyProviderAliasNameYi": "零一万物",
        "KeyProviderAliasNameOfficial": "OpenAI",
        "KeyProviderAliasNameAnthropic": "ANTHROPIC",
        "KeyProviderAliasNameXAI": "xAI",
        "KeyProviderAliasNameGemini": "Gemini",
        "KeyProviderAliasNameAliyunFileParse": "阿里云文档解析",
        "KeyProviderAliasNameADP": "ADP DocParsing Protocol",
        "KeyProviderAliasNameTCADP": "平台托管三方模型",
        "KeyProviderDescHunyuan": "腾讯全链路自研的通用大模型，具备强大的中文理解、逻辑推理及多模态能力代表模型有混元Turbo系列等。",
        "KeyProviderDescYoutu": "专注于人工智能领域的前沿技术研究和产业实践落地，涵盖了视觉感知理解、大语言模型、多模态理解和生成、计算加速等技术研究领域。",
        "KeyProviderDescQwen": "通义千问具备多语言与多模态理解、逻辑推理、代码生成、文档处理及音视频理解能力，并积极构建开源生态，代表模型有Qwen系列等",
        "KeyProviderDescZhipu": "源自清华大学，致力于新一代认知智能通用模型研发，其GLM系列模型在推理、长上下文处理、多语言、多模态能力方面表现突出，代表模型有GLM-4系列等",
        "KeyProviderDescStepfun": "多模态AGI先锋，专注于视觉、语音、视频全栈能力，在推理、代码、数学和知识方面表现突出，代表模型有Step-2等",
        "KeyProviderDescBaichuan": "致力于构建优秀的大模型底座，其Baichuan系列模型在长文本处理、多模态理解、数学和代码能力方面表现突出，代表模型有Baichuan4系列等",
        "KeyProviderDescOpenAI": "支持通过兼容OpenAI API协议的方式，灵活接入各类自定义或第三方大模型服务",
        "KeyProviderDescVolcengine": "火山引擎推出的一站式大模型服务平台，提供模型训练、推理、评测、精调等全流程服务，支持多模态理解、长上下文窗口和强大的推理能力，并集成了豆包大模型等多种主流模型",
        "KeyProviderDescMoonshot": "专注于通用人工智能领域，旗下模型支持超长上下文，并具备强大的Agent能力和多模态理解与生成能力，代表模型有Kimi K2等",
        "KeyProviderDescDeepSeek": "专注于通用人工智能底层模型与技术研究，以开源、高性能和卓越推理能力著称，代表模型有DeepSeek-R1（推理模型）和DeepSeek-V3（MoE架构，兼具性能与成本效益）",
        "KeyProviderDescMinimax": "领先的通用人工智能科技公司，自主研发多模态大模型，在长上下文处理、推理、代码和多模态理解与生成方面表现突出，代表模型有M1系列模型等。",
        "KeyProviderDescTIONE": "腾讯云为AI工程师打造的一站式机器学习平台，提供从数据接入、模型训练、模型管理到模型服务的全流程开发支持，支持多种训练方式和算法框架，并内置大模型库。",
        "KeyProviderDescYi": "由李开复博士创办，其Yi系列模型在代码、数学、推理和指令遵循能力上表现出色，并在全球开源评测中取得优异成绩，代表模型有Yi-Lightning等",
        "KeyProviderDescOfficial": "OpenAI提供的模型，例如GPT-4、GPT5等。",
        "KeyProviderDescAnthropic": "Anthropic提供的Claude系列模型",
        "KeyProviderDescXAI": "xAI 提供的LLMs，xAI是一家致力于研发人工智能（AI）以加速人类科学发现的公司。",
        "KeyProviderDescGemini": "谷歌提供的Gemini模型",
        "KeyProviderDescAliyunFileParse": "阿里云文档解析服务",
        "KeyProviderDescADPDocParsing": "ADP定义的文档解析标准协议，用户根据ADP的文档解析协议标准接入第三方文档解析模型。",
        "KeyModelDesc_sn-edu-13b": "基于教育领域数据专项训练，适用于英语口语对话练习和教案场景。英语口语陪练场景中，支持教材课后对话练习、对话难度设定、语法分析等能力；教案场景中，支持教案生成、教案润色、教案题目生成。",
        "KeyModelDesc_hunyuan": "万亿级参数规模 MOE-32k 长文模型，具备复杂数学能力，支持 functioncall，在多语言翻译、金融法律医疗等领域应用重点优化。",
        "KeyModelDesc_finance-13b": "基于金融领域数据进行预训练和精调训练，擅长金融领域知识问答，适用于投资知识问答、金融产品问答等应用场景。",
        "KeyModelDesc_medical-6b": "基于医疗领域数据专项强化，擅长医疗领域知识问答，适用于医学实体抽取、医学对话总结、病历撰写等应用场景。",
        "KeyModelDesc_sn-edu-70b": "基于教育领域数据专项训练，适用于对于英语口语对话练习自然度和任务遵循程度、教案生成丰富度的效果表现有需求的场景。",
        "KeyModelDesc_hunyuan-turbo": "采用全新的混合专家模型（MoE）结构，相比混元大模型高级版推理效率更快，效果表现更强。",
        "KeyModelDesc_hunyuan-13B": "采用更优的路由策略，同时缓解了负载均衡和专家趋同的问题， 性价比相对更高，在平衡效果、价格的同时，可对实现对长文本输入的处理。",
        "KeyModelDesc_function-call-pro": "具备任务规划、工具选择调用以及反思纠错能力，能够支持复杂问题的规划与执行。",
        "KeyModelDesc_cs-normal-70b": "针对企业知识问答场景精调训练，擅长多模态知识问答，适合图文表答案关联输出、数学计算、逻辑推理、表格问答等复杂场景有需求的场景。",
        "KeyModelDesc_hunyuan-standard-256K": "采用更优的路由策略，同时缓解了负载均衡和专家趋同的问题。长文方面，大海捞针指标达到99.9%。MOE-256k 在长度和效果上进一步突破，极大的扩展了可输入长度。",
        "KeyModelDesc_hunyuan-role": "混元最新版角色扮演模型，混元官方精调训练推出的角色扮演模型，基于混元模型结合角色扮演场景数据集进行增训，在角色扮演场景具有更好的基础效果。",
        "KeyModelDesc_HY-Vision1.5-Instruct": "效果全面显著升级，图像识别、创作、推理全面提升。支持发图秒回答、实体识别更精准、看图解题更高效。",
        "KeyModelDesc_workflow-pro": "适用于同时配置问答、文档、工作流的场景，意图识别效果更佳，并且支持在角色指令中自定义配置意图。但可能会增加一定的对话耗时。",
        "KeyModelDesc_lke-deepseek-v3-function-call": "DeepSeek-V3模型最新版本，基于创新的混合专家（MoE）架构与多头潜在注意力（MLA）技术，在推理能力、代码生成和中文语义理解三大核心领域实现全面升级。",
        "KeyModelDesc_lke-deepseek-v3-0324": "DeepSeek-V3模型最新版本，基于创新的混合专家（MoE）架构与多头潜在注意力（MLA）技术，在推理能力、代码生成和中文语义理解三大核心领域实现全面升级。",
        "KeyModelDesc_lke-deepseek-r1": "强化学习（RL）驱动的推理模型，在数学、代码和推理任务中与 OpenAI-o1 表现相当。与DeepSeek助手深度思考模式为同款模型",
        "KeyModelDesc_lke-deepseek-r1-0528": "DeepSeek-R1模型最新版，在理解意图、文案生成、编程能力和逻辑推理方面均有显著提升。能更好地理解复杂指令中的约束条件和内在逻辑。支持长时思考，可以胜任更复杂、耗时的任务。",
        "KeyModelDesc_lke-deepseek-v3": "拥有6710 亿参数的混合专家（MoE）语言模型，采用多头潜在注意力（MLA）和 DeepSeekMoE 架构，结合无辅助损失的负载平衡策略，优化推理和训练效率。",
        "KeyModelDesc_lke-deepseek-r1-0528-agent": "DeepSeek-R1模型最新版，在理解意图、文案生成、编程能力和逻辑推理方面均有显著提升。能更好地理解复杂指令中的约束条件和内在逻辑。支持长时思考，可以胜任更复杂、耗时的任务。",
        "KeyModelDesc_lke-deepseek-v3-agent": "DeepSeek-V3模型最新版本，基于创新的混合专家（MoE）架构与多头潜在注意力（MLA）技术，在推理能力、代码生成和中文语义理解三大核心领域实现全面升级。",
        "KeyModelDesc_cs-normal": "针对企业知识问答场景精调训练，擅长多模态知识问答。性价比相对更高，适合需要同时平衡效果、价格的场景。",
        "KeyModelDesc_lke-deepseek-v3.1": "采用混合推理架构，具备更高的思考效率，能在更短时间给出答案。在需要多步推理的复杂搜索测试与多学科专家级难题测试上，性能已大幅提升。",
        "KeyModelDesc_lke-deepseek-v3.1-function-call": "采用混合推理架构，具备更高的思考效率，能在更短时间给出答案。在需要多步推理的复杂搜索测试与多学科专家级难题测试上，性能已大幅提升。",
        "KeyModelDesc_sn-large-multi-language-v0.2.5": "通用向量检索模型",
        "KeyModelDesc_sn-llm-embedding-2b-v0.2.2": "LLM增强向量检索模型，准确率更高，耗时将会有所增加。",
        "KeyModelDesc_sn-reranker-large-v0.4": "通用文本排序模型",
        "KeyModelDesc_sn-llm-reranker-2b-v0.2": "LLM 增强排序模型，准确率更高，耗时将会有所增加。",
        "KeyModelDesc_cs-normal-70b-1.1": "针对企业知识问答场景精调训练，擅长多模态知识问答，适合图文表答案关联输出、数学计算、逻辑推理、表格问答等复杂场景有需求的场景。",
        "KeyModelDesc_hunyuan-turbos": "混元旗舰大模型最新版本，具备更强的思考能力，更优的体验效果",
        "KeyModelDesc_hunyuan-t1": "业内首个超大规模Hybrid-Transformer-Mamba 推理模型，扩展推理能力，超强解码速度，进一步对齐人类偏好。",
        "KeyModelDesc_hunyuan-2.0-thinking-251109": "适用于深度推理任务，比如，复杂的数理逻辑计算、代码生成、科学问题求解以及需要较强指令遵循的场景。",
        "KeyModelDesc_hunyuan-2.0-instruct-251111": "适用于通用对话任务，比如，日常多轮对话、角色扮演、创意写作以及需要较高上下文理解能力的场景。",
        "KeyModelDesc_lke-deepseek-v3.1-terminus": "采用混合推理架构，具备更高的思考效率，能在更短时间给出答案，需要多步推理的复杂搜索测试与多学科专家级难题测试上，性能已大幅提升。输出效果相比前一版本更加稳定。",
        "KeyModelDesc_zhipuint-glm-5": "智谱最新旗舰模型，可端到端完成大型任务，擅长复杂系统工程与长程 Agent 任务",
        "KeyModelDesc_tcadp-glm-5": "智谱最新旗舰模型，可端到端完成大型任务，擅长复杂系统工程与长程 Agent 任务",
        "KeyModelDesc_tcadp-kimi-k2.5": "Kimi K2.5 支持文本与视觉输入，兼具对话与 Agent 任务能力，支持思考与非思考模式切换，适用于复杂推理、代码生成及多模态理解场景。",
        "KeyModelDesc_tcadp-minimax-m2.5": "显著增强多语言编程能力，在处理 Agentic 任务时具备更高的决策成熟度，在 Word、PPT、Excel 金融建模等 workspace 高阶场景中取得了显著的能力提升。",
        "KeyModelTagVectorModel": "文本向量",
        "KeyModelTagRerankingModel": "排序模型",
        "KeyModelTagSpeechRecognition": "语音识别",
        "KeyModelTagSpeechSynthesis": "语音合成",
        "KeyModelTagTextReasoning": "文本推理",
