  trpc_go.yaml: |
    global:                             #全局配置
      namespace: Test                    #环境类型，分正式production和非正式development两种类型
      env_name: test                     #环境名称，非正式环境下多环境的名称
      enable_set: N                     #是否启用set
      full_set_name: ''                 #set名
      local_ip: ${POD_IP}
      container_name: ${POD_NAME}
      serverConnector:
        joinPoint: ${TRPC_GLOBAL_JOIN_POINT}

    server:                                            #服务端配置
      app: adp                                        #业务的应用名
      server: resource-gallery                         #进程服务名
      bin_path: /usr/local/trpc/bin/                   #二进制可执行文件和框架配置文件所在路径
      conf_path: /usr/local/trpc/conf/                 #业务配置文件所在路径
      data_path: /usr/local/trpc/data/                 #业务数据文件所在路径
      filter:                                          #针对所有service处理函数前后的拦截器列表
        - recovery
        - opentelemetry
        - i18n-adp
        - cle-route-propagator
        - cos_rewrite
      admin:
        ip: ${POD_IP}  # admin 的 ip，配置网卡 nic 也可以
        port: 8081   # admin 的 port，必须同时配置这里的 ip port 才会启动 admin
      service:                                         #业务服务提供的service，可以有多个
        - name: trpc.adp.resource_gallery.Login
          ip: ${POD_IP}
          port: 9092
          network: tcp
          protocol: trpc
          timeout: 5000
          filter:
            - session
            - permission
        - name: trpc.adp.resource_gallery.Admin
          ip: ${POD_IP}
          port: 9090
          network: tcp
          protocol: trpc
          timeout: 120000
        - name: trpc.adp.resource_gallery.Http
          ip: ${POD_IP}
          port: 9091
          network: tcp
          protocol: http
          timeout: 120000
        - name: trpc.adp.resource_gallery.OpenClawUnstableTask
          ip: ${POD_IP}
          port: 9100
          network: ${OPENCLAW_UNSTABLE_TASK_CRON}
          protocol: timer
          timeout: 3600000
        - name: trpc.adp.resource_gallery.OpenClawExpireTask
          ip: ${POD_IP}
          port: 9101
          network: ${OPENCLAW_EXPIRE_TASK_CRON}
          protocol: timer
          timeout: 3600000
        - name: trpc.adp.resource_gallery.OpenClawDeleteTask
          ip: ${POD_IP}
          port: 9102
          network: ${OPENCLAW_DELETE_TASK_CRON}
          protocol: timer
          timeout: 3600000
        - name: trpc.adp.resource_gallery.ApiKeyAccessLogCleanTask
          ip: ${POD_IP}
          port: 9104
          network: ${API_KEY_ACCESS_LOG_CLEAN_TASK_CRON}
          protocol: timer
          timeout: 3600000
        - name: trpc.adp.resource_gallery.OpenClawSkillConfirmTask
          ip: ${POD_IP}
          port: 9106
          network: ${OPENCLAW_SKILL_CONFIRM_CRON}
          protocol: timer
          timeout: 3600000
        - name: trpc.adp.resource_gallery.v2.ApiExternal
          ip: ${POD_IP}
          port: 9094
          network: tcp
          protocol: adp-capi
          timeout: 5000
          filter:
            - session
            - permission
        - name: trpc.adp.resource_gallery.v2.External
          ip: ${POD_IP}
          port: 9093
          network: tcp
          protocol: trpc
          timeout: 5000
          filter:
            - session
            - permission
    plugins:
      log:
        default:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/trpc.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
        clues:
          - writer: console
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
          - writer: file
            level: info
            formatter: json
            formatter_config:
              time_cmt: "2006-01-02T15:04:05.999999999Z07:00"
              time_key: time
              level_key: level
              name_key: name
              caller_key: caller
              message_key: message
              stacktrace_key: stackTrace
            writer_config:
              filename: /app/logs/clues.log
              write_mode: 2
              roll_type: size
              max_size: 200
              max_backups: 10
              compress: false
      telemetry:
        opentelemetry:
          addr: {{ ((.Values.global.observability).apm).otlp | default "" }}
          tenant_id: adp
          sampler:
            fraction: 1
          traces:
            disable_trace_body: false
          metrics:
            {{- if ((.Values.global.observability).apm).registry }}
            registry_endpoints: ["{{ .Values.global.observability.apm.registry}}"]
            {{- end }}
          logs:
            enabled: true
            level: "debug"
            trace_log_mode: "disable"
          {{- if ((.Values.global.observability).apm).attributes }}
          attributes:
            {{- range $key, $value := .Values.global.observability.apm.attributes }}
          - key: {{ $key }}
            value: {{ $value }}
            {{- end }}
          {{- end }}
      config:
        file:
          providers:
            - name: rainbow
              path: /app/conf/
            - name: global
              appid: ${RAINBOW_APP_ID}
              group: global
              type: kv
              env_name: ${RAINBOW_ENV_NAME}
              timeout: 2000
              enable_client_provider: true
      i18n:
        i18n:
          default_lang: ${DEFAULT_LANG}
          supported_languages:
            - zh-CN
            - en-US
          data_provider:
            type: rainbow
            prefix: biz
            error_prefix: errors
            char_scaling_factor:
              zh-CN: 1
              en-US: 3
      selector:
        polaris:
          enable_servicerouter: true # 注意这里一定要使用 true
          join_point: ${TRPC_SELECTOR_JOIN_POINT}
      filter:
        cos_rewrite:


