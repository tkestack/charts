apiVersion: v1
kind: Service
metadata:
  labels:
    app: adp-resource-gallery
  name: adp-resource-gallery
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: tcp-8081
      port: 8081
      protocol: TCP
      targetPort: 8081
    - name: tcp-9090
      port: 9090
      protocol: TCP
      targetPort: 9090
    - name: tcp-9091
      port: 9091
      protocol: TCP
      targetPort: 9091
    - name: tcp-9092
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: adp-resource-gallery-9094
      port: 9094
      protocol: TCP
      targetPort: 9094
    - name: adp-resource-gallery-9093
      port: 9093
      protocol: TCP
      targetPort: 9093
  selector:
    app: adp-resource-gallery
  sessionAffinity: None
  type: ClusterIP
