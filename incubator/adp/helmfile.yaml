# Helmfile for ADP 专有云部署
# 管理多个 Helm Charts 的部署编排
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ 部署依赖三层保证机制                                                      │
# │                                                                         │
# │ 1. Helmfile needs  - Release 级拓扑排序                                 │
# │    被需要的 release 先完成 helm install --wait，然后才部署依赖它的 release │
# │    同层服务（needs 同一上游）并行部署，互相不等待                          │
# │                                                                         │
# │ 2. Helm wait: true - Pod 级就绪等待                                     │
# │    helm install 不返回，直到 Deployment 的 Pod 达到 Ready 状态           │
# │                                                                         │
# │ 3. TKE initContainer - Pod 启动前运行时检查（仅 TKE 环境）               │
# │    check-dependencies.sh 轮询依赖 Pod 是否 Running（5s x 120 = 10min）   │
# │    通过 _helpers.tpl 中 needInitContainer 判断是否为 TKE 环境启用        │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ 部署分层与依赖图                                                         │
# │                                                                         │
# │ Pre-Install Hook                                                        │
# │   deploy-pre-check     检查 MySQL/ES/Redis/Kafka/COS/K8s 资源           │
# │     ↓ needs                                                            │
# │   deploy-data-init     cross-up version → init 或 upgrade              │
# │     ↓ needs: deploy-pre-check                                          │
# │                                                                         │
# │ Layer 0: 基础设施（无 needs）                                            │
# │   ti-common, etcd                                                      │
# │     ↓                                                                  │
# │ Layer 1: ti-base 基座服务（needs: etcd）                                 │
# │   lke-access-manager, lke-aiconf-manager, lke-ti-auth-web,             │
# │   lke-ti-gateway, lke-ti-ingress-controller, lke-ti-perm-auth          │
# │     ↓                                                                  │
# │ Layer 2: 管理后台                                                        │
# │   lke-bot-admin-config-server  needs: ti-perm-auth                    │
# │     ↓                                                                  │
# │ Layer 3: 核心配置                                                        │
# │   adp-app-config  needs: etcd（几乎所有业务服务的依赖根）                 │
# │     ↓                                                                  │
# │ Layer 4: 业务服务（needs: adp-app-config，同层并行部署）                   │
# │   adp-agent-exec, adp-apex, adp-chat-manage, adp-platform-metrology,    │
# │   adp-agent-config, adp-ai-gateway, adp-app-channel-msg,                │
# │   adp-app-channel-proxy-svr, adp-app-channel-token, adp-app-evaluate,   │
# │   adp-app-memory, adp-app-shorturl, adp-crawler, adp-file-converter,    │
# │   adp-kb-config, adp-model-token-count,                                 │
# │   adp-platform-charger, adp-platform-content-moderation,                │
# │   adp-platform-manager, adp-plugin-code-interpret,                      │
# │   adp-plugin-code-kernel, adp-plugin-config, adp-plugin-cos-util,       │
# │   adp-plugin-exec, adp-pyright, adp-rag-exec, adp-resource-gallery,     │
# │   adp-web-app, adp-workflow-config, entity-extractor-server,            │
# │   entity-extractor-server-sand-box, web-parser-server,                  │
# │   adp-markmap-service, adp-widget-config, adp-platform-authenticator,   │
# │   adp-platform-permission-config, adp-agent-file-system,                │
# │   adp-agent-sandbox, adp-agent-secret-vault                             │
# │     ↓                                                                  │
# │ Layer 5: 二级依赖服务（needs 非直接指向 adp-app-config）                  │
# │   adp-kb-retrieval       needs: adp-kb-config                          │
# │   adp-plugin-gateway     needs: adp-plugin-config + adp-plugin-exec     │
# │   adp-workflow-exec      needs: adp-workflow-config                    │
# │   adp-app-channel-leader needs: etcd                                   │
# │   adp-time-scheduler     needs: etcd + adp-chat-manage +               │
# │                                  adp-agent-config +                    │
# │                                  adp-resource-gallery                  │
# │     ↓ needs（全部 Layer 5 服务）                                         │
# │ Post-Install Hook                                                       │
# │   deploy-data-init-post  cross-up version → post-upgrade               │
# │                                                                         │
# │ 独立服务（无 needs，不参与依赖链）                                        │
# │   common-config-map, log-cleaner                                       │
# └─────────────────────────────────────────────────────────────────────────┘

# 依赖检查器全局配置（TKE initContainer 使用）
dependencyChecker:
  # 检查间隔（秒）
  checkInterval: 5
  # 最大重试次数（120次 * 5秒 = 10分钟）
  maxRetries: 120
  # 是否启用详细日志
  verbose: true

# Helmfile 全局配置
helmDefaults:
  # 等待所有资源就绪
  wait: true
  # 超时时间（秒）
  timeout: 600
  # 如果 release 不存在则创建，存在则更新
  createNamespace: true
  # 强制更新
  force: false
  # 原子操作：如果失败则回滚
  atomic: true
  # 清理失败的 release
  cleanupOnFail: true
  # Helm 命令的额外参数
  args:
    - "--debug"


# ============================================================================
# Release 配置
# ============================================================================
releases:

  #############################################################################
  # Pre-Install Hook 阶段
  # 在所有服务部署前执行，检查外部依赖 + 数据初始化/升级
  #############################################################################

  # --- 安装前依赖检查（helm.sh/hook=pre-install Job） ---
  # 检查 MySQL / Elasticsearch / Redis / Kafka / ClickHouse / VDB / COS 连通性
  # 检查 K8s 集群 CPU / 内存资源是否达标
  # 失败则中止整个安装
  - name: deploy-pre-check
    chart: ./charts/deploy-pre-check
    namespace: default
    installed: {{ env "DEPLOY_PRE_CHECK_ENABLED" | default "true" }}
    wait: true
    timeout: 600

  # --- 数据初始化/升级（helm.sh/hook=pre-install Job） ---
  # 执行 cross-up version 查询集群数据版本：
  #   无版本数据 → cross-up init     （首次安装）
  #   current < target → cross-up upgrade （版本升级）
  #   current == target → 跳过       （已是目标版本）
  - name: deploy-data-init
    chart: ./charts/deploy-data-init
    namespace: default
    installed: {{ env "DEPLOY_DATA_INIT_ENABLED" | default "true" }}
    wait: true
    timeout: 3600
    needs:
      - deploy-pre-check
    values:
      - init.enabled: true
        postUpgrade.enabled: false

  #############################################################################
  # Layer 0: 基础设施（无 needs，最先部署）
  #############################################################################

  # 公共资源（RBAC、ConfigMap 等共享资源）
  - name: ti-common
    chart: ./charts/ti-common
    namespace: default
    installed: {{ env "TI_COMMON_ENABLED" | default "true" }}
    wait: true
    timeout: 600

  # 基础存储服务（分布式锁、配置注册发现）
  - name: etcd
    chart: ./charts/etcd
    namespace: default
    installed: {{ env "ETCD_ENABLED" | default "true" }}
    wait: true
    timeout: 600

  #############################################################################
  # Layer 1: ti-base 基座服务（全部 needs: etcd）
  # 网关、认证、权限等基础设施服务，部署在业务服务之前
  #############################################################################

  # 访问管理服务
  - name: lke-access-manager
    chart: ./charts/lke-access-manager
    namespace: default
    installed: {{ env "LKE_ACCESSMANAGERSERVER_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  # AI 配置管理服务
  - name: lke-aiconf-manager
    chart: ./charts/lke-aiconf-manager
    namespace: default
    installed: {{ env "LKE_AICONFMANAGERSERVER_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  # 认证前端服务
  - name: lke-ti-auth-web
    chart: ./charts/lke-ti-auth-web
    namespace: default
    installed: {{ env "LKE_TI_AUTH_WEB_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  # 网关服务（APISIX 路由网关，所有外部请求入口）
  - name: lke-ti-gateway
    chart: ./charts/lke-ti-gateway
    namespace: default
    installed: {{ env "LKE_TI_GATEWAY_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  # Ingress 控制器
  - name: lke-ti-ingress-controller
    chart: ./charts/lke-ti-ingress-controller
    namespace: default
    installed: {{ env "LKE_TI_INGRESS_CONTROLLER_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  # 权限认证服务
  - name: lke-ti-perm-auth
    chart: ./charts/lke-ti-perm-auth
    namespace: default
    installed: {{ env "LKE_TI_PERM_AUTH_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  #############################################################################
  # Layer 2: 管理后台
  #############################################################################

  # 管理后台配置服务
  # needs 填依赖 Pod 的 app label（check-dependencies.sh 用 app=<needs名> 查 Pod）
  # lke-ti-perm-auth chart 的 Pod app label = serviceName = ti-perm-auth，故 needs 应为 ti-perm-auth
  - name: lke-bot-admin-config-server
    chart: ./charts/lke-bot-admin-config-server
    namespace: default
    installed: {{ env "ADMIN_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - ti-perm-auth

  #############################################################################
  # Layer 3: 核心配置（needs: etcd）
  # 几乎所有业务服务的依赖根，部署在 Layer 1 之后、Layer 4 之前
  #############################################################################

  # 应用核心配置服务
  - name: adp-app-config
    chart: ./charts/adp-app-config
    namespace: default
    installed: {{ env "ADP_APP_CONFIG_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  #############################################################################
  # Layer 4: 业务服务（needs: adp-app-config）
  # 30+ 个微服务，在 adp-app-config Ready 后并行部署，互相不等待
  #############################################################################

  # --- Agent 相关 ---
  - name: adp-agent-exec            # Agent 执行引擎
    chart: ./charts/adp-agent-exec
    namespace: default
    installed: {{ env "CHAT_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - adp-app-config

  - name: adp-agent-config          # Agent 配置管理
    chart: ./charts/adp-agent-config
    namespace: default
    installed: {{ env "ADP_AGENT_CONFIG_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - adp-app-config

  - name: adp-agent-file-system     # Agent 文件系统
    chart: ./charts/adp-agent-file-system
    namespace: default
    installed: {{ env "ADP_AGENT_FILE_SYSTEM_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - adp-app-config

  - name: adp-agent-sandbox         # Agent 沙箱
    chart: ./charts/adp-agent-sandbox
    namespace: default
    installed: {{ env "ADP_AGENT_SANDBOX_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - adp-app-config

  - name: adp-agent-secret-vault    # Agent 密钥保险库
    chart: ./charts/adp-agent-secret-vault
    namespace: default
    installed: {{ env "ADP_AGENT_SECRET_VAULT_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - adp-app-config

  # --- API 编排与路由 ---
  - name: adp-apex                  # API 编排/路由层
    chart: ./charts/adp-apex
    namespace: default
    installed: {{ env "CHAT_ENABLED" | default "true" }}
    wait: true
