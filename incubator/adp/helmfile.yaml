      - adp-app-config

  # --- 会话与消息 ---
  - name: adp-chat-manage           # 会话管理
    chart: ./charts/adp-chat-manage
    namespace: default
    installed: {{ env "BOT_AGENT_SERVER_ENABLED" | default "true" }}
