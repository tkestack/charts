      - adp-app-config

  - name: adp-app-channel-msg       # 渠道消息
    chart: ./charts/adp-app-channel-msg
    namespace: default
    installed: {{ env "ADP_APP_CHANNEL_MSG_ENABLED" | default "true" }}
