      - adp-plugin-config
      - adp-plugin-exec

  # 工作流执行引擎（needs: adp-workflow-config → Layer 4）
  - name: adp-workflow-exec
    chart: ./charts/adp-workflow-exec
    namespace: default
    installed: {{ env "ADP_WORKFLOW_EXEC_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - adp-workflow-config

  # 渠道 Leader 选举（needs: etcd，逻辑上属于渠道服务组）
  - name: adp-app-channel-leader
    chart: ./charts/adp-app-channel-leader
    namespace: default
    installed: {{ env "ADP_APP_CHANNEL_LEADER_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd

  # 定时调度器（多依赖：etcd + adp-chat-manage + adp-agent-config + adp-resource-gallery）
  # FIXME: needs 中 adp-app-channel 不存在，实际应为 adp-app-channel-msg / proxy-svr / token / leader
  - name: adp-time-scheduler
    chart: ./charts/adp-time-scheduler
    namespace: default
    installed: {{ env "ADP_TIME_SCHEDULER_ENABLED" | default "true" }}
    wait: true
    timeout: 600
    needs:
      - etcd
      - adp-chat-manage
      - adp-app-channel
      - adp-agent-config
      - adp-resource-gallery

  #############################################################################
  # Post-Install Hook 阶段
  # 全部服务部署完成后执行 post-upgrade 数据后置处理
  #############################################################################

  # --- 数据后置升级（helm.sh/hook=post-install Job） ---
  # 执行 cross-up version 查询 post_upgrade 版本：
  #   post_upgrade 为空或 < target → cross-up post-upgrade
  #   post_upgrade == target → 跳过（已执行）
  # needs 指向 Layer 5 全部服务，确保所有服务 Ready 后才执行
  - name: deploy-data-init-post
    chart: ./charts/deploy-data-init
    namespace: default
    installed: {{ env "DEPLOY_DATA_INIT_ENABLED" | default "true" }}
    wait: true
    timeout: 3600
    needs:
      - adp-kb-retrieval
      - adp-plugin-gateway
      - adp-workflow-exec
      - adp-app-channel-leader
      - adp-time-scheduler
    values:
      - init.enabled: false
        postUpgrade.enabled: true

  #############################################################################
  # 独立服务（无 needs，不参与依赖链，可任意时机部署）
  #############################################################################

  # 公共 ConfigMap
  - name: common-config-map
    chart: ./charts/common-config-map
    namespace: default
    installed: {{ env "COMMON_CONFIG_MAP_ENABLED" | default "true" }}
    wait: true
    timeout: 600

  # 宿主机日志清理 DaemonSet
  - name: log-cleaner
    chart: ./charts/log-cleaner
    namespace: default
    installed: {{ env "LOG_CLEANER_ENABLED" | default "true" }}
    wait: true
    timeout: 300



#############################################################################
# 模板配置（可选）
#############################################################################
templates:
  # 默认配置模板
  default: &default
    missingFileHandler: Warn
    values:
      - ./values.yaml
    verify: false

#############################################################################
# 全局 Hooks（可选）
#############################################################################
helmfiles:
  # 如果有其他 helmfile 需要包含
  # - path: ./helmfiles/monitoring.yaml
